<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Wait Benchmark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            background: -webkit-linear-gradient(45deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { color: #94a3b8; margin-bottom: 40px; text-align: center; }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .box h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        button {
            background-color: var(--accent-primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 10px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }
        
        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-area {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            min-height: 50px;
            border: 1px dashed rgba(255,255,255,0.2);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .new-element {
            padding: 8px 12px;
            background: rgba(16, 185, 129, 0.2);
            border-left: 4px solid var(--accent-success);
            border-radius: 4px;
            margin-top: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>Advanced Wait Benchmark</h1>
    <p class="subtitle">DOMの変更監視と、非同期ネットワーク通信（Fetch）の待機をテストするためのページです</p>

    <div class="container">
        <!-- DOM Mutation Test -->
        <div class="box">
            <h2>🧱 1. DOM Mutation Test</h2>
            <p style="font-size: 0.9rem; color: #cbd5e1;">ボタンを押すと、2秒間の計算（モック）の後に新しいDOM要素が動的に追加されます。マクロがこの変化を自動で検知できれば成功です。</p>
            <button id="btn-dom-mutation" onclick="triggerDomMutation()">Start DOM Mutation in 2s</button>
            <div class="status-area" id="dom-status-area">
                <span id="dom-status-text" style="color: #64748b;">Waiting for action...</span>
            </div>
        </div>

        <!-- Network Idle Test -->
        <div class="box">
            <h2>🌐 2. Network Idle Test</h2>
            <p style="font-size: 0.9rem; color: #cbd5e1;">連続したFetchリクエストを実行します。すべての非同期通信が完全に終了（Idle）するまでマクロが待機できれば成功です。</p>
            <button id="btn-network-idle" onclick="triggerNetworkRequests()">Start Mock Fetch Requests</button>
            <div class="status-area" id="net-status-area">
                <span id="net-status-text" style="color: #64748b;">Waiting for action...</span>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DOM Mutation ---
        function triggerDomMutation() {
            const btn = document.getElementById('btn-dom-mutation');
            const area = document.getElementById('dom-status-area');
            const status = document.getElementById('dom-status-text');
            
            btn.disabled = true;
            status.innerHTML = '<div class="spinner"></div> Creating DOM elements...';
            status.style.color = '#f59e0b';

            setTimeout(() => {
                const newEl = document.createElement('div');
                newEl.className = 'new-element';
                newEl.innerHTML = '<strong>✨ Success:</strong> New DOM Element was dynamically injected at ' + new Date().toLocaleTimeString();
                
                status.innerHTML = '';
                area.appendChild(newEl);
                btn.disabled = false;
            }, 2000);
        }

        // --- 2. Network Idle ---
        function triggerNetworkRequests() {
            const btn = document.getElementById('btn-network-idle');
            const status = document.getElementById('net-status-text');
            
            btn.disabled = true;
            status.innerHTML = '<div class="spinner"></div> Downloading resources from example.com...';
            status.style.color = '#f59e0b';

            // モックとして、example.comへのfetchを時間差で発行
            // CORSの制限により実際には失敗するかもしれませんが、通信自体の発火・終了フックは発現します。
            const requestNum = 3;
            let completed = 0;

            for(let i = 0; i < requestNum; i++) {
                setTimeout(() => {
                    fetch('https://example.com/?t=' + Date.now() + '&req=' + i, { mode: 'no-cors' })
                    .finally(() => {
                        completed++;
                        if(completed === requestNum) {
                            status.innerHTML = '<span style="color:#10b981;"><strong>✔️ Network Idle:</strong> All background fetches completed! (' + new Date().toLocaleTimeString() + ')</span>';
                            btn.disabled = false;
                        }
                    });
                }, i * 800); // 0ms, 800ms, 1600ms で発火
            }
        }
    </script>
</body>
</html>
