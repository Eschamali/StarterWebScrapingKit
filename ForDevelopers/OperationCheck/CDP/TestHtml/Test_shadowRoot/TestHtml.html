<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow DOM Test Benchmark - UI Version</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --accent-success: #10b981;
            --btn-hover: #2563eb;
            --log-bg: #0b0f19;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: -webkit-linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 40px;
            color: #94a3b8;
            font-size: 1.1rem;
            text-align: center;
            max-width: 600px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
            border-color: var(--accent-primary);
        }

        .box h2 {
            margin-top: 0;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .target-text {
            font-size: 1rem;
            margin: 15px 0;
            color: #cbd5e1;
        }

        button {
            background-color: var(--accent-primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-right: 10px;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }

        button:hover {
            background-color: var(--btn-hover);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        input[type="text"] {
            background-color: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 1rem;
            width: calc(100% - 30px);
            margin-top: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-secondary);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
        }

        .log-container {
            width: 100%;
            max-width: 1200px;
            margin-top: 30px;
        }

        .result-log {
            background: var(--log-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            color: #10b981;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .log-entry {
            margin-bottom: 5px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 3px;
            animation: fadeIn 0.3s ease-out;
        }

        .log-time { color: #64748b; margin-right: 10px; }
        .log-highlight { color: #f59e0b; font-weight: bold; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Badge Styles */
        .badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .badge-light { background: #475569; color: white; }
        .badge-shallow { background: #0284c7; color: white; }
        .badge-deep { background: #be185d; color: white; }
    </style>
</head>
<body>

    <h1>Shadow DOM Explorer</h1>
    <p class="subtitle">マクロからの直接操作が画面上にどう反映されるかを視覚的に確認するためのテストベンチマークです。<br>VBEから <code>Demo_ShadowDOMSearch.bas</code> を実行して動きを確認してください。</p>

    <div class="container">
        <!-- 1. Light DOM -->
        <div class="box" id="light-dom-section">
            <h2><span class="badge badge-light">Level 0</span> Light DOM</h2>
            <p class="target-text">通常のDOM。<code>querySelector</code> で容易に探索可能です。</p>
            <button id="light-btn" onclick="log('💡 Light Button clicked!', true)">Light Button</button>
            <input type="text" id="light-input" value="light value">
        </div>

        <!-- 2. Shallow Shadow DOM -->
        <div class="box" id="shadow-host-1"></div>

        <!-- 3. Deep Shadow DOM -->
        <div class="box" id="shadow-host-2"></div>
    </div>

    <!-- Logger -->
    <div class="log-container">
        <h2 style="font-size: 1.2rem; margin-bottom: 10px; color: #e2e8f0;">📝 Execution Log</h2>
        <div class="result-log" id="log-output"></div>
    </div>

    <script>
        function log(msg, highlight = false) {
            const logger = document.getElementById('log-output');
            const time = new Date().toLocaleTimeString();
            const hs = highlight ? "log-highlight" : "";
            logger.innerHTML += `<div class="log-entry"><span class="log-time">[${time}]</span> <span class="${hs}">${msg}</span></div>`;
            logger.scrollTop = logger.scrollHeight;
        }

        // 共通のCSSをShadow DOMに注入するためのヘルパー
        const commonStyles = `
            h2 { margin-top: 0; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; color: #e2e8f0; font-family: 'Inter', sans-serif; font-weight: 600; }
            .target-text { font-size: 1rem; margin: 15px 0; color: #cbd5e1; font-family: 'Inter', sans-serif; transition: color 0.3s; }
            button { background-color: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-right: 10px; font-family: 'Inter', sans-serif; }
            button:hover { background-color: #0369a1; transform: scale(1.05); }
            button:active { transform: scale(0.95); }
            input[type="text"] { background-color: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 14px; border-radius: 6px; font-size: 1rem; width: calc(100% - 30px); margin-top: 10px; transition: all 0.3s; font-family: 'Inter', sans-serif; }
            input[type="text"]:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.3); }
            .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; text-transform: uppercase; }
            .badge-shallow { background: #0284c7; color: white; }
            .badge-deep { background: #be185d; color: white; }
        `;

        // --- Shallow Shadow DOM ---
        const host1 = document.getElementById('shadow-host-1');
        const shadow1 = host1.attachShadow({mode: 'open'});
        shadow1.innerHTML = `
            <style>${commonStyles}</style>
            <div>
                <h2><span class="badge badge-shallow">Level 1</span> Shallow Shadow</h2>
                <p class="target-text" id="shallow-text">Shadow Root (Open) の直下の要素です。<br>通常の検索エンジンでは見つかりません。</p>
                <button id="shadow1-btn">Shadow1 Button</button>
                <input type="text" id="shadow1-input" value="shadow1 value">
            </div>
        `;
        shadow1.getElementById('shadow1-btn').addEventListener('click', () => {
            log('🌊 Shadow1 Button clicked!', true);
            shadow1.getElementById('shadow1-btn').style.backgroundColor = '#10b981';
            shadow1.getElementById('shadow1-btn').innerText = 'Clicked!';
        });

        const s1Input = shadow1.getElementById('shadow1-input');
        s1Input.addEventListener('input', (e) => log(`[Shallow Input changed] ${e.target.value}`));

        // --- Deep Shadow DOM ---
        const host2 = document.getElementById('shadow-host-2');
        const shadow2 = host2.attachShadow({mode: 'open'});
        shadow2.innerHTML = `
            <style>
                h2 { margin-top: 0; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; color: #e2e8f0; font-family: 'Inter', sans-serif; font-weight: 600; }
                .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 12px; font-weight: bold; text-transform: uppercase; }
                .badge-nest { background: #9333ea; color: white; }
                p { color: #cbd5e1; font-family: 'Inter', sans-serif; }
            </style>
            <div>
                <h2><span class="badge badge-nest">Level 2 Container</span> Deep Nest</h2>
                <p>Shadow DOMの中に、さらに独立したShadow DOMを入れ子にしています。</p>
                <div id="inner-host" style="margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 8px; border: 1px dashed rgba(255,255,255,0.2);"></div>
            </div>
        `;

        // Create inner shadow root (level 2)
        const innerHost = shadow2.getElementById('inner-host');
        const innerShadow = innerHost.attachShadow({mode: 'open'});
        innerShadow.innerHTML = `
            <style>
                ${commonStyles}
                button { background-color: #be185d; }
                button:hover { background-color: #db2777; }
                .deep-text-unique { font-weight: bold; color: #f43f5e; padding: 10px; background: rgba(244, 63, 94, 0.1); border-radius: 6px;}
            </style>
            <div>
                <p class="target-text deep-text-unique" id="deep-text">This is inside DEEP Shadow DOM.</p>
                <button id="deep-btn">Deep Button</button>
                <input type="text" id="deep-input" value="deep value">
            </div>
        `;
        
        const dBtn = innerShadow.getElementById('deep-btn');
        dBtn.addEventListener('click', () => {
            log('🔥 Deep Button clicked!', true);
            dBtn.style.backgroundColor = '#10b981';
            dBtn.innerText = 'Success!';
            innerShadow.getElementById('deep-text').style.color = '#10b981';
        });

        const dInput = innerShadow.getElementById('deep-input');
        dInput.addEventListener('input', (e) => log(`[Deep Input changed] ${e.target.value}`));

        log("🚀 Benchmark Environment Ready.", false);
    </script>
</body>
</html>
