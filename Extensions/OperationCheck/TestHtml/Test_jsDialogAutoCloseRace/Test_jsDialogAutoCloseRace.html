<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JSDialogRace</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; padding: 16px; }
    #status { margin-top: 12px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; min-height: 24px; }
  </style>
</head>
<body>
  <h3>JSDialog auto-close race test page</h3>
  <button id="btn">click open alert</button>
  <div>status: <span id="status"></span></div>

  <script>
    (function(){
      let clickCount = 0;
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');

      window.__lastAlertMsg = "";
      window.__closedCount = 0;

      btn.addEventListener('click', function(){
        clickCount++;
        const msg = 'RACE_ALERT_' + clickCount;
        window.__lastAlertMsg = msg;
        // modal dialog (alert)
        alert(msg);
        window.__closedCount++;
        status.textContent = msg + '_closed';
      });
    })();
  </script>
</body>
</html>
