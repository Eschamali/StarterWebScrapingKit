<script>window.TL={"fps": 30, "duration": 1068.489, "scenes": {"open": {"start": 0.0, "first": 2.6, "end": 59.175}, "ep1": {"start": 59.175, "first": 62.575, "end": 117.708}, "ep2": {"start": 117.708, "first": 121.108, "end": 176.899}, "ep3": {"start": 176.899, "first": 180.299, "end": 225.621}, "ep4": {"start": 225.621, "first": 229.021, "end": 255.943}, "ep5": {"start": 255.943, "first": 259.343, "end": 297.251}, "ep6": {"start": 297.251, "first": 300.651, "end": 368.639}, "ep7": {"start": 368.639, "first": 372.039, "end": 436.588}, "ep8": {"start": 436.588, "first": 439.988, "end": 590.709}, "ep9": {"start": 590.709, "first": 594.109, "end": 718.471}, "ep10": {"start": 718.471, "first": 721.871, "end": 792.923}, "epi": {"start": 792.923, "first": 796.323, "end": 850.861}, "after": {"start": 850.861, "first": 854.261, "end": 938.661}, "post": {"start": 938.661, "first": 942.061, "end": 1056.173}, "colophon": {"start": 1056.173, "first": 1057.573, "end": 1068.489}}, "lines": {"op1": {"start": 2.6, "end": 7.229, "text": "かつて Excel を使う人の手元には、一本の魔法の杖があったのだ。", "scene": "open"}, "op2": {"start": 7.629, "end": 11.427, "text": "たった数行で、準備もなしに、ブラウザが立ち上がったのだ。", "scene": "open"}, "op3": {"start": 11.827, "end": 16.765, "text": "起動中の IE をつかむのも、フォームに呼び出すのも、コピペで動いたのだ。", "scene": "open"}, "op4": {"start": 17.365, "end": 22.08, "text": "IE のサポート終了は、その手軽さを、丸ごと奪っていったのだ。", "scene": "open"}, "op5": {"start": 23.08, "end": 31.581, "text": "いまの主流の SeleniumVBA も、裏には WebDriver の管理や、社内の通信環境、セキュリティの壁がつきまとうのだ。", "scene": "open"}, "op6": {"start": 32.181, "end": 36.939, "text": "あの頃の手軽さを、AIで復活させられないだろうか……", "scene": "open"}, "op7": {"start": 37.639, "end": 44.956, "text": "2025年の年末、開発が始まった。最初のコミットは、他人のライブラリの寄せ集めだったのだ。", "scene": "open"}, "op8": {"start": 45.456, "end": 53.275, "text": "寄せ集めのマクロブックが、コアエンジンになるまで。73個のタグに刻まれた、301日の物語なのだ。", "scene": "open"}, "yo1": {"start": 62.575, "end": 69.348, "text": "答えは、もうネットにあったのだ。kabkabkab さんと、longvh211 さんの作品なのだ。", "scene": "ep1"}, "yo2": {"start": 69.648, "end": 78.907, "text": "でも本格的に使うと、気になる点が出てきた。接続がたまに失敗する。要素が見つからない。別のタブに飛ぶと、むずかしい。", "scene": "ep1"}, "yo3": {"start": 79.207, "end": 85.447, "text": "作者に聞こうにも、2024年7月23日を最後に、返事は途絶えていたのだ。", "scene": "ep1"}, "yo4": {"start": 86.247, "end": 90.887, "text": "残る道はひとつ。AIと一緒に、仕組みを理解して直すのだ。", "scene": "ep1"}, "yo5": {"start": 91.387, "end": 97.669, "text": "ソースを並べた第一印象。こっちはクラスが多すぎる。こっちは少なくて、シンプルに見える。", "scene": "ep1"}, "yo6": {"start": 97.969, "end": 105.649, "text": "ファイル数が少ないから。そんな雑すぎる理由で、土台が決まったのだ。足りない機能は、あとからAIと足せばいい。", "scene": "ep1"}, "yo7": {"start": 106.149, "end": 116.208, "text": "仕様変更への対応と終了判定を直し、設定はワークシートに集めた。v1.0.0、2025年12月20日の公開なのだ。", "scene": "ep1"}, "so1": {"start": 121.108, "end": 126.825, "text": "ある日見つけたのは、SeleniumVBA で WebDriver BiDi につなぐ挑戦の記事。", "scene": "ep2"}, "so2": {"start": 127.125, "end": 133.323, "text": "結果を受け取るだけの一方通行と違って、BiDi なら、ブラウザのほうから知らせが届くのだ。", "scene": "ep2"}, "so3": {"start": 133.623, "end": 139.105, "text": "ページを読み終えた。アラートが出た。スマホの通知みたいに、勝手に来るのだ。", "scene": "ep2"}, "so4": {"start": 139.405, "end": 145.656, "text": "CDP にも同じ仕組みがある。届いた知らせを Dictionary にためる、v1.1.0 なのだ。", "scene": "ep2"}, "so5": {"start": 146.256, "end": 150.8, "text": "次の壁は、日本語。日本語が入ると、エラーになるのだ。", "scene": "ep2"}, "so6": {"start": 151.1, "end": 159.249, "text": "UTF-8 への変換で必ず出てくるのが、ADODB.Stream。でも作者は、どうも納得できなかったのだ。", "scene": "ep2"}, "so7": {"start": 159.549, "end": 164.403, "text": "ストリームなのに、なんで文字コードの変換をしてるんだ……", "scene": "ep2"}, "so8": {"start": 164.903, "end": 175.399, "text": "Windows API で変換する方法に切り替えて、v1.4.0。ADODB.Stream は追放されたのだ。……この追放には、続きがあるのだ。", "scene": "ep2"}, "hi1": {"start": 180.299, "end": 184.597, "text": "元の受信ロジックには、こんな一行が、あちこちにあったのだ。", "scene": "ep3"}, "hi2": {"start": 184.897, "end": 194.167, "text": "VBA の文字列は、つなぐたびに引っ越しをするのだ。土地を探し、荷物を全部運び、新しい荷物を置いて、元の家を壊す。", "scene": "ep3"}, "hi3": {"start": 194.467, "end": 201.101, "text": "荷物がふくらむほど、遅くなる。作者は Split で一気にばらして、結合地獄を抜け出したのだ。", "scene": "ep3"}, "hi4": {"start": 201.401, "end": 203.663, "text": "戦いは、終わったかに見えた……。", "scene": "ep3"}, "hi5": {"start": 204.663, "end": 213.527, "text": "次の壁は、JavaScript のアラート。人が押すまで、ブラウザは返事をしない。VBA は待ち続けて、タイムアウトなのだ。", "scene": "ep3"}, "hi6": {"start": 213.827, "end": 220.44, "text": "答えは、投げっぱなしの非同期。ダイアログが開いた知らせは、あの Dictionary が拾ってくれるのだ。", "scene": "ep3"}, "hi7": {"start": 220.74, "end": 224.121, "text": "このデモができたときは、いい気持ちだったのだ。", "scene": "ep3"}, "bd1": {"start": 229.021, "end": 236.296, "text": "SeleniumVBA の議論に刺さった一言。CDP には未来がない、いずれ BiDi に置き換わる、と。", "scene": "ep4"}, "bd2": {"start": 236.596, "end": 242.729, "text": "けれど、Edge は最初から入っている。置けないのは、野良の WebDriver.exe だけなのだ。", "scene": "ep4"}, "bd3": {"start": 243.229, "end": 245.309, "text": "……だったら、やってやろうじゃないか！", "scene": "ep4"}, "bd4": {"start": 245.909, "end": 254.443, "text": "2万行の JavaScript を Excel にしまって、BiDi も動かした。この話は、別の映像「BiDi Story」で語っているのだ。", "scene": "ep4"}, "js1": {"start": 259.343, "end": 264.217, "text": "CDP がわかってくると、元のコードの簡素さが、気になってきたのだ。", "scene": "ep5"}, "js2": {"start": 264.517, "end": 271.92, "text": "JavaScript の実行には、膨大なパラメータがある。作者は実務で効くものを、片っ端から実装したのだ。", "scene": "ep5"}, "js3": {"start": 272.22, "end": 276.903, "text": "引数の定義は、行継続の記号が並ぶ、弾幕になったのだ。", "scene": "ep5"}, "js4": {"start": 277.403, "end": 286.555, "text": "要素の扱いも見直した。元の実装は、ページの window にランダムな変数を生やしていた。ボット検知に、一発で見破られるのだ。", "scene": "ep5"}, "js5": {"start": 286.855, "end": 295.751, "text": "CDP 標準の objectId に切り替えて、ページを汚さない。書き換えの多いこの仕事は、AIの出番だったのだ。", "scene": "ep5"}, "gd1": {"start": 300.651, "end": 307.328, "text": "いちばん大変だった改修のきっかけは、5つのアカウントの請求書を、毎月落とす仕事だったのだ。", "scene": "ep6"}, "gd2": {"start": 307.628, "end": 313.655, "text": "5つを同時に走らせると、エラー。いまの知らせはどのタブ宛てか、混線したのだ。", "scene": "ep6"}, "gd3": {"start": 313.955, "end": 318.413, "text": "順番に回せば、動く。遅いけれど、動く。でも……", "scene": "ep6"}, "gd4": {"start": 318.813, "end": 323.123, "text": "5つの画面が、一斉に変わる景色が見たいんだ……", "scene": "ep6"}, "gd5": {"start": 323.623, "end": 325.457, "text": "AI、助けて……", "scene": "ep6"}, "gd6": {"start": 326.057, "end": 331.956, "text": "答えは RaiseEvent。2026年5月30日、解体が始まったのだ。", "scene": "ep6"}, "gd7": {"start": 332.256, "end": 346.624, "text": "1週間で15ファイル。5,887行を足して、4,692行を削った。3,304行の CDPBrowser は、ブラウザ、タブ、通信コアの3つに割れたのだ。", "scene": "ep6"}, "gd8": {"start": 346.924, "end": 353.047, "text": "コアは、届いた知らせを種類ごとに投げるだけ。ブラウザとタブは、自分宛てだけを拾うのだ。", "scene": "ep6"}, "gd9": {"start": 353.347, "end": 359.789, "text": "起動ボタンを押すと、5つの Edge が一斉に開き、混線せずに、請求書を集めていく。", "scene": "ep6"}, "gd10": {"start": 360.289, "end": 366.039, "text": "動いた……。Excel VBA だけで、ブラウザが同時に動いてる……", "scene": "ep6"}, "zc1": {"start": 372.039, "end": 380.977, "text": "パケットを読む一番奥では、8年以上止まった VBA-JSON が、全部の値をコピーしていた。欲しいのは、たいてい一部なのに。", "scene": "ep7"}, "zc2": {"start": 381.277, "end": 390.856, "text": "そこへ現れた vbacollective-json は、文字列をコピーせずに読む、ゼロコピー。書き出しは、VBA-FastJSON に任せたのだ。", "scene": "ep7"}, "zc3": {"start": 391.156, "end": 394.399, "text": "ゼロコピー……なんか、カッコいいな。", "scene": "ep7"}, "zc4": {"start": 394.899, "end": 401.117, "text": "……待てよ。100件届いたら、Split で100個の文字列を作って、まとめて捨ててる……", "scene": "ep7"}, "zc5": {"start": 401.517, "end": 410.253, "text": "目指したのは、1つの巨大なバッファと、Mid$ のカーソル。書ききれなければ、一気に2倍に広げる。名付けて、バインバイン。", "scene": "ep7"}, "zc6": {"start": 410.753, "end": 417.068, "text": "バイト列をためる器に選んだのは、追放したはずの ADODB.Stream だったのだ。", "scene": "ep7"}, "zc7": {"start": 417.468, "end": 423.815, "text": "変換器なんかじゃない。メモリの上で最速の、バッファそのものだったんだ……", "scene": "ep7"}, "zc8": {"start": 424.315, "end": 435.088, "text": "道具が悪いのではなく、使いどころを間違えていただけ。こうして v2.2.0。このコアは、別の映像「コア設計 徹底比較」で比べているのだ。", "scene": "ep7"}, "ws1": {"start": 439.988, "end": 446.42, "text": "通信路は、ずっとパイプひとつ。業務の自動化なら、99%はそれで足りるのだ。", "scene": "ep8"}, "ws2": {"start": 446.72, "end": 456.651, "text": "でも作者は、残り1%のロマンを見てしまった。起動済みのブラウザ、USB の向こうの Android。パイプでは、届かない相手なのだ。", "scene": "ep8"}, "ws3": {"start": 456.951, "end": 462.433, "text": "起動済みのブラウザを操る。それは IE の頃の、2つ目の魔法でもあったのだ。", "scene": "ep8"}, "ws4": {"start": 462.933, "end": 471.125, "text": "まず試したのは、WinHTTP の WebSocket。ところが、データがないときに受信を呼ぶと、Excel が固まるのだ。", "scene": "ep8"}, "ws5": {"start": 471.425, "end": 472.609, "text": "AIに聞くと……", "scene": "ep8"}, "ws6": {"start": 472.809, "end": 475.871, "text": "タイムアウトを設定すれば、行けるよ！", "scene": "ep8"}, "ws7": {"start": 476.171, "end": 483.648, "text": "試しても、だめ。伝えても、また別のタイムアウト。初めて体験した、AIのハルシネーションなのだ。", "scene": "ep8"}, "ws8": {"start": 483.948, "end": 491.361, "text": "ドキュメントを読むと、WebSocket にはタイムアウトの設定自体がない。そのことは、どこにも書いていなかったのだ。", "scene": "ep8"}, "ws9": {"start": 491.661, "end": 498.541, "text": "頼みのコールバックは、別のスレッドから割り込んでくる。マクロを止めた瞬間、Excel ごと落ちるのだ。", "scene": "ep8"}, "ws10": {"start": 498.841, "end": 503.727, "text": "WinHTTP は、VBA にとって死のルートだ……", "scene": "ep8"}, "ws11": {"start": 504.427, "end": 511.413, "text": "AIとの対話で出てきた言葉は、WinSock。パイプにネットワークを足しただけの、ただの土管なのだ。", "scene": "ep8"}, "ws12": {"start": 511.713, "end": 521.537, "text": "WebSocket は魔法のパイプではない。土管の上に、決まった形の封筒を流しているだけ。そのルールが、RFC 6455 なのだ。", "scene": "ep8"}, "ws13": {"start": 521.837, "end": 530.072, "text": "荷札を付ける。4バイトで目隠しをする。大きな荷物は小分けにする。仕様の翻訳は、AIの得意分野なのだ。", "scene": "ep8"}, "ws14": {"start": 530.372, "end": 540.665, "text": "既製の wasabi も検討した。でも握手の Origin ヘッダーで、CDP に 403 で断られる。受信キューは512件で、あふれたら捨てられるのだ。", "scene": "ep8"}, "ws15": {"start": 540.965, "end": 551.451, "text": "汎用の部品と、CDP 専用の部品では、求められるものが違った。CDP 専用と割り切った自作のコアは、約1,400行に収まったのだ。", "scene": "ep8"}, "ws16": {"start": 551.751, "end": 561.98, "text": "WebSocket のデータは、終わりにヌル文字を付けて、ADODB.Stream へ。そこから先は、パイプとまったく同じ流れ。v2.3.0 なのだ。", "scene": "ep8"}, "ws17": {"start": 562.58, "end": 571.999, "text": "相手は、自分が起動した Edge だけだった。WinSock で RFC 6455 を自前で実装した瞬間、その檻が、壊れたのだ。", "scene": "ep8"}, "ws18": {"start": 573.799, "end": 579.975, "text": "目の前のブラウザ。USB の向こうの Android。ほかのアプリの中の WebView2。", "scene": "ep8"}, "ws19": {"start": 580.575, "end": 588.809, "text": "99%には、パイプで足りる。それでもこの1%が、いちばん「やってやった」と思えた景色だったのだ。", "scene": "ep8"}, "wv1": {"start": 594.109, "end": 598.92, "text": "実は2026年の3月、作者は、ある種を埋めていたのだ。", "scene": "ep9"}, "wv2": {"start": 599.22, "end": 604.841, "text": "Access のフォームには、WebView2 のコントロールがある。でも、Excel には無い。", "scene": "ep9"}, "wv3": {"start": 605.141, "end": 608.501, "text": "公式が用意しないなら、Excel だけで埋め込んでやる！", "scene": "ep9"}, "wv4": {"start": 609.001, "end": 615.273, "text": "AIの案は、Edge を SetParent でフォームに埋め込む方法。見た目は、そっくりなのだ。", "scene": "ep9"}, "wv5": {"start": 615.573, "end": 621.717, "text": "でもそれは Edge.exe。本物の WebView2 じゃないと、嫌だ……", "scene": "ep9"}, "wv6": {"start": 622.217, "end": 628.159, "text": "IE の頃は、起動も、フォームへの埋め込みもできた。今は、片方ができないのだ。", "scene": "ep9"}, "wv7": {"start": 628.459, "end": 636.928, "text": "見つけたのは、たーぼーさんの記事。DLL も参照設定も要らず、VBA だけで、本物の WebView2 が動くのだ。", "scene": "ep9"}, "wv8": {"start": 637.228, "end": 648.865, "text": "vtable、COM、参照カウント。最初は呪文だった。でもAIと解剖すると、関数の番地を手計算して直接呼ぶ、正統派の力技だったのだ。", "scene": "ep9"}, "wv9": {"start": 649.165, "end": 656.984, "text": "3月15日、フォームに本物の WebView2 が映った。でも本体には、まだ RaiseEvent の土台がなかったのだ。", "scene": "ep9"}, "wv10": {"start": 657.284, "end": 665.604, "text": "機能をコピーした別ツールは、修正が毎回2か所。4月4日を最後に、ブランチは4か月半、凍りついたのだ。", "scene": "ep9"}, "wv11": {"start": 666.204, "end": 674.076, "text": "その間に本体は、解体、ゼロコピー、WinSock と育ち、通信路を素直に増やせる土台になっていたのだ。", "scene": "ep9"}, "wv12": {"start": 674.376, "end": 680.435, "text": "8月、たーぼーさんから一通の報告。ページ自動制御の土台ができました、と。", "scene": "ep9"}, "wv13": {"start": 680.735, "end": 684.543, "text": "いまなら、あのブランチ、復活できそうじゃね……！", "scene": "ep9"}, "wv14": {"start": 685.043, "end": 693.363, "text": "掘り起こすと、実質1からのやり直し。それでも、パイプ、WebSocket に続く、第3のルートが開通したのだ。", "scene": "ep9"}, "wv15": {"start": 693.663, "end": 701.705, "text": "2026年8月30日、v3.0.0。163のコミットが、1つのタグに束ねられたのだ。", "scene": "ep9"}, "wv16": {"start": 702.005, "end": 709.312, "text": "起動する。起動中をつかむ。フォームに呼び出す。IE の頃の3つの魔法が、すべてそろったのだ。", "scene": "ep9"}, "wv17": {"start": 710.712, "end": 716.771, "text": "半年寝かせた種は、腐っていなかった。畑を耕し続けたことが、ものを言ったのだ。", "scene": "ep9"}, "ir1": {"start": 721.871, "end": 727.268, "text": "295日目。3度目のメジャーアップデート、v4.0.0 なのだ。", "scene": "ep10"}, "ir2": {"start": 727.568, "end": 736.987, "text": "経路は、CDP がパイプ、WebSocket、COM。BiDi が2つ。ブラウザは Edge と Chrome の、安定版から Canary まで。", "scene": "ep10"}, "ir3": {"start": 737.287, "end": 744.572, "text": "起動のたびにセルを読み、引数を渡し……さすがに、嫌気がさしたのだ……", "scene": "ep10"}, "ir4": {"start": 745.072, "end": 751.781, "text": "先人の SeleniumVBA たちは、設定を専用のクラスにまとめていた。オプションオブジェクトなのだ。", "scene": "ep10"}, "ir5": {"start": 752.081, "end": 759.271, "text": "再接続もそう。経路ごとに分かれて増えた reattach は、渡す中身で経路を表せば、ただ1つでいい。", "scene": "ep10"}, "ir6": {"start": 759.571, "end": 766.867, "text": "それは、本家が最初から持っていた形。先人の設計は、偉大だったのだ。", "scene": "ep10"}, "ir7": {"start": 767.467, "end": 774.795, "text": "純 WebSocket 機能は廃止。作者は、自分が CDP 特化のものを作っていたと、気づいたのだ。", "scene": "ep10"}, "ir8": {"start": 775.095, "end": 783.425, "text": "v4.1.0 では、BiDi の要素ヘルパーを、CDP と1つのクラスにまとめかけた。けれど、仕様の差が大きすぎた。", "scene": "ep10"}, "ir9": {"start": 783.825, "end": 785.713, "text": "……やっぱり分けます。", "scene": "ep10"}, "ir10": {"start": 786.313, "end": 791.423, "text": "似ているからこそ、分ける。遠回りの末に、たどり着いた形なのだ。", "scene": "ep10"}, "nm1": {"start": 796.323, "end": 808.632, "text": "CDPBrowser の行数が、この物語のすべて。1,408行から3,304行に太り、1,357行に砕かれ、1,022行まで細くなったのだ。", "scene": "epi"}, "nm2": {"start": 808.932, "end": 821.049, "text": "73個のタグのうち、胸を張れる大改修は5つか6つ。残りは、1行だけの恥ずかしい修正なのだ。でも、その積み重ねでしか、安定には届かなかった。", "scene": "epi"}, "nm3": {"start": 821.349, "end": 827.952, "text": "追放した道具は戻り、凍らせたブランチは合流した。伏線は、必ず回収されるのだ。", "scene": "epi"}, "nm4": {"start": 828.552, "end": 841.277, "text": "魔法の杖を失ってから301日。目の前の Edge も、USB の向こうの Android も、Excel の中の WebView2 も、同じ顔で動かせる、1枚のマクロブックができたのだ。", "scene": "epi"}, "nm5": {"start": 841.577, "end": 849.161, "text": "外部ツールのインストールは、一切不要。WebDriver も、アドインも、管理者権限も、いらないのだ。", "scene": "epi"}, "ag1": {"start": 854.261, "end": 857.205, "text": "ここまで磨き上げて、作者は気づいたのだ。", "scene": "after"}, "ag2": {"start": 857.505, "end": 861.601, "text": "あれ……ロジック、全部オレオレルールだ……", "scene": "after"}, "ag3": {"start": 862.101, "end": 873.259, "text": "IE の時代は Microsoft が、WebDriver の時代はドライバーが、その次は Puppeteer や Playwright が、面倒を見てくれた。このツールは……全部、作者なのだ。", "scene": "after"}, "ag4": {"start": 873.759, "end": 877.439, "text": "作者はいつの間にか、メーカーの立場になっていたのだ。", "scene": "after"}, "ag5": {"start": 877.939, "end": 888.893, "text": "IE は機能の数だけメソッドがあった。Chromium は極論、文字列。だから新機能が出たら、ツールの更新を待たずに、生の CDP ですぐ試せるのだ。", "scene": "after"}, "ag6": {"start": 889.193, "end": 902.196, "text": "そして、AIには「面倒」がない。欲しい機能は、ExecuteCDP を通して、AIに作ってもらえばいい。コアは基本料金0円の土台。povo 2.0 の考え方なのだ。", "scene": "after"}, "ag7": {"start": 902.796, "end": 908.631, "text": "ふつうの業務なら、Playwright や SeleniumVBA を選んで、全然かまわないのだ。", "scene": "after"}, "ag8": {"start": 909.131, "end": 918.581, "text": "でも、セキュリティの壁で何も入れられず、それでも自動化を諦めきれない人がいたら。配線をつなぐ泥くさい楽しさに、魅入られた人がいたら。", "scene": "after"}, "ag9": {"start": 918.881, "end": 923.82, "text": "真っ白な土台と、1本の土管が、最高の遊び場になるはずなのだ。", "scene": "after"}, "ag10": {"start": 924.52, "end": 935.261, "text": "VBA という古い世界から、最新の Chromium を完全支配する。そんなロマンに共感してくれる人に、このコードが届くことを祈っているのだ。", "scene": "after"}, "ex1": {"start": 942.061, "end": 948.963, "text": "ある日、ひとつのポストを共有されたのだ。明日から、AI活用の最先端についていく方法。", "scene": "post"}, "ex2": {"start": 949.263, "end": 953.86, "text": "読み返すと、この301日に、驚くほど当てはまっていたのだ。", "scene": "post"}, "ex3": {"start": 954.36, "end": 957.613, "text": "言葉を知るということは、概念を知るということ。", "scene": "post"}, "ex4": {"start": 958.013, "end": 969.853, "text": "COM、vtable、サンク。その言葉を知ったから、WebView2 を組み立てられた。突き詰めた先で、RFC 6455 という言葉にもたどり着いたのだ。", "scene": "post"}, "ex5": {"start": 970.353, "end": 973.799, "text": "勉強してから作るのではなく、作りながら学ぶ。", "scene": "post"}, "ex6": {"start": 974.199, "end": 983.713, "text": "あの頃の IE の自由さが Chromium に来たら、わくわくしそうじゃね。作りながら、WebSocket の中身も、低レイヤーの基礎も身についたのだ。", "scene": "post"}, "ex7": {"start": 984.213, "end": 989.056, "text": "足りないパーツは、何をそろえればいいか、AIに聞けば教えてくれる。", "scene": "post"}, "ex8": {"start": 989.456, "end": 998.8, "text": "複数タブの相談には、RaiseEvent の案が返ってきた。意味を知っていたから、フレームの組み立ても、vtable の土台も、頼めたのだ。", "scene": "post"}, "ex9": {"start": 999.3, "end": 1006.393, "text": "楽しすぎて、ゲームも買わなくなる……はずが、作者は積みゲーと、録りためた番組が増えたのだ。", "scene": "post"}, "ex10": {"start": 1006.993, "end": 1017.681, "text": "どの Windows でも準備なしの CreateObj // ---- 縦書き ----

// ---- 吹き出し ----

// AI（角の丸い画面の顔に、アンテナ）。expr: normal / happy（^^）/ wink / think（…）/ sweat

  const t = o.t || 0, lw = Math.max(2.5, s * .07), color = o.color;

// ---- 判子・付箋 ----

// 判子（朱の丸に文字）。p で押される（大きく出て、着地で少しつぶれる）
function hanko(lines, x, y, s, p, o = {}) {
  if (p <= 0) return;
  const k = p < .25 ? lerp(1.9, .94, E.in(p / .25)) : lerp(.94, 1, E.out((p - .25) / .3));
  const c = o.color || COL.red;
  ctx.save();

  else { ctx.beginPath(); ctx.arc(0, 0, s, 0, 7); ctx.lineWidth = s * .09; ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, s * .84, 0, 7); ctx.lineWidth = s * .03; ctx.stroke(); }

  // 円の中に収まるよう、いちばん長い行に合わせて縮める
  const mw = Math.max(...lines.map(ln => measure(ln, `900 ${fs}px ${SERIF}`)));
  if (mw > s * 1.42) fs *= s * 1.42 / mw;
  lines.forEach((ln, i) => txt(ln, 0, (i - (n - 1) / 2) * fs * 1.18 + fs * .05, { font: `900 ${fs}px ${SERIF}`, align: 'center', color: c }));

  ctx.fillStyle = o.paper || PAGE.panelBg;
  for (let i = 0; i < 26; i++) { const a = hr(i * 7.1 + (o.seed || 0)) * 7, r = s * hr(i * 3.3 + 1) * 1.02; ctx.beginPath(); ctx.arc(Math.cos(a) * r, Math.sin(a) * r, s * (.015 + hr(i) * .03), 0, 7); ctx.fill(); }
  ctx.restore();
}

// 伏線の札（朱の札にひも）。o.done で「回収」の判子が付く

// ---- コード ----

const KW = /^(Dim|As|Set|Sub|End|Function|Private|Public|Const|String|Long|Boolean|If|Then|Else|ElseIf|Do|Loop|For|To|Next|Exit|Mod|Or|And|Not|Static|New|Event|RaiseEvent|WithEvents|Property|Let|Get|Optional|Case|Select|Enum|ByVal|ByRef|Call|Nothing|True|False|Is|Each|In|Object|Variant|Dictionary)$/;
function tokens(line) {
  const out = [];
  const re = /('.*$)|("[^"]*"?)|(\s+)|([A-Za-z_][\w$]*)|(&H[0-9A-Fa-f]+|\d+(\.\d+)?)|(.)/g;
  let m;
  while ((m = re.exec(line))) {
    const [s, com, str, sp, id, num] = m;
    let c = '#e5e7eb';
    if (com) c = '#8b95a5';
    else if (str) c = '#a5e3a0';
    else if (sp) c = null;
    else if (id) c = KW.test(id) ? '#c4b5fd' : /^[A-Z]/.test(id) ? '#93c5fd' : '#f1f5f9';
    else if (num) c = '#fcd34d';
    out.push([s, c]);
  }
  return out;
}
// コードの行（p で何文字目まで打たれたか）
function codeLines(lines, x, y, p, o = {}) {
  const size = o.size || 24, lh = o.lh || size * 1.5;
  const total = lines.reduce((a, l) => a + l.length, 0);
  let left = Math.floor(total * clamp(p));
  ctx.save();
  ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.font = `500 ${size}px ${MONO}`;
  ctx.textBaseline = 'middle';
  let cy = y, cursor = null;
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li], show = line.slice(0, Math.max(0, left));
    left -= line.length;
    const hl = o.hl && o.hl[li];
    if (hl) { ctx.save(); ctx.fillStyle = hexA(hl, .28 * (o.hla?.[li] ?? 1)); ctx.fillRect(x - 10, cy - lh / 2, o.w || 900, lh); ctx.fillStyle = hl; ctx.fillRect(x - 10, cy - lh / 2, 5, lh); ctx.restore(); }
    const ga = ctx.globalAlpha;
    if (o.dim && o.dim[li]) ctx.globalAlpha = ga * .3;
    let cx = x;
    for (const [tk, c] of tokens(show)) { if (c) { ctx.fillStyle = o.mono ? '#e5e7eb' : c; ctx.fillText(tk, cx, cy); } cx += ctx.measureText(tk).width; }
    ctx.globalAlpha = ga;
    if (show.length < line.length && !cursor) cursor = [cx, cy];
    cy += lh;
  }

  ctx.restore();
}
// モニター風のコード札（墨の太枠）
function codeCard(x, y, w, file, lines, p, o = {}) {
  const size = o.size || 22, lh = size * 1.5, h = o.h || 52 + lines.length * lh + 14;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  rr(x, y, w, h, 10); ctx.fillStyle = '#17191f'; ctx.fill();
  ctx.lineWidth = o.lw || 4; ctx.strokeStyle = COL.ink; ctx.stroke();
  ctx.save(); rr(x, y, w, h, 10); ctx.clip(); ctx.fillStyle = o.bar || '#2c313c'; ctx.fillRect(x, y, w, 38); ctx.restore();
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + 18 + i * 15, y + 19, 4.5, 0, 7); ctx.fillStyle = '#6b7280'; ctx.fill(); }
  if (file) txt(file, x + 66, y + 20, { font: `700 17px ${MONO}`, color: '#e5e7eb' });
  codeLines(lines, x + 22, y + 52 + lh / 2, p, { size, lh, w: w - 22, ...o, alpha: 1 });
  ctx.restore();
  return h;
}

// ---- ページ ----

// いま描いているページの性質（紙の色・コマの地・枠の色）。ページを描く前に設定する
const PAGE = { panelBg: '#fff', border: COL.ink, color: false };
// 見開きの寸法: 左右のページの境目（ノド）が x = 960
const BX0 = 26, BX1 = 1894, BY0 = 18, BY1 = 1062, SPX = 960;
// コマを置く範囲（下は字幕の場所を空ける）
const TOP = 66, BOT = 868, LX0 = 76, LX1 = 924, RX0 = 996, RX1 = 1844;

// 見開きの紙。flash（回想: 余白を黒に）, color（カラーページ）, sepia
function paper(o = {}) {
  const bg = o.flash ? '#121212' : o.color ? COL.gloss : COL.paper;
  ctx.fillStyle = bg; ctx.fillRect(BX0, BY0, BX1 - BX0, BY1 - BY0);

// ノドの影（ページの上に重ねる）
function gutterShade(o = {}) {
  const g = ctx.createLinearGradient(SPX - 70, 0, SPX + 70, 0);

  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.42, `rgba(0,0,0,${a * .55})`); g.addColorStop(.5, `rgba(0,0,0,${a})`);
  g.addColorStop(.58, `rgba(0,0,0,${a * .55})`); g.addColorStop(1, 'rgba(0,0,0,0)');

}
// 柱（ページの外側の小さな見出し）とノンブル（ページ番号）
function pageMarks(no, chap, o = {}) {
  const c = o.flash ? '#8a8378' : '#8f897d';

}

// 机と、本の影（ぼかしの影は重いので、画素数が変わったときだけ描いて取っておく）
const DESK = document.createElement('canvas');
function desk() {
  if (DESK.width !== cv.width || DESK.height !== cv.height) {
    DESK.width = cv.width; DESK.height = cv.height;
    const keep = ctx;
    ctx = fixScale(DESK.getContext('2d'));

// しおり（本に挟んだ紐）。いまのバージョンを縦書きで載せる

}

// ---- 字幕（ナレーションの四角） ----

// 白い四角に墨の枠、ずれた黒い影。左の枝豆（ずんだ）がしゃべりに合わせてふくらむ
function caption(t) {
  let cur = null;
  for (const id of TLD.order) {
    const l = TLD.lines[id];
    if (t >= l.start - .08 && t <= l.end + .25) { cur = l; break; }
  }
  if (!cur) return;

// 土管（WinSock）
function dokan(x, y, w, h, o = {}) {
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  ctx.lineWidth = 5; ctx.strokeStyle = COL.ink;
  ctx.fillStyle = o.color ? '#cbd5e1' : '#fff'; ctx.fillRect(x, y, w, h);
  if (!o.color) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); toneGrad(x, y, w, h, .4, { dir: 'down' }); ctx.restore(); }
  ctx.strokeRect(x, y, w, h);
  for (const ex of [x, x + w]) { ctx.beginPath(); ctx.ellipse(ex, y + h / 2, h * .18, h / 2 + 8, 0, 0, 7); ctx.fillStyle = o.color ? '#94a3b8' : '#fff'; ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
// 封筒
function envelope(x, y, s, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.globalAlpha *= o.alpha ?? 1;
  ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.fillStyle = o.fill || '#fff';
  ctx.fillRect(-s, -s * .62, s * 2, s * 1.24); ctx.strokeRect(-s, -s * .62, s * 2, s * 1.24);
  ctx.beginPath(); ctx.moveTo(-s, -s * .62); ctx.lineTo(0, s * .1); ctx.lineTo(s, -s * .62); ctx.stroke();
  if (o.label) txt(o.label, 0, s * .3, { font: `800 ${s * .34}px ${MONO}`, align: 'center' });
  ctx.restore();
}

// はなまる（赤ペンのうず巻きと花びら）。p で書かれていく
function hanamaru(cx, cy, s, p, o = {}) {
  if (p <= 0) return;
  const pts = [];
  for (let a = 0; a <= Math.PI * 4.4; a += .12) { const r = s * (.08 + .42 * a / (Math.PI * 4.4)); pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * .9]); }
  for (let k = 0; k < 9; k++) {
    const a0 = k / 9 * Math.PI * 2;
    for (let u = 0; u <= 1.001; u += .1) { const a = a0 + u * Math.PI * 2 / 9, r = s * (.62 + Math.sin(u * Math.PI) * .32); pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * .9]); }
  }
  ink(pts, p, { color: o.color || COL.red, w: o.w || 7 });
}
// ポストの言葉（引用の札）
function quoteCard(x, y, w, q, p, o = {}) {
  if (p <= 0) return;
  const rows = q.split('\n'), fs = o.fs || 40, h = rows.length * fs * 1.45 + 120;
  ctx.save(); ctx.globalAlpha *= clamp(p * 3); ctx.translate(0, (1 - E.out(p)) * 20);
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.strokeRect(x, y, w, h);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, 16, h); ctx.clip(); tone(x, y, 16, h, .5); ctx.restore();
  txt('“', x + 36, y + 46, { font: `900 72px ${SERIF}`, color: COL.faint });
  rows.forEach((r, i) => txt(r, x + 60, y + 70 + fs * .6 + i * fs * 1.45, { font: `900 ${fs}px ${SERIF}` }));
  txt('― @studio_yebisu さんのポストより', x + w - 24, y + h - 26, { font: `700 20px ${SERIF}`, align: 'right', color: COL.sub });
  ctx.restore();
}
// 答え合わせの問いの番号
function mondai(no, x, y, p) {
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= clamp(p * 3);
  rr(x, y, 120, 64, 6); ctx.fillStyle = COL.ink; ctx.fill();
  txt('問' + no, x + 60, y + 33, { font: `900 34px ${SERIF}`, align: 'center', color: '#fff' });
  ctx.restore();
}
// パズルの1片（ラベルつき）
function piece(x, y, w, h, label, sub, o = {}) {
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1; ctx.translate(x, y); ctx.rotate(o.rot || 0);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(w * .4, 0); ctx.arc(w * .5, 0, h * .14, Math.PI, 0, true); ctx.lineTo(w, 0); ctx.lineTo(w, h * .36); ctx.arc(w, h * .5, h * .14, -Math.PI / 2, Math.PI / 2); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  ctx.fillStyle = o.fill || '#fff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = COL.ink; ctx.stroke();
  txt(label, w * .48, h * .45, { font: `800 ${o.fs || 24}px ${MONO}`, align: 'center' });
  if (sub) txt(sub, w * .48, h * .76, { font: `800 18px ${SERIF}`, align: 'center', color: COL.red });
  ctx.restore();
}

// 裏の Canvas（ページめくりで、めくる前とめくった後のページを描き分ける）
const OFF = [document.createElement('canvas'), document.createElement('canvas')];
const OCTX = OFF.map(c => fixScale(c.getContext('2d')));
function onOff(i, fn) {
  const c = OFF[i];
  if (c.width !== cv.width || c.height !== cv.height) { c.width = cv.width; c.height = cv.height; }
  const keep = ctx;
  ctx = OCTX[i];

// 裏の Canvas の一部を写す（写し取る側は画素の座標なので SC 倍）
const blit = (c, x, y, w, h, dx, dy, dw, dh) => { if (dw > .5) ctx.drawImage(c, x * SC, y * SC, w * SC, h * SC, dx, dy, dw, dh); };

// ページめくり（右綴じ: 左のページが持ち上がって、右へ倒れる）。u: 0..1
function flip(u) {
  const e = E.inOut(clamp(u)), th = e * Math.PI, c = Math.cos(th), lift = Math.sin(th);
  const A = OFF[0], B = OFF[1], PW = SPX - BX0, RW = BX1 - SPX;
  // 下: 新しい左ページと、古い右ページ
  blit(B, 0, 0, SPX, H, 0, 0, SPX, H);
  blit(A, SPX, 0, W - SPX, H, SPX, 0, W - SPX, H);
  const bulge = 1 + .03 * lift;
  ctx.save();
  if (c > 0) {
    const w = PW * c, x0 = SPX - w;
    // めくれるページが落とす影
    const g = ctx.createLinearGradient(x0 - 90 * lift, 0, x0, 0);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${.35 * lift})`);
    ctx.fillStyle = g; ctx.fillRect(x0 - 90 * lift, BY0, 90 * lift, BY1 - BY0);
    ctx.translate(0, H / 2); ctx.scale(1, bulge); ctx.translate(0, -H / 2);
    blit(A, BX0, 0, PW, H, x0, 0, w, H);
    const s = ctx.createLinearGradient(x0, 0, SPX, 0);
    s.addColorStop(0, `rgba(255,255,255,${.25 * lift})`); s.addColorStop(.5, 'rgba(0,0,0,0)'); s.addColorStop(1, `rgba(0,0,0,${.28 * lift})`);
    ctx.fillStyle = s; ctx.fillRect(x0, BY0, w, BY1 - BY0);
  } else {
    const w = RW * -c, x1 = SPX + w;
    const g = ctx.createLinearGradient(x1, 0, x1 + 90 * lift, 0);
    g.addColorStop(0, `rgba(0,0,0,${.35 * lift})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x1, BY0, 90 * lift, BY1 - BY0);
    ctx.translate(0, H / 2); ctx.scale(1, bulge); ctx.translate(0, -H / 2);
    blit(B, SPX, 0, RW, H, SPX, 0, w, H);
    const s = ctx.createLinearGradient(SPX, 0, x1, 0);
    s.addColorStop(0, `rgba(0,0,0,${.28 * lift})`); s.addColorStop(.5, 'rgba(0,0,0,0)'); s.addColorStop(1, `rgba(255,255,255,${.25 * lift})`);
    ctx.fillStyle = s; ctx.fillRect(SPX, BY0, w, BY1 - BY0);
  }
  ctx.restore();
}

function draw(t) {

  desk();

// BGM と効果音（タイミングは timeline.js と、場面の K・ページの一覧 PAGES から）
// 主題は「あの頃の1行」: 冒頭はオルゴールで思い出として鳴り、題名で口笛とギターの主題になり、最後はみんなで鳴らして、奥付でまたオルゴールに戻る
// 楽器は手作りの音: アコースティックギター（弦をはじく物理模型）、口笛、グロッケン、ピアノ、手拍子。効果音はマンガの描き文字（ページをめくる・ハンコ・バインッ・ガーン）
// MP4 は全部を1本に合成する。HTML 版は BGM だけを bgm.mp3 にし、効果音はブラウザの中で鳴らす（liveSE）
const SR = 48000;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// 譜面を組み立てる。ac は OfflineAudioContext（書き出し）でも AudioContext（HTML 版の効果音）でもよい
//   mode: 'all'（全部）/ 'music'（BGM だけ）/ 'se'（効果音だけ）
//   off : ムービーの 0 秒が、ac の何秒にあたるか
function buildScore(ac, dest, mode = 'all', off = 0) {
  let seed = 24680;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x3fffffff - 1; };
  const noiseBuf = ac.createBuffer(1, SR * 3, SR);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd(); }
  const ir = ac.createBuffer(2, SR * 2.6, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = rnd() * Math.pow(1 - i / d.length, 3.6); }

  const master = ac.createDynamicsCompressor();
  master.threshold.value = -14; master.ratio.value = 3; master.attack.value = .01; master.release.value = .25;
  master.connect(dest);
  const verb = ac.createConvolver(); verb.buffer = ir;
  const verbOut = ac.createGain(); verbOut.gain.value = .3; verb.connect(verbOut); verbOut.connect(master);
  const music = ac.createGain(); music.gain.value = .5; music.connect(master);
  const sfx = ac.createGain(); sfx.gain.value = .7; sfx.connect(master);
  const musicLv = ac.createGain(); musicLv.connect(music);
  const lv = musicLv.gain;
  let curLv = 1, lastLv = 0;
  // 曲全体の音量の流れ。時刻順に呼ぶこと
  const setLv = (t, v, ramp = .4) => {
    if (t - ramp < lastLv - 1e-6) throw new Error('setLv の順番が前後しています: ' + t.toFixed(2));
    const at = t + off, now = ac.currentTime;
    if (at <= now) lv.setValueAtTime(v, now);
    else { lv.setValueAtTime(curLv, Math.max(now, at - ramp)); lv.linearRampToValueAtTime(v, at); }
    curLv = v; lastLv = t;
  };
  lv.setValueAtTime(1, Math.max(ac.currentTime, off));

  const env = (g, t, a, peak, d) => {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(1e-4, t + a + d);
  };
  const out = (node, dry, wet = 0, bus = musicLv, pan = 0) => {
    const g = ac.createGain(); g.gain.value = dry; node.connect(g);
    const ns = [node, g];
    let last = g;
    if (pan) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); last = p; ns.push(p); }

// MP4 用（mode = 'all'）と、HTML 版の bgm.mp3 用（mode = 'music'）の書き出し
window.renderAudio = async function (mode = 'all') {
  const dur = TLD.duration + 1;
  const ac = new OfflineAudioContext(2, Math.ceil(dur * SR), SR);
  const { run } = buildScore(ac, ac.destination, mode);
  const WIN = 4;
  run(WIN + .5);
  for (let w = WIN; w < dur; w += WIN) ac.suspend(w).then(() => { run(w + WIN + .5); ac.resume(); });
  const buf = await ac.startRendering();
  const L0 = buf.getChannelData(0), R0 = buf.getChannelData(1);
  const pcm = new Int16Array(L0.length * 2);
  for (let i = 0; i < L0.length; i++) {
    pcm[i * 2] = Math.max(-1, Math.min(1, L0[i])) * 32767;
    pcm[i * 2 + 1] = Math.max(-1, Math.min(1, R0[i])) * 32767;
  }
  window.__PCM = new Uint8Array(pcm.buffer);
  return { sampleRate: SR, bytes: window.__PCM.length };
};

// HTML 版の効果音: 再生位置 from から、ムービーの 0 秒 = ac の base 秒として、少し先の分ずつ鳴らす
window.liveSE = function (ac, dest) {
  let timer = 0, out = null;
  return {
    start(from, base) {
      this.stop();
      out = ac.createGain(); out.connect(dest);
      const sc = buildScore(ac, out, 'se', base);
      const step = () => sc.run(ac.currentTime - base + 1.5, from - .05);
      step(); timer = setInterval(step, 100);
    },
    stop() {
      clearInterval(timer);
      if (!out) return;
      const o = out, now = ac.currentTime;
      o.gain.setValueAtTime(o.gain.value, now); o.gain.linearRampToValueAtTime(0, now + .05);
      setTimeout(() => o.disconnect(), 300);
      out = null;
    },
  };
};

window.audioChunk = function (i, size) {
  const sub = window.__PCM.subarray(i * size, (i + 1) * size);
  let s = '';
  for (let k = 0; k < sub.length; k += 0x8000) s += String.fromCharCode.apply(null, sub.subarray(k, k + 0x8000));
  return btoa(s);
};

const CHARS = "—―“‥…←→↓⇔−≠␀─△○●♪✓　、。〇〈〉《》「」『』【】〜ぁあぃいぅうぇえぉおかがきぎくぐけげこごさざしじすずせぜそただちっつづてでとどなにねのはばぱひびふぶへべほぼぽまみむめもゃやゅょよらりるれろゎわをんァアィイゥウェエォオカガキギクグケゲコゴサザシジスズセゼソタダチッツテデトドナニヌネノハバパヒビピフブプヘベペホボポマミムメモャヤュユョラリルレロヮワンヵヶ・ー一七万三上下不世両並中丸主九乱了予事二五人今仕他付代令以件任伏伝伴伸似位低体何余作使保信修俵個倍倒値偉側備傾像儀元先光入全八公六共具内円冊再冒写凍出分切列初判別制刷刺刻削前剖割劇力助効勉動務勝化十半単印原参双反収取受口古句召台右号各合同名向吹告呪味呼命和品員問喚喧器四回囲固土地型埋基報場塗境増墨壁壊変外多大天太失奏奥奪妬妻始嫉嫌子字存学安完定宛宝実家容寄寝寸対封専射将小少届屋山嵐巣工左巨差巻帯帰帽幅幕年広底度座廃式引弦張強弾当形影径待後得御復徹心必応念怜思性怪恥息悔悪想意感態憧成戦戻所扉手打扱技投折抜押拍括拾持指挑挟捨掘採探接掲揃描換握揺摘撃操擬支改放敗教散敬数敷文斉料斜断新方既日早明昔星映時景曲更書替最月有朝期木未末本札朱机杖束来板枚果枝枠柄柱根格案棚検楕業極楽概様標模権横機檻次欲止正死残段毎比気求汎汗汚決沈沼法泡波泥活派流消混済渡測準溶漢濃炎点無焦然照片版物特狂獄率玉現球理環生用由画界畑畝略番発登白的盛監盤目直相看真眼着瞬矢知短砂砕破確磨礎示社祈秒秘秤称程種稲稿積空突窓立章端笛符第筒答箋算管箱節範簡簿約納紐純紙素索細終組経結絡統絵絶継続網綴緒線縁縦縮縺繰罠罫置美義習翻考者耕聞聴肩育背胸能腐膨自良色花芽荷落葉著薄虫行衝表装裏製複要見視覧角解言計討記設訳試詰話認誕語読課調談請論諦譁譜警議豆象買質赤走起超越足距路跳身転軽較載込返追退送逆透途通速連週進遅遊運道達違遠適選部配重野量金針鉄鉢録鍵鏡長開間関限陣除隠集雑離雪震非面音頃順須頭頼題顔願類風飛首験驚高魅魔鳴黒！（）＋，－．：＜＝＞？［］～ｭｯｲﾀﾍﾖﾝﾞ🔥😇😳😵🤠🥳🥹🥺🫠🫨";
const DUR = TLD.duration;
const BG = .85, DUCK = .45;
const $ = s => document.querySelector(s);
const fmt = s => { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };

let ac = null, bus = null, bgGain = null, voGain = null, bgm = null, se = null;
const VO = {};
let srcs = [], playing = false, T = 0, base = 0, seeking = false, ready = false, dirty = true, cover = null;

// セリフが続く区間をまとめて、BGM を下げる区間にする
const DUCKS = [];
for (const id of TLD.order) {
  const l = TLD.lines[id], a = l.start - .1, b = l.end + .15, last = DUCKS[DUCKS.length - 1];
  if (last && a - last[1] < .7) last[1] = b; else DUCKS.push([a, b]);
}

function fit() {
  // innerWidth はスマートフォンで縮小表示されると変わってしまうので、画面の実際の幅（clientWidth）で測る
  const vw = document.documentElement.clientWidth || innerWidth, vh = document.documentElement.clientHeight || innerHeight;
  const s = Math.min(vw / 1920, vh / 1080);
  cv.style.width = 1920 * s + 'px'; cv.style.height = 1080 * s + 'px';
  // Canvas の画素数: ふだんは 1920×1080。全画面のときだけ画面の画素数に合わせる（16:9 のまま、1080p 未満にはしない、上限は横 3840）
  const full = document.fullscreenElement || document.webkitFullscreenElement;
  const pw = full ? Math.min(3840, Math.max(1920, Math.round(1920 * s * (devicePixelRatio || 1)))) : 1920;
  if (cv.width !== pw) { cv.width = pw; cv.height = Math.round(pw * 9 / 16); SC = pw / 1920; dirty = true; }
}
// 全画面の出入りと、resize が届かない変わり方（埋め込み先の枠の変化など）も見張る
addEventListener('resize', fit); addEventListener('fullscreenchange', fit); addEventListener('webkitfullscreenchange', fit);
new ResizeObserver(() => fit()).observe(document.documentElement); fit();

async function loadAll() {
  const total = TLD.order.length + 2;
  let n = 0;
  const step = () => { $('#startLbl').textContent = `読み込み中… ${Math.round(++n / total * 100)}%`; };
  const weights = [500, 600, 700, 800, 900];
  await Promise.all([
    ...weights.map(w => document.fonts.load(`${w} 40px "Noto Sans JP"`, CHARS).catch(() => {})),
    document.fonts.load(`700 40px "JetBrains Mono"`, 'abc0123').catch(() => {}),
    ...['600 40px "Noto Serif JP"', '700 40px "Noto Serif JP"', '900 40px "Noto Serif JP"', '400 40px "Dela Gothic One"', '400 40px "Zen Antique"', '600 40px "Klee One"']
      .map(f => document.fonts.load(f, CHARS).catch(() => {})),
  ]);
  step();
  ac = new (window.AudioContext || window.webkitAudioContext)();
  bus = ac.createGain(); bus.connect(ac.destination);
  bgGain = ac.createGain(); bgGain.gain.value = BG; bgGain.connect(bus);
  voGain = ac.createGain(); voGain.connect(bus);
  // 効果音は bgm.mp3 に入れず、絵と同じ時刻表からブラウザの中で鳴らす（BGM と同じく、声の間は下げる）
  se = window.liveSE(ac, bgGain);
  const get = async url => { const r = await fetch(url); if (!r.ok) throw new Error(url); return await ac.decodeAudioData(await r.arrayBuffer()); };
  try { bgm = await get(VOICE_DIR + 'bgm.mp3'); } catch (e) { console.warn('BGM なしで再生します', e); }
  step();
  // 声が読み込めなくても、字幕と BGM だけで再生できるようにする
  await Promise.all(TLD.order.map(async id => { try { VO[id] = await get(VOICE_DIR + id + '.wav'); } catch (e) { console.warn(e); } step(); }));
}

function stopAudio() { for (const s of srcs) { try { s.stop(); } catch (e) {} } srcs = []; se?.stop(); }
function startAudio(from) {
  stopAudio();
  const now = ac.currentTime + .06;
  base = now - from;
  if (bgm && from < bgm.duration) {
    const s = ac.createBufferSource(); s.buffer = bgm; s.connect(bgGain); s.start(now, from); srcs.push(s);
  }
  const g = bgGain.gain;
  g.cancelScheduledValues(0); g.setValueAtTime(BG, now);
  for (const [a, b] of DUCKS) {
    if (b < from) continue;
    const ta = base + a, tb = base + b;
    if (ta > now) { g.setValueAtTime(BG, ta); g.linearRampToValueAtTime(BG * DUCK, ta + .15); }
    else g.setValueAtTime(BG * DUCK, now);
    g.setValueAtTime(BG * DUCK, Math.max(now, tb)); g.linearRampToValueAtTime(BG, Math.max(now, tb) + .35);
  }
  for (const id of TLD.order) {
    const l = TLD.lines[id], buf = VO[id];
    if (!buf) continue;
    const off = Math.max(0, from - l.start);
    if (off >= buf.duration) continue;
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(voGain);
    s.start(base + l.start + off, off); srcs.push(s);
  }
  se.start(from, base);
}

const cur = () => playing ? Math.min(DUR, ac.currentTime - base) : T;
async function play(fromStart) {
  if (!ready) return;
  cover = null;
  await ac.resume();
  if (fromStart || T >= DUR - .05) T = 0;
  startAudio(T);
  playing = true; $('#bPlay').textContent = '❚❚'; idle();
}
function pause() { T = cur(); stopAudio(); playing = false; $('#bPlay').textContent = '▶'; dirty = true; showCtl(); }
const toggle = () => playing ? pause() : play();
function seekTo(t) { cover = null; T = Math.max(0, Math.min(DUR, t)); if (playing) startAudio(T); dirty = true; }

function loop() {
  const t = cur();
  if (playing || dirty) {
    renderFrame(cover ?? t);
    $('#tm').textContent = `${fmt(t)} / ${fmt(DUR)}`;
    if (!seeking) $('#seek').value = t;
    dirty = false;
  }
  if (playing && t >= DUR) { pause(); T = DUR; }
  requestAnimationFrame(loop);
}

// 操作バーは、再生中に動きがなければ隠す
let hideTimer = 0;
function showCtl() { document.body.classList.remove('idle'); clearTimeout(hideTimer); }
function idle() { showCtl(); hideTimer = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 2500); }
addEventListener('pointermove', idle);

$('#bPlay').onclick = () => { $('#start')?.remove(); toggle(); };
$('#bRe').onclick = () => { $('#start')?.remove(); play(true); };
$('#bMute').onclick = () => { if (!bus) return; const m = bus.gain.value > 0; bus.gain.value = m ? 0 : 1; $('#bMute').textContent = m ? '🔇' : '🔊'; };
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
$('#seek').max = DUR;
$('#seek').oninput = e => { seeking = true; seekTo(+e.target.value); };
$('#seek').onchange = () => { seeking = false; };
addEventListener('keydown', e => {
  if (!ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#start')?.remove(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') { $('#start')?.remove(); play(true); }
  else if (e.key === 'm' || e.key === 'M') $('#bMute').click();
  else if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  else if (e.key === 'ArrowRight') seekTo(cur() + 5);
  else if (e.key === 'ArrowLeft') seekTo(cur() - 5);
});

loadAll().then(() => {
  ready = true;
  // 再生前は、タイトルの場面を表紙として見せる
  T = 0; cover = L('op8').end + 3.0; renderFrame(cover); dirty = false;
  const st = $('#start');
  st.classList.remove('loading');
  $('#startLbl').textContent = `▶ 再生（${Math.floor(DUR / 60)}分${Math.round(DUR % 60)}秒）`;
  st.onclick = () => { st.remove(); play(true); };
  $('#tm').textContent = `0:00 / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
});
</script>
