<script>// 描画の土台: 舞台は「輪廻の回路」。暗い空間に、光る ∞（無限大）の道が浮かぶ

function txt(s, x, y, o = {}) {

  if (o.maxW) { const w = ctx.measureText(s).width; if (w > o.maxW) { ctx.translate(x, y); ctx.scale(o.maxW / w, 1); x = 0; y = 0; } }

function tw(s, font, ls = 0) { ctx.save(); ctx.font = font; if (ls) ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }

    if (blink) { ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.fillStyle = o.ccol || o.color || C.ink; const fs = parseInt((o.font || '32px').match(/(\d+)px/)[1]); ctx.fillRect(x + w + 4, y - fs * .45, fs * .5, fs * .9); ctx.restore(); }
  }

function arrow(x1, y1, x2, y2, p, o = {}) {
  if (p <= 0) return;

  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.strokeStyle = o.color || C.ink; ctx.fillStyle = o.color || C.ink;
  if (o.glow) { ctx.shadowColor = o.color; ctx.shadowBlur = 12; }
  ctx.lineWidth = o.w || 4; ctx.lineCap = 'round'; if (o.dash) ctx.setLineDash(o.dash);
  const a = Math.atan2(y2 - y1, x2 - x1), hs = o.head || 16;
  const head = k > .3, back = head ? hs * Math.cos(.45) * .85 : 0;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x - Math.cos(a) * back, y - Math.sin(a) * back); ctx.stroke(); ctx.setLineDash([]);
  if (head) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(a - .45) * hs, y - Math.sin(a - .45) * hs); ctx.lineTo(x - Math.cos(a + .45) * hs, y - Math.sin(a + .45) * hs); ctx.closePath(); ctx.fill(); }

}

  if (k2 > 0) { ctx.moveTo(x + s / 2, y - s / 2); ctx.lineTo(x + s / 2 - s * k2, y - s / 2 + s * k2); }

// ---------- 光る札・はんこ ----------

// ---------- 字幕（丸いアイコンと声のメーター） ----------
const WRAP = {};
function wrapLine(id, s, font, maxW) {
  if (WRAP[id]) return WRAP[id];
  ctx.save(); ctx.font = font;
  let rows = [s];
  if (ctx.measureText(s).width > maxW) {
    let best = -1;
    for (const marks of ['、。！？）」…', ' ']) {
      let bestD = 1e9;
      for (let i = 1; i < s.length - 1; i++) {
        if (!marks.includes(s[i - 1])) continue;
        const w1 = ctx.measureText(s.slice(0, i)).width, w2 = ctx.measureText(s.slice(i)).width;
        if (w1 > maxW || w2 > maxW) continue;
        const d = Math.abs(w1 - w2); if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) break;
    }
    if (best < 0) { let i = s.length; while (i > 1 && ctx.measureText(s.slice(0, i)).width > maxW) i--; best = i; }
    rows = [s.slice(0, best).trimEnd(), s.slice(best).trimStart()];
  }
  ctx.restore();
  return (WRAP[id] = rows);
}
function curLine(t) { let cur = null; for (const id of TLD.order) { if (TLD.lines[id].start - .12 <= t) cur = id; else break; } return cur; }

  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(6,6,18,.88)'; rr(x0, y0, w0, h0, h0 / 2); ctx.fill();
  ctx.strokeStyle = hexA(sp.col, .6); ctx.lineWidth = 2; ctx.shadowColor = sp.col; ctx.shadowBlur = 14; rr(x0, y0, w0, h0, h0 / 2); ctx.stroke();

  const cx = x0 + h0 / 2, cy = y0 + h0 / 2, R = h0 / 2 - 12, lv = t < l.end ? Math.abs(Math.sin(t * 13) * Math.sin(t * 7.3)) : 0;

  ctx.strokeStyle = sp.col; ctx.lineWidth = 3; ctx.shadowColor = sp.col; ctx.shadowBlur = 10 + lv * 20; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  ctx.restore();

  ctx.restore();

  const total = rows.join('').length, p = PT(t, l.start, Math.max(.35, (l.end - l.start) * .5));

window.renderAudio = async function (mode = 'music') {

<script>
