<script>// 描画の土台: CRT モニターに映るセキュリティ監査コンソール（走査線・グリッチ・ドット文字・チャットログ）
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1920, H = 1080;
let SC = 1;

const JP = "'Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif";
const DOT = "'DotGothic16','MS Gothic',monospace";
const HUD = "'Share Tech Mono','Consolas',monospace";
const CODE = "'JetBrains Mono','Consolas',monospace";
const IMG_BASE = '../img/Policy/';

// 色: 監査コンソールのシアン、警報の赤、侵入のマゼンタ。話し手はつむぎ＝黄、ずんだもん＝緑
const C = {
  bg: '#02060a', bg2: '#06141b', cy: '#2ee6ff', cyd: '#0e4655', red: '#ff3355', redd: '#5a0f1c', mag: '#ff3df2',
  wht: '#e8fcff', dim: '#6c8a95', dim2: '#2a3d45', pass: '#7dfcd8', yel: '#ffd23f', grn: '#86e05a',
  // DebugRoute から引き継ぐ3つの道の色
  pipe: '#22d3ee', port: '#f59e0b', wv2: '#a855f7',
};

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const PT = (t, t0, d) => d <= 0 ? (t >= t0 ? 1 : 0) : clamp((t - t0) / d);
const E = {
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
};
// 同じ番号なら同じ値を返す乱数（フレームごとに揺れないように）
const hr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hexA = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

// 時刻表（timeline.py の tld.json）
const L = id => { const l = TLD.lines[id]; if (!l) throw new Error('no line ' + id); return l; };
const S = id => TLD.scenes[id];
const F = (id, f) => { const l = L(id); return l.start + (l.end - l.start) * f; };

// ---------- 文字と図形 ----------
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = o.font || `700 44px ${JP}`;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.stroke) { ctx.lineWidth = o.sw || 6; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 22; }
  ctx.fillStyle = o.color || C.wht;

  ctx.strokeStyle = hexA(col, .6); ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
  const n = Math.max(1, Math.floor(w / 16)), k = Math.round(n * clamp(p));
  ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 10;
  for (let i = 0; i < k; i++) ctx.fillRect(x + 4 + i * (w - 8) / n, y + 4, (w - 8) / n - 4, h - 8);
  ctx.restore();
}

// ---------- 画面の揺れ・グリッチ（main.js の HITS / GLITCH） ----------
// 自分自身の一部を切り取って、横にずらして描き直す
function grab(y, h, dx) {
  const sy = Math.max(0, y), sh = Math.min(H - sy, h);
  if (sh <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(cv, 0, sy * SC, cv.width, sh * SC, dx * SC, sy * SC, cv.width, sh * SC);
  ctx.restore();
}
function sliceGlitch(amt, seed) {
  if (amt <= 0) return;
  const k = Math.floor(seed * 30);
  for (let i = 0; i < 12; i++) {
    if (hr(k * 3 + i) > .25 + amt * .6) continue;
    const y = hr(k * 11 + i) * H, h = 6 + hr(k * 5 + i) * 80;
    grab(y, h, (hr(k * 19 + i) - .5) * 180 * amt);
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .1 * amt; ctx.fillStyle = '#ff2a6d'; ctx.fillRect((hr(k) - .5) * 40, 0, W, H);
  ctx.globalAlpha = .08 * amt; ctx.fillStyle = '#21e6ff'; ctx.fillRect((hr(k + 1) - .5) * 40, 0, W, H);
  ctx.restore();
}

// ---------- CRT（走査線・周辺減光・ノイズ） ----------
const CRT = (() => {
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const scan = mk(W, H); { const g = scan.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.28)'; for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 2); }
  const vig = mk(W, H);
  {
    const g = vig.getContext('2d');
    const r = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
    r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,.78)');
    g.fillStyle = r; g.fillRect(0, 0, W, H);
  }
  const noise = [];
  for (let k = 0; k < 4; k++) {
    const c = mk(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256);
    for (let i = 0; i < d.data.length; i += 4) { const v = hr(i * .37 + k * 9999) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0); noise.push(c);
  }
  return {
    draw(t, amt = 1, extraNoise = 0) {
      if (amt <= 0) return;
      ctx.save();
      ctx.globalAlpha = amt; ctx.drawImage(scan, 0, 0);
      const n = noise[Math.floor(t * 24) % 4];
      ctx.globalAlpha = (.045 + extraNoise) * amt; ctx.globalCompositeOperation = 'overlay';
      const ox = Math.floor(hr(Math.floor(t * 24)) * 256), oy = Math.floor(hr(Math.floor(t * 24) + 5) * 256);
      for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) ctx.drawImage(n, x, y);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = amt; ctx.drawImage(vig, 0, 0);
      // ほんの少しのちらつき
      ctx.globalAlpha = .025 * amt * (1 + Math.sin(t * 50)); ctx.fillStyle = '#9ff'; ctx.fillRect(0, 0, W, H);
      ctx.restore();
    },
  };
})();

function drBg(t) {
  const g = ctx.createRadialGradient(W / 2, H * .45, 50, W / 2, H * .5, W * .75);
  g.addColorStop(0, '#0b1730'); g.addColorStop(1, '#020409');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .5;
  const hy = H * .58;
  const vg = ctx.createLinearGradient(0, hy, 0, H);
  vg.addColorStop(0, hexA(C.pipe, 0)); vg.addColorStop(.35, hexA(C.pipe, .12)); vg.addColorStop(1, hexA(C.pipe, .3));
  ctx.strokeStyle = vg; ctx.lineWidth = 1.5;
  for (let i = -24; i <= 24; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 22, hy); ctx.lineTo(W / 2 + i * 260, H + 40); ctx.stroke(); }
  ctx.strokeStyle = hexA(C.pipe, .22);
  const sp = (t * .35) % 1;
  for (let j = 0; j < 14; j++) {
    const z = (j + sp) / 14, y = hy + Math.pow(z, 2.2) * (H - hy + 60);
    ctx.globalAlpha = .5 * z * z; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
  ctx.save();
  for (let i = 0; i < 70; i++) {
    const x = (hr(i) * W + t * (8 + hr(i + 50) * 30)) % W;
    const y = (hr(i + 100) * H - t * (4 + hr(i + 150) * 14) % H + H) % H;
    ctx.globalAlpha = .15 + .35 * Math.sin(t * (1 + hr(i + 200)) + i) ** 2;
    ctx.fillStyle = hr(i + 300) < .7 ? C.pipe : '#ffffff';
    ctx.fillRect(x, y, 2 + hr(i + 400) * 2, 2 + hr(i + 400) * 2);
  }
  ctx.restore();
}

function fracAtX(pts, x) {

// 心電図のような線（VBA エンジンの鼓動）。flat: 0〜1 で平らになる
function pulseLine(x, y, w, t, flat, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.shadowColor = col; ctx.shadowBlur = 14;
  ctx.beginPath();
  for (let i = 0; i <= w; i += 4) {
    const ph = ((i / 160) - t * .9) % 1, q = (ph + 1) % 1;
    let v = 0;
    if (q > .4 && q < .5) v = Math.sin((q - .4) / .1 * Math.PI * 2) * 60;
    if (q > .5 && q < .55) v = -Math.sin((q - .5) / .05 * Math.PI) * 20;
    ctx[i ? 'lineTo' : 'moveTo'](x + i, y - v * (1 - flat));
  }
  ctx.stroke(); ctx.restore();
}
// ツールの札
function toolCard(x, y, name, sub, t, t0, o = {}) {
  const a = PT(t, t0, .3) * (o.alpha ?? 1);
  if (a <= 0) return;
  frame(x, y, 420, 170, { color: o.color || C.cy, alpha: a, title: 'MODULE', status: o.status || 'ONLINE' });
  txt(name, x + 30, y + 92, { font: `400 40px ${DOT}`, color: C.wht, alpha: a });
  txt(sub, x + 30, y + 140, { font: `400 22px ${HUD}`, color: C.dim, alpha: a });
}

// AMSI の流れ（VBA の実行 → 行動ログ → AMSI → ウイルス対策）
function amsiFlow(t, a, lane) {
  const ys = 470;
  const nodes = [[260, 'VBA RUNTIME', 'マクロの実行'], [720, 'BEHAVIOR LOG', '呼び出しの記録'], [1180, 'AMSI', '検査の窓口'], [1640, 'AV ENGINE', 'Defender など']];
  nodes.forEach(([x, n, sub], i) => node(x, ys, n, sub, { alpha: a * PT(t, L('sc4').start + i * .25, .3), color: i === 3 ? C.red : C.cy, w: 280 }));
  for (let i = 0; i < 3; i++) {
    const pts = [[nodes[i][0] + 140, ys], [nodes[i + 1][0] - 140, ys]];
    beam(pts, C.cy, 3, PT(t, L('sc4').start + .3 + i * .25, .4), { alpha: a });
    packets(pts, t + i * .2, C.cy, { n: 2, speed: .8, alpha: a });
  }
  // 速さのゲージ
  if (lane > 0) {
    const fast = t > T_LANE && t < T_GATE;
    const lanePts = [[260, ys - 70], [260, 250], [1640, 250], [1640, ys - 70]];
    beam(lanePts, fast ? C.pass : C.dim2, 4, PT(t, T_LANE, .8), { alpha: a * lane, dash: fast ? null : [14, 12] });
    if (fast) packets(lanePts, t, C.pass, { n: 5, speed: 1.4, label: 'Workbooks.Open', size: 18, alpha: a });
    txt('COM 経由で起動', W / 2, 210, { font: `400 34px ${DOT}`, color: fast ? C.pass : C.dim, align: 'center', alpha: a * PT(t, T_LANE, .4) });
  }
}

SCN.scan = function (t, s) {
  bgBoard(t, { acc: C.cy });
  header('LAYER 1 // OFFICE GPO', 'そのほかの Office 系ポリシー', t, s.start + .2);
  // 脅威の一覧
  const lsA = PT(t, L('sc1').start, .4) * (1 - PT(t, L('sc2').start, .3));
  if (lsA > 0) {
    [['Office アプリケーションの VBA を無効にする', 'CRITICAL', C.red, 1], ['マクロ実行時のスキャンの範囲', 'LOW', C.yel, .25], ['自動セキュリティ', 'LOW', C.yel, .2], ['そのほかのマクロ関連の設定', 'MINIMAL', C.dim, .08]].forEach(([n, lv, col, p], i) => {
      const a = PT(t, L('sc1').start + .2 + i * .25, .3) * lsA;
      txt(n, 300, 330 + i * 110, { font: `400 38px ${DOT}`, color: C.wht, alpha: a });
      bar(1150, 305 + i * 110, 380, 50, p * PT(t, L('sc1').start + .4 + i * .25, .6), col, { alpha: a });
      txt(lv, 1560, 330 + i * 110, { font: `400 30px ${HUD}`, color: col, alpha: a });
    });
  }
  // 2つのポリシーの画面
  const thA = PT(t, L('sc2').start, .35) * (1 - PT(t, L('sc4').start - .2, .3));
  if (thA > 0) {
    shot(4, 120, 260, 900, 900 * 740 / 1859, { alpha: thA, crop: [0, 0, 1859, 740], title: 'マクロ実行時のスキャンの範囲', status: 'ENABLED' });
    shot(5, 1180, 260, 600 * 773 / 677 * .9, 540, { alpha: PT(t, F('sc2', .5), .35) * (1 - PT(t, L('sc4').start - .2, .3)), crop: [0, 0, 773, 677], title: '自動セキュリティ', status: 'GPO' });
  }
  // AMSI の流れ
  const flA = PT(t, L('sc4').start, .3) * (1 - PT(t, L('sc5').start + .1, .3));
  const flB = PT(t, L('sc12').start, .3) * (1 - PT(t, L('sc19').start, .3));
  if (flA > 0) amsiFlow(t, flA, 0);
  // 循環バッファー: すべての呼び出しが記録される
  const rbA = PT(t, L('sc5').start, .4) * (1 - PT(t, L('sc8').start, .3));
  if (rbA > 0) {
    const ringA = rbA * (1 - PT(t, L('sc7').start, .3));
    const cx = 620, cy = 500, r = 250, n = 16;
    const k = Math.floor(clamp((t - L('sc5').start - .3) / .3, 0, 999));
    txt('CIRCULAR BUFFER', cx, cy - r - 60, { font: `400 28px ${HUD}`, color: C.cy, align: 'center', alpha: ringA, ls: 4 });
    for (let i = 0; i < n; i++) {
      const an = -Math.PI / 2 + i / n * Math.PI * 2;
      const filled = i < k || k >= n;
      const hot = i === k % n;
      ctx.save(); ctx.globalAlpha = ringA; ctx.translate(cx + Math.cos(an) * r, cy + Math.sin(an) * r); ctx.rotate(an);
      ctx.fillStyle = hot ? C.wht : filled ? hexA(C.red, .8) : hexA(C.cy, .15); ctx.shadowColor = C.red; ctx.shadowBlur = filled ? 14 : 0;
      ctx.fillRect(-26, -40, 52, 80); ctx.restore();
    }
    const logged = t < L('sc6').start ? k * 37 + Math.floor(hr(k) * 30) : Math.floor(lerp(600, 999999, E.in(PT(t, L('sc6').start, 1.4))));
    txt(String(logged).padStart(6, '0'), cx, cy - 10, { font: `400 80px ${HUD}`, color: C.red, align: 'center', alpha: ringA, glow: C.red });
    txt('CALLS LOGGED', cx, cy + 60, { font: `400 24px ${HUD}`, color: C.dim, align: 'center', alpha: ringA, ls: 4 });
    // 流れてくる呼び出し
    const rows = CALLS.map((c, i) => [c, c.startsWith('W32') ? C.yel : C.cy]);

const R6a = { crop: [0, 0, 1643, 735], r: [262, 108, 662, 30] };
const R6b = { crop: [0, 0, 1643, 735], r: [743, 622, 496, 32] };

// ASR の紋章（六角形）
function asrEmblem(x, y, r, t, a, col = C.red) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
  for (let k = 0; k < 3; k++) {
    ctx.save(); ctx.rotate(t * (k % 2 ? -.4 : .3)); ctx.strokeStyle = hexA(col, .9 - k * .25); ctx.lineWidth = 4 - k; ctx.shadowColor = col; ctx.shadowBlur = 20;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const an = Math.PI / 3 * i; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(an) * r * (1 + k * .22), Math.sin(an) * r * (1 + k * .22)); }
    ctx.closePath(); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
  txt('ASR', x, y + 4, { font: `400 ${r * .55}px ${HUD}`, color: col, align: 'center', alpha: a, glow: col, ls: 4 });
}
// 規則の札（名前と GUID）
function ruleCard(x, y, name, guid, t, t0, o = {}) {
  const a = PT(t, t0, .35) * (o.alpha ?? 1);
  if (a <= 0) return;
  frame(x, y, 1100, 190, { title: 'ATTACK SURFACE REDUCTION RULE', status: o.status || 'BLOCK', statusColor: C.red, color: C.red, alpha: a });
  // 長い規則名は枠の幅に収まるまで文字を小さくする
  const fs = Math.min(40, Math.floor(40 * 1020 / tw(name, `400 40px ${DOT}`)));
  typed(name, x + 40, y + 98, PT(t, t0 + .2, .9), { font: `400 ${fs}px ${DOT}`, color: C.wht, alpha: a, cursor: false });
  txt('GUID ' + guid, x + 40, y + 154, { font: `400 24px ${CODE}`, color: C.dim, alpha: a * PT(t, t0 + .8, .4) });
}
// ファイルの札（スキャナーを通る）
function fileCard(x, y, name, sub, col, a) {
  if (a <= 0) return;
  frame(x - 210, y - 70, 420, 140, { color: col, alpha: a, c: 12 });
  txt(name, x, y - 14, { font: `400 28px ${CODE}`, color: C.wht, align: 'center', alpha: a });
  txt(sub, x, y + 34, { font: `400 24px ${DOT}`, color: col, align: 'center', alpha: a });
}
// プロセスの木: 親から子へ線を引き、結果（✓/✕）を付ける
function procTree(px, py, parent, kids, t, a) {
  if (a <= 0) return;
  node(px, py, parent, null, { alpha: a, w: 280, h: 90, size: 30 });
  kids.forEach(([name, ok, t0, col], i) => {
    const kx = px + 520, ky = py - (kids.length - 1) * 75 + i * 150;
    const p = PT(t, t0, .4);
    if (p <= 0) return;
    const c = ok === null ? C.cy : ok ? C.pass : C.red;
    const pts = [[px + 140, py], [px + 260, py], [px + 260, ky], [kx - 150, ky]];
    beam(pts, c, 3, E.out(p), { alpha: a });
    node(kx, ky, name, null, { alpha: a * p, w: 300, h: 90, size: 28, color: c });
    if (ok !== null && t > t0 + .45) txt(ok ? '✓' : '✕', kx + 190, ky, { font: `400 54px ${HUD}`, color: c, alpha: a * PT(t, t0 + .45, .2), glow: c });
  });
}

function shakeAt(t) {
  let x = 0, y = 0;
  for (const [t0, k] of HITS) {
    const d = t - t0;
    if (d < 0 || d > .5) continue;
    const a = k * Math.pow(1 - d / .5, 2);
    x += Math.sin(d * 90 + t0) * a; y += Math.cos(d * 70 + t0 * 3) * a;

  return [x, y];
}
function glitchAt(t) {
  let a = 0;
  for (const [t0, d, k] of GLITCH) if (t >= t0 && t < t0 + d) a = Math.max(a, k * (1 - (t - t0) / d));
  return a;
}

// ---------- HUD ----------
function drawHUD(t, sid) {
  const a = PT(t, T_CRT + 1.2, .8) * (1 - PT(t, L('ed20').start - .6, .6));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 0, 0, 70);
  g.addColorStop(0, 'rgba(0,10,14,.92)'); g.addColorStop(1, 'rgba(0,10,14,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 70);
  ctx.restore();
  txt('◢ REIWA-IE // POLICY AUDIT', 40, 34, { font: `400 24px ${HUD}`, color: C.cy, alpha: a, ls: 3 });
  const cur = LAYER_OF[sid] ?? -1;
  LAYER_NAMES.forEach((n, i) => {
    const x = 640 + i * 190;
    const done = cur > i, on = cur === i;
    const col = i === 3 ? C.wv2 : on ? C.red : done ? C.cy : C.dim2;
    badge(n, x, 34, { color: col, alpha: a, font: `400 20px ${HUD}`, fill: on ? hexA(col, .25) : 'rgba(0,0,0,.4)', tcol: on || done ? col : C.dim, align: 'center' });
    if (i < 3) txt('▸', x + 95, 34, { font: `400 20px ${HUD}`, color: C.dim, align: 'center', alpha: a });
  });
  const blink = Math.floor(t * 1.6) % 2 === 0;
  if (blink) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(1600, 34, 8, 0, 7); ctx.fill(); ctx.restore(); }
  txt('REC', 1616, 34, { font: `400 22px ${HUD}`, color: C.red, alpha: a });
  const m = Math.floor(t / 60), sec = (t % 60).toFixed(1).padStart(4, '0');
  txt(`T+${String(m).padStart(2, '0')}:${sec}`, 1880, 34, { font: `400 24px ${HUD}`, color: C.cy, alpha: a, align: 'right' });
}

// ---------- 字幕（チャットログ） ----------
const WRAP = {};
function wrapLine(id, s, font, maxW) {
  if (WRAP[id]) return WRAP[id];
  ctx.save(); ctx.font = font;
  let rows = [s];
  if (ctx.measureText(s).width > maxW) {
    // 真ん中に近い区切り（、。！？ や空白）で2行に分ける
    // 句読点で切れるならそこで。なければ空白、それもなければ文字の途中
    let best = -1;
    for (const marks of ['、。！？）」…', ' ']) {
      let bestD = 1e9;
      for (let i = 1; i < s.length - 1; i++) {
        if (!marks.includes(s[i - 1])) continue;
        const w1 = ctx.measureText(s.slice(0, i)).width, w2 = ctx.measureText(s.slice(i)).width;
        if (w1 > maxW || w2 > maxW) continue;
        const d = Math.abs(w1 - w2);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) break;
    }
    if (best < 0) {
      let i = s.length;
      while (i > 1 && ctx.measureText(s.slice(0, i)).width > maxW) i--;
      best = i;
    }
    rows = [s.slice(0, best).trimEnd(), s.slice(best).trimStart()];
  }
  ctx.restore();
  return (WRAP[id] = rows);
}
function curLine(t) {
  let cur = null;
  for (const id of TLD.order) {
    const l = TLD.lines[id];
    if (l.start - .12 <= t) cur = id; else break;
  }
  return cur;
}
function drawCaption(t) {
  const id = curLine(t);
  if (!id) return;
  const l = L(id);
  const idx = TLD.order.indexOf(id);
  const next = TLD.order[idx + 1];
  // 最後のセリフは、その場面が終わるところまで（終わり方の暗転のあと、クレジットで字幕だけが戻ってこないように）
  const until = Math.min(next ? L(next).start - .12 : TLD.scenes[l.scene].end, l.end + 2.2);
  if (t > until) return;
  const fadeOut = 1 - PT(t, until - .25, .25);
  const sp = SPK[l.spk];
  const a = PT(t, l.start - .12, .15) * fadeOut;
  if (a <= 0) return;
  const x0 = 70, y0 = 878, w0 = 1780, h0 = 172;
  ctx.save(); ctx.globalAlpha = a;
  chamfer(x0, y0, w0, h0, 22);
  ctx.fillStyle = 'rgba(1,10,14,.86)'; ctx.fill();
  ctx.strokeStyle = hexA(sp.col, .85); ctx.lineWidth = 2; ctx.shadowColor = sp.col; ctx.shadowBlur = 14; ctx.stroke();
  ctx.restore();
  // アバター
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = hexA(sp.col, .12); ctx.fillRect(x0 + 18, y0 + 14, 144, 144); ctx.restore();
  const talking = t < l.end && Math.floor(t * 9) % 2 === 0;
  sprite(sp.name, x0 + 27, y0 + 23 + (talking ? -2 : 0), 9, { alpha: a });
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = hexA(sp.col, .6); ctx.lineWidth = 1.5; ctx.strokeRect(x0 + 18, y0 + 14, 144, 144); ctx.restore();
  // 名札と、声の波形
  txt(`<${sp.tag}>`, x0 + 190, y0 + 30, { font: `400 24px ${HUD}`, color: sp.col, alpha: a, ls: 2 });
  if (t < l.end) {
    for (let i = 0; i < 18; i++) {
      const v = Math.abs(Math.sin(t * 13 + i * 1.3) * Math.sin(t * 7.1 + i * .7));
      ctx.save(); ctx.globalAlpha = a * .8; ctx.fillStyle = sp.col;
      ctx.fillRect(x0 + 470 + i * 9, y0 + 30 - v * 14, 5, Math.max(2, v * 28)); ctx.restore();
    }
  }
  const font = `700 44px ${JP}`;
  const rows = wrapLine(id, l.text, font, 1540);
  const total = rows.join('').length;
  const p = PT(t, l.start, Math.max(.35, (l.end - l.start) * .55));
  let left = Math.floor(total * p), cur = false;
  rows.forEach((r, i) => {
    const n = Math.min(r.length, left); left -= n;
    const y = y0 + (rows.length === 1 ? 102 : 80 + i * 54);
    // カーソルは打っている行の1か所だけ（打ち終わったら最後の行の後ろで点滅）。まだ打っていない行には出さない
    const here = !cur && (n < r.length || i === rows.length - 1);
    if (here) cur = true;
    typed(r.slice(0, n), x0 + 190, y, 1, { font, color: C.wht, alpha: a, cursor: here && (n < r.length || t < l.end), ccol: sp.col, t });
    if (n < r.length) left = 0;
  });
}

// ---------- 1フレーム ----------
function renderFrame(t) {
  t = clamp(t, 0, TLD.duration);
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  const sid = sceneAt(t), s = S(sid);
  const [sx, sy] = shakeAt(t);
  ctx.save(); ctx.translate(sx, sy);
  (SCN[sid] || stubScene)(t, s);
  ctx.restore();
  // シーンのつなぎ: チャンネルを切り替えたような乱れ
  const sw = s.start > 0 ? 1 - PT(t, s.start, .45) : 0;
  if (sw > 0) { sliceGlitch(sw, t); flash('#bff7ff', sw * .25); }
  drawHUD(t, sid);
  drawCaption(t);
  const g = glitchAt(t);
  if (g > 0) sliceGlitch(g, t);
  const crt = PT(t, T_CRT, .15);
  CRT.draw(t, crt, g * .1);
  if (POST[sid]) POST[sid](t, s);
}

// BGM と効果音。曲は「監査コンソール」のダークシンセ（D マイナー、120BPM）。区画ごとに編成を替える
//   冒頭: 前作の続きは明るいアルペジオ → 壁に当たって無音 → 暗い脈動 → 題名で曲が立ち上がる
//   L1〜L3: 4つ打ちのグルーヴ（赤い区画は和音を暗く）/ 奇妙な現象は打楽器を抜いた謎めいた音 / チートで E マイナーに上がって爆発
//   おわりに: ハーフタイムとベルの旋律 → 良か悪かで脈を打ち → 最後の1文で和音だけが残る
// bgm.mp3 には曲だけを書き出し、効果音は HTML の中で鳴らす（liveSE）
const SR = 48000;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const BAR = 2, BEAT = .5, SIX = .125;

// 区画（開始・終了・種類・移調）
function sections() {
  const sc = TLD.scenes, s = id => sc[id];
  const Tw = L('op2').end + .25, Tt = L('op7').end + .7;
  const A = [
    [0, L('op1').start - .2, 'ambient', 0],
    [L('op1').start - .2, Tw, 'hope', 0],
    [T_CRT, Tt, 'dark', 0],
    [Tt, s('open').end, 'drop', 0],
    [s('walls').start, s('walls').end, 'grooveA', 0],
    [s('vbaoff').start, s('vbaoff').end, 'grooveB', 0],
    [s('scan').start, s('scan').end, 'grooveA2', 0],
    [s('win32').start, s('win32').end, 'grooveB', 0],
    [s('anomaly1').start, s('anomaly1').end, 'mystery', 0],
    [s('child').start, s('child').end, 'grooveB', 0],
    [s('anomaly2').start, L('ab9').start, 'mystery', 0],
    [L('ab9').start, s('anomaly2').end, 'grooveA', 0],
    [s('why').start, s('why').end, 'tension', 0],
    [s('rda').start, s('rda').end, 'grooveC', 0],
    [s('udd').start, s('udd').end, 'grooveC', 0],
    [s('dta').start, s('dta').end, 'grooveC2', 0],
    [s('cheat').start, L('wv4').start, 'riser', 0],
    [L('wv4').start, s('cheat').end, 'drop', 2],
    [s('ending').start, L('ed12').start, 'outro', 0],
    [L('ed12').start, L('ed15').start, 'outroUp', 0],
    [L('ed15').start, L('ed18').start - .2, 'climb', 0],
    [L('ed18').start - .2, L('ed20').start - .4, 'tense2', 0],
    [L('ed20').start - .4, S('ending').end - 1.2, 'final', 0],
    [s('credits').start + .5, s('credits').end, 'credits', 0],
  ];
  return A;
}
// 和音（ルートの MIDI と構成音）
const CH = {
  Dm: [50, [62, 65, 69]], Bb: [46, [58, 62, 65]], F: [53, [60, 65, 69]], C: [48, [60, 64, 67]],
  Gm: [43, [55, 58, 62]], A: [45, [57, 61, 64]], Eb: [51, [58, 63, 67]], Am: [45, [57, 60, 64]],
};
const PROG = {
  A: ['Dm', 'Bb', 'F', 'C'], B: ['Dm', 'Bb', 'Gm', 'A'], M: ['Dm', 'Eb', 'Dm', 'Eb'], O: ['Bb', 'F', 'C', 'Dm'], H: ['Dm', 'Bb', 'F', 'C'],
};
// 主題（2小節）: [拍, 音, 長さ]
const THEME = [[0, 74, .75], [.75, 77, .75], [1.5, 81, .5], [2, 79, 1], [3, 77, .5], [3.5, 76, .5], [4, 74, 1.5], [5.5, 69, .5], [6, 72, 1], [7, 74, 1]];
const BELL = [[0, 81, 1], [1, 77, 1], [2, 76, 1], [3, 74, 1], [4, 72, 1.5], [5.5, 74, .5], [6, 76, 2]];

function buildScore(ac, dest, mode = 'all', off = 0) {
  let seed = 13579;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const noiseBuf = ac.createBuffer(1, SR * 2, SR);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  const ir = ac.createBuffer(2, SR * 3, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }

  const master = ac.createDynamicsCompressor();
  master.threshold.value = -16; master.ratio.value = 3.5; master.attack.value = .006; master.release.value = .2;
  master.connect(dest);
  const verb = ac.createConvolver(); verb.buffer = ir;
  const verbOut = ac.createGain(); verbOut.gain.value = .32; verb.connect(verbOut); verbOut.connect(master);
  const dly = ac.createDelay(1); dly.delayTime.value = BEAT * .75;
  const fb = ac.createGain(); fb.gain.value = .38; dly.connect(fb); fb.connect(dly);
  const dlyOut = ac.createGain(); dlyOut.gain.value = .3; dly.connect(dlyOut); dlyOut.connect(master);
  const music = ac.createGain(); music.gain.value = .55; music.connect(master);
  const sfx = ac.createGain(); sfx.gain.value = .75; sfx.connect(master);
  const EV = [];
  const at = (t, fn) => EV.push([t, fn]);
  const T = t => t + off;

  // ---------- 音の部品 ----------
  const g = (dst, v = 1) => { const x = ac.createGain(); x.gain.value = v; x.connect(dst); return x; };
  const env = (gn, t, a, peak, d, hold = 0) => {
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(peak, t + a);
    gn.gain.setValueAtTime(peak, t + a + hold); gn.gain.exponentialRampToValueAtTime(.0001, t + a + hold + d);
  };
  const osc = (type, f, t, d, dst) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.connect(dst); o.start(t); o.stop(t + d + .05); return o; };
  const noise = (t, d, dst, rate = 1) => { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rate; s.loop = true; s.connect(dst); s.start(t, rnd()); s.stop(t + d + .05); return s; };
  const filt = (type, f, q, dst) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dst); return b; };
  const send = (src, amt, to) => { const x = ac.createGain(); x.gain.value = amt; src.connect(x); x.connect(to); };

  // 打楽器
  const kick = (t, v = .9, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .002, v, .32);
    const o = osc('sine', 150, T(t), .4, gn); o.frequency.setValueAtTime(160, T(t)); o.frequency.exponentialRampToValueAtTime(42, T(t) + .12);
    const c = g(out, 0); env(c, T(t), .001, v * .25, .02); noise(T(t), .03, filt('highpass', 3000, .7, c));
  };
  const snare = (t, v = .35, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .002, v, .16); noise(T(t), .2, filt('bandpass', 1900, .8, gn));
    const tg = g(out, 0); env(tg, T(t), .002, v * .5, .08); osc('triangle', 190, T(t), .1, tg);
    send(gn, .25, verb);
  };
  const hat = (t, v = .08, open = false, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .001, v, open ? .22 : .035); noise(T(t), open ? .3 : .06, filt('highpass', 8000, .7, gn));
  };
  // ベース（のこぎり波＋矩形波を低域通過フィルターで）
  const bass = (t, m, d, v = .22, out = music, cut = 900) => {
    const gn = g(out, 0); env(gn, T(t), .004, v, d * .9);
    const f = filt('lowpass', cut, 6, gn); f.frequency.setValueAtTime(cut * 1.8, T(t)); f.frequency.exponentialRampToValueAtTime(cut * .35, T(t) + d);
    osc('sawtooth', mtof(m), T(t), d, f); osc('square', mtof(m - 12), T(t), d, g(f, .5));
  };
  // アルペジオ（短い矩形波。ディレイに送る）
  const arp = (t, m, d, v = .06, out = music, cut = 2600) => {
    const gn = g(out, 0); env(gn, T(t), .003, v, d);
    const f = filt('lowpass', cut, 4, gn); f.frequency.setValueAtTime(cut * 1.6, T(t)); f.frequency.exponentialRampToValueAtTime(cut * .5, T(t) + d);
    osc('square', mtof(m), T(t), d, f); send(gn, .6, dly);
  };
  // パッド（ずらした のこぎり波）
  const pad = (t, d, notes, v = .03, out = music, cut = 1100) => {
    const gn = g(out, 0);
    gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(v, T(t) + Math.min(.8, d * .3));
    gn.gain.setValueAtTime(v, T(t) + d - Math.min(.8, d * .3)); gn.gain.linearRampToValueAtTime(0, T(t) + d + .4);
    const f = filt('lowpass', cut, .8, gn);
    for (const m of notes) for (const det of [-9, 9]) { const o = osc('sawtooth', mtof(m), T(t), d + .5, f); o.detune.value = det; }
    send(gn, .6, verb);
  };
  // 主旋律（のこぎり波＋ビブラート）
  const lead = (t, m, d, v = .07, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .01, v, d * .9, d * .2);
    const f = filt('lowpass', 3200, 2, gn);
    const o1 = osc('sawtooth', mtof(m), T(t), d, f), o2 = osc('square', mtof(m), T(t), d, g(f, .4)); o2.detune.value = 7;
    const lfo = osc('sine', 5.5, T(t), d, g(o1.frequency, mtof(m) * .006));
    send(gn, .5, dly); send(gn, .3, verb);
  };
  // ベル（三角波＋倍音）
  const bell = (t, m, d, v = .06, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .002, v, d * 1.4);
    osc('triangle', mtof(m), T(t), d * 1.5, gn); osc('sine', mtof(m + 24), T(t), d * .5, g(gn, .25));
    send(gn, .7, verb); send(gn, .4, dly);
  };
  const riser = (t, d, v = .08, out = music) => {
    const gn = g(out, 0); gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(v, T(t) + d); gn.gain.linearRampToValueAtTime(0, T(t) + d + .05);
    const f = filt('bandpass', 400, 3, gn); f.frequency.setValueAtTime(300, T(t)); f.frequency.exponentialRampToValueAtTime(9000, T(t) + d);
    noise(T(t), d, f); send(gn, .5, verb);
  };
  const boom = (t, v = .7, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .003, v, 1.4);
    const o = osc('sine', 80, T(t), 1.5, gn); o.frequency.setValueAtTime(90, T(t)); o.frequency.exponentialRampToValueAtTime(30, T(t) + 1.2);
    const n = g(out, 0); env(n, T(t), .002, v * .4, .6); noise(T(t), .7, filt('lowpass', 1800, .7, n));
    send(n, .7, verb);
  };

  // ---------- 曲 ----------
  if (mode !== 'se') {
    for (const [t0, t1, kind, tr] of sections()) {
      const nb = Math.ceil((t1 - t0) / BAR - .01);
      for (let b = 0; b < nb; b++) {
        const bt = t0 + b * BAR;
        if (bt >= t1 - .05) break;
        const rest = Math.min(BAR, t1 - bt);
        at(bt - .1, () => bar(kind, b, bt, rest, tr, t0, t1));
      }
    }
  }
  function chordOf(prog, b, tr) { const [r, n] = CH[PROG[prog][b % 4]]; return [r + tr, n.map(x => x + tr)]; }
  function drums(bt, rest, o) {
    for (let k = 0; k < 4; k++) {
      const bb = bt + k * BEAT;
      if (bb >= bt + rest - .01) break;
      if (o.kick) kick(bb, o.kick);
      if (o.snare && k % 2 === 1) snare(bb, o.snare);
      if (o.hat) { hat(bb + BEAT / 2, o.hat * 1.4, true); hat(bb, o.hat * .6); hat(bb + SIX, o.hat * .4); hat(bb + SIX * 3, o.hat * .5); }
    }
  }
  function bassLine(bt, rest, root, v, cut, patt = 'oct') {
    for (let i = 0; i < 16; i++) {
      const tt = bt + i * SIX;
      if (tt >= bt + rest - .01) break;
      if (patt === 'pulse' && i % 2) continue;
      const m = root - 12 + (patt === 'oct' && i % 2 ? 12 : 0);
      bass(tt, m, SIX * .9, v, music, cut);
    }
  }
  function arpLine(bt, rest, notes, v, step = SIX, cut = 2600, up = true) {
    const seq = up ? [0, 1, 2, 1, 0, 2, 1, 2] : [2, 1, 0, 1, 2, 0, 1, 0];
    for (let i = 0; i * step < rest - .01; i++) {
      const m = notes[seq[i % 8]] + (i % 16 >= 8 ? 12 : 0);
      arp(bt + i * step, m, step * .9, v, music, cut);
    }
  }
  function theme(bt, tr, v = .06, which = THEME) {
    for (const [b0, m, d] of which) lead(bt + b0 * BEAT, m + tr, d * BEAT, v);
  }

  function bar(kind, b, bt, rest, tr, t0, t1) {
    const last = bt + BAR >= t1 - .05;
    switch (kind) {
      case 'ambient': {
        pad(bt, rest, [50, 57, 62], .018, music, 700);
        if (b % 2 === 0) arp(bt + 1, 81, .3, .02);
        break;
      }
      case 'hope': {
        const [r, n] = chordOf('A', b, tr);
        pad(bt, rest, n, .03, music, 1400);
        arpLine(bt, rest, n.map(x => x + 12), .045 + Math.min(.03, b * .006), SIX, 3000);
        if (b >= 1) { hat(bt + BEAT, .05); hat(bt + BEAT * 3, .05); }
        if (b >= 2) bassLine(bt, rest, r, .14, 700, 'pulse');
        if (b >= 3) for (let k = 0; k < 4; k++) if (bt + k * BEAT < bt + rest) kick(bt + k * BEAT, .55);
        break;
      }

  cover = null;
  await ac.resume();
  if (fromStart || T >= DUR - .05) T = 0;
  startAudio(T);
  playing = true; $('#bPlay').textContent = '❚❚'; idle();
}
function pause() { T = cur(); stopAudio(); playing = false; $('#bPlay').textContent = '▶'; dirty = true; showCtl(); }
const toggle = () => playing ? pause() : play();
function seekTo(t) { cover = null; T = Math.max(0, Math.min(DUR, t)); if (playing) startAudio(T); dirty = true; }

function loop() {
  const t = cur();
  if (playing || dirty) {
    renderFrame(cover ?? t);
    $('#tm').textContent = `${fmt(t)} / ${fmt(DUR)}`;
    if (!seeking) $('#seek').value = t;
    dirty = false;
  }
  if (playing && t >= DUR) { pause(); T = DUR; }
  requestAnimationFrame(loop);
}

// 操作バーは、再生中に動きがなければ隠す
let hideTimer = 0;
function showCtl() { document.body.classList.remove('idle'); clearTimeout(hideTimer); }
function idle() { showCtl(); hideTimer = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 2500); }
addEventListener('pointermove', idle);

$('#bPlay').onclick = () => { $('#start')?.remove(); toggle(); };
$('#bRe').onclick = () => { $('#start')?.remove(); play(true); };
$('#bMute').onclick = () => { if (!bus) return; const m = bus.gain.value > 0; bus.gain.value = m ? 0 : 1; $('#bMute').textContent = m ? '🔇' : '🔊'; };
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
$('#seek').max = DUR;
$('#seek').oninput = e => { seeking = true; seekTo(+e.target.value); };
$('#seek').onchange = () => { seeking = false; };
addEventListener('keydown', e => {
  if (!ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#start')?.remove(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') { $('#start')?.remove(); play(true); }
  else if (e.key === 'm' || e.key === 'M') $('#bMute').click();
  else if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  else if (e.key === 'ArrowRight') seekTo(cur() + 5);
  else if (e.key === 'ArrowLeft') seekTo(cur() - 5);
});

loadAll().then(() => {
  ready = true;
  // 再生前は、タイトルの場面を表紙として見せる
  T = 0; cover = L('op7').end + 2.6; renderFrame(cover); dirty = false;
  const st = $('#start');
  st.classList.remove('loading');
  $('#startLbl').textContent = `▶ 再生（${Math.floor(DUR / 60)}分${Math.round(DUR % 60)}秒）`;
  st.onclick = () => { st.remove(); play(true); };
  $('#tm').textContent = `0:00 / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
});
</script>

</body>
</html>
