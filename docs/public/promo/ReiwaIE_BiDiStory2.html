// ---------- 字幕（現場の無線） ----------
const WRAP = {};
function wrapLine(id, s, font, maxW) {
  if (WRAP[id]) return WRAP[id];
  ctx.save(); ctx.font = font;
  let rows = [s];
  if (ctx.measureText(s).width > maxW) {
    let best = -1;
    for (const marks of ['、。！？）」…', ' ']) {
      let bestD = 1e9;
      for (let i = 1; i < s.length - 1; i++) {
        if (!marks.includes(s[i - 1])) continue;
        const w1 = ctx.measureText(s.slice(0, i)).width, w2 = ctx.measureText(s.slice(i)).width;
        if (w1 > maxW || w2 > maxW) continue;
        const d = Math.abs(w1 - w2);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) break;
    }
    if (best < 0) { let i = s.length; while (i > 1 && ctx.measureText(s.slice(0, i)).width > maxW) i--; best = i; }
    rows = [s.slice(0, best).trimEnd(), s.slice(best).trimStart()];
  }
  ctx.restore();
  return (WRAP[id] = rows);
}
function curLine(t) {
  let cur = null;
  for (const id of TLD.order) { const l = TLD.lines[id]; if (l.start - .12 <= t) cur = id; else break; }
  return cur;
}

HOOK = t => {
  const a = F('tg5', .05), b = F('tg5', .45), c = F('tg5', .9);
  let x = 3050, y = 640, load = null;
  const carry = t > L('op13').start - .3 && t < c;
  if (t >= a) { x = lerp(3050, BX1 + 80, E.io(PT(t, a, (b - a) * .9))); }
  if (t >= b) { y = lerp(640, FL.b1b - 230, E.io(PT(t, b, c - b))); }
  if (t >= c) { x = BX1 + 80; y = lerp(FL.b1b - 230, 640, E.io(PT(t, c + .3, 2.5))); }
  if (carry) {
    const sq = PT(t, F('tg5', .3), .5);
    load = (hx, hy) => {
      const w = 220, h = lerp(140, 92, sq);
      line(hx, hy - 16, hx - w / 2 + 10, hy, '#333', 3); line(hx, hy - 16, hx + w / 2 - 10, hy, '#333', 3);
      crate(hx - w / 2, hy, w, h, { label: sq > .5 ? 'BROTLI' : 'MAPPER' });
      if (sq <= 0) txt('mapperTab.js', hx, hy + h + 26, { font: `700 22px ${CODE}`, color: '#fff', align: 'center', stroke: C.blk, sw: 5 });
    };
  }
  return { x, y, load };
};

      if (io.sub) {
        txt(s, 104, yy + rh / 2 - 26, { font: `800 ${o.fs || 34}px ${JP}`, color: C.ink, maxW: w2 - 140 });
        txt(io.sub, 104, yy + rh / 2 + 20, { font: `600 ${o.sfs || 25}px ${io.code ? CODE : JP}`, color: C.ink2, maxW: w2 - 140 });

// 表の看板。cols: 見出し、rows: [[項目, 値1, 値2, 出る時刻], ...]
function tableBoard(t, t0, t1, x, y, w, title, cols, rows, o = {}) {
  const rh = o.rh || 96, kw = o.kw || 300, h = 74 + 30 + 64 + rows.length * rh + 20;
  return signboard(t, t0, t1, x, y, w, h, title, (w2, h2, top) => {
    const cw = (w2 - 60 - kw) / 2;
    cols.forEach((c, i) => {
      const cx = 30 + kw + cw * i;
      ctx.fillStyle = i === 1 ? (o.c2 || C.blueL) : '#eef0f3'; rr(cx + 6, top + 20, cw - 12, 56, 8); ctx.fill();
      txt(c, cx + cw / 2, top + 49, { font: `800 30px ${o.code ? CODE : JP}`, color: i === 1 ? (o.c2t || C.blue) : C.ink, align: 'center', maxW: cw - 30 });
    });
    rows.forEach(([k, a, b, ti], i) => {
      const p = PT(t, ti ?? t0, .35);
      if (p <= 0) return;
      const yy = top + 90 + i * rh;
      ctx.save(); ctx.globalAlpha *= p;
      line(30, yy, w2 - 30, yy, '#d8d4c8', 2);
      txt(k, 40, yy + rh / 2, { font: `800 27px ${JP}`, color: C.ink2, maxW: kw - 20 });
      for (const [v, i2] of [[a, 0], [b, 1]]) {
        const cx = 30 + kw + cw * i2;
        v.split('\n').forEach((r, j, arr) => txt(r, cx + cw / 2, yy + rh / 2 + (j - (arr.length - 1) / 2) * 36, { font: `800 ${o.fs || 29}px ${JP}`, color: i2 === 1 ? (o.c2t || C.blue) : C.ink, align: 'center', maxW: cw - 24 }));
      }
      ctx.restore();
    });
    if (o.extra) o.extra(w2, h2, top);
  }, o);
}

const THEME = [[0, 77, .5], [.5, 81, .5], [1, 84, .75], [2, 82, .5], [2.5, 79, .5], [3, 76, .75],

        break;
      }
      case 'wonder': {
        const [r, n] = chordOf('wonder', b);
        pipeArp(bt, rest, n, .028, [0, 1, 2, 1, 0, 1, 2, 1]);
        steps(bt, rest, (i, tt) => { if (i === 0 || i === 10) stomp(tt, .45); if (i === 4 || i === 12) clap(tt, .07); if (i % 2 === 1) ratchet(tt, .025); });
        tuba(bt, r, BEAT * 1.4, .12); if (BEAT * 2.5 < rest) tuba(bt + BEAT * 2.5, r + 12, BEAT * .8, .08);
        if (b % 4 === 0) pad(bt, Math.min(BAR * 4, t1 - bt), n, .013, 1400);
        break;
      }

$('#bRe').onclick = () => { $('#start')?.remove(); play(true); };
$('#bMute').onclick = () => { if (!bus) return; const m = bus.gain.value > 0; bus.gain.value = m ? 0 : 1; $('#bMute').textContent = m ? '🔇' : '🔊'; };
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
$('#seek').max = DUR;
$('#seek').oninput = e => { seeking = true; seekTo(+e.target.value); };
$('#seek').onchange = () => { seeking = false; };
addEventListener('keydown', e => {
  if (!ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#start')?.remove(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') { $('#start')?.remove(); play(true); }
  else if (e.key === 'm' || e.key === 'M') $('#bMute').click();
  else if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  else if (e.key === 'ArrowRight') seekTo(cur() + 5);
  else if (e.key === 'ArrowLeft') seekTo(cur() - 5);
});

loadAll().then(() => {
  ready = true;
  // 再生前は、タイトルの場面を表紙として見せる
  T = 0; cover = S('title').start + 3.4; window.__cover = true; window.__playing = false; renderFrame(cover); dirty = false;
  const st = $('#start');
  st.classList.remove('loading');
  $('#startLbl').textContent = `▶ 再生（${Math.floor(DUR / 60)}分${Math.round(DUR % 60)}秒）`;
  st.onclick = () => { st.remove(); play(true); };
  $('#tm').textContent = `0:00 / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
});
</script>

</body>
</html>
