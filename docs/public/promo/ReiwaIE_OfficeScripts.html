命令をシーディーピーに訳す係。", "scene": "equation", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "eq5": {"start": 712.696, "end": 718.488, "spk": "t", "text": "Office.js は、Excel の端っこの WebView2 で動いて、JavaScript の命令を Excel 本体に届ける係。", "say": "オフィスジェイエスは、エクセルの端っこのウェブビューツーで動いて、ジャバスクリプトの命令をエクセル本体に届ける係。", "scene": "equation", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "eq6": {"start": 718.708, "end": 723.625, "spk": "t", "text": "どっちも、ネイティブの本体はそのままに、タブの中の JavaScript が通訳としてかぶさってる。", "say": "どっちも、ネイティブの本体はそのままに、タブの中のジャバスクリプトが通訳としてかぶさってる。", "scene": "equation", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "eq7": {"start": 724.025, "end": 728.601, "spk": "z", "text": "Google と Microsoft が、別々の場所で、おんなじ形にたどり着いてたのだ……！", "say": "グーグルとマイクロソフトが、別々の場所で、おんなじ形にたどり着いてたのだ！", "scene": "equation", "p": {"speaker": 3, "speed": 1.36, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "eq8": {"start": 729.001, "end": 732.543, "spk": "t", "text": "で、このツールは、どっちのタブにも CDP で手が届いちゃう。", "say": "で、このツールは、どっちのタブにもシーディーピーで手が届いちゃう。", "scene": "equation", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "eq9": {"start": 733.243, "end": 735.013, "spk": "z", "text": "これ、わかる人いるのだ……？", "say": "これ、わかる人いるのだ？", "scene": "equation", "p": {"speaker": 3, "speed": 1.36, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "eq10": {"start": 735.413, "end": 740.651, "spk": "t", "text": "両方の中を CDP でのぞいた人なら、たぶんね。わかっちゃったら、ちょっと気持ちいいでしょ？", "say": "両方の中をシーディーピーでのぞいた人なら、たぶんね。わかっちゃったら、ちょっと気持ちいいでしょ？", "scene": "equation", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl0": {"start": 745.051, "end": 748.485, "spk": "t", "text": "CDPは、VBA自身の機能拡張でもあった", "say": "シーディーピーは、ブイビーエー自身の機能拡張でもあった", "scene": "finale", "p": {"speaker": 8, "speed": 1.2, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "cl1": {"start": 749.705, "end": 754.868, "spk": "t", "text": "このツールは、外の Web サイトを操るスクレイピングキットとして、CDP を土台に育ててきたの。", "say": "このツールは、外のウェブサイトを操るスクレイピングキットとして、シーディーピーを土台に育ててきたの。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl2": {"start": 755.088, "end": 758.352, "spk": "t", "text": "でも、CDP が届くのは、外の Web だけじゃなかった。", "say": "でも、シーディーピーが届くのは、外のウェブだけじゃなかった。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl3": {"start": 758.572, "end": 763.105, "spk": "t", "text": "VBA が寄生してる Excel の中にも、CDP で操れる WebView2 が載ってたんだよね。", "say": "ブイビーエーが寄生してるエクセルの中にも、シーディーピーで操れるウェブビューツーが載ってたんだよね。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl4": {"start": 763.325, "end": 768.072, "spk": "t", "text": "WebSocket の土台が整ってたから、そこにつないで、Office.js で Excel まで動かせた。", "say": "ウェブソケットの土台が整ってたから、そこにつないで、オフィスジェイエスでエクセルまで動かせた。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl5": {"start": 768.792, "end": 775.875, "spk": "t", "text": "かつて Win32 API の魔法で何でもできた VBA は、セキュリティを理由に、レガシーとして封印されて、進化がほぼ止まった。", "say": "かつてウィンさんじゅうにエーピーアイの魔法で何でもできたブイビーエーは、セキュリティを理由に、レガシーとして封印されて、進化がほぼ止まった。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl6": {"start": 776.475, "end": 783.632, "spk": "z", "text": "これからはクラウドと Web の時代！VBA は過去の遺物。新しい世界は、Office Scripts や Copilot が創るのだ！", "say": "これからはクラウドとウェブの時代！ブイビーエーは過去の遺物。新しい世界は、オフィススクリプツやコパイロットが創るのだ！", "scene": "finale", "p": {"speaker": 3, "speed": 1.36, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "cl7": {"start": 784.032, "end": 788.768, "spk": "t", "text": "って言わんばかりに、Microsoft はクラウド周り、Power○○系の強化に舵を切った。", "say": "って言わんばかりに、マイクロソフトはクラウド周り、パワーまるまる系の強化に舵を切った。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl8": {"start": 789.488, "end": 795.824, "spk": "t", "text": "でも、VBA に CDP を叩き込んだら、できなかったはずの「VBA から Office.js」が、現実になっちゃった。", "say": "でも、ブイビーエーにシーディーピーを叩き込んだら、できなかったはずのブイビーエーからオフィスジェイエスが、現実になっちゃった。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl9": {"start": 796.344, "end": 804.067, "spk": "t", "text": "過去の全能感、Win32 API。未来の最新技術、Office.js。両方そろった、バランス崩壊ツールの出来上がり。", "say": "過去の全能感、ウィンさんじゅうにエーピーアイ。未来の最新技術、オフィスジェイエス。両方そろった、バランス崩壊ツールの出来上がり。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}, "cl10": {"start": 804.467, "end": 806.739, "spk": "z", "text": "そんなの、誰が使いこなせるのだ……？", "say": "そんなの、誰が使いこなせるのだ？", "scene": "finale", "p": {"speaker": 3, "speed": 1.36, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "cl11": {"start": 807.439, "end": 811.78, "spk": "t", "text": "きっと、あーしと AI。それから、ここまで観てくれた、あなたでしょ。", "say": "きっと、あーしとエーアイ。それから、ここまで観てくれた、あなたでしょ。", "scene": "finale", "p": {"speaker": 8, "speed": 1.32, "pitch": 0.0, "intonation": 1.18}, "style": "ノーマル"}}};

// 描画の土台: 舞台は「Excel のシート」。つむぎがプリ帳みたいにデコりながら、シートの果て（XFD 列）をぶち抜いていく
// 録画（mp4）は video 要素を Canvas に描く。再生中は動画を流し、止めているときやシークでは、その時刻のコマに合わせる
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1920, H = 1080;
// 描く倍率。HTML 版は全画面のときに Canvas の画素数を変え、座標は 1920×1080 のまま SC 倍して描く
let SC = 1;
// 光のぼかし（shadowBlur）と影のずれは座標の倍率がかからないので、ここで SC 倍する
{
  for (const k of ['shadowBlur', 'shadowOffsetX', 'shadowOffsetY']) {
    const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, k);
    Object.defineProperty(ctx, k, { get() { return d.get.call(this) / SC; }, set(v) { d.set.call(this, v * SC); } });
  }
}

const JP = "'M PLUS Rounded 1c','Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif";   // 本文・字幕
const POP = "'Mochiy Pop One','M PLUS Rounded 1c','Yu Gothic UI',sans-serif";     // 見出し・ステッカー
const PEN = "'Hachi Maru Pop','M PLUS Rounded 1c','Yu Gothic UI',sans-serif";     // プリのペン（らくがき）

// 色: Excel の緑、シートの白と罫線、ギャルのネオン（ピンク・レモン・シアン・バイオレット）
const C = {
  paper: '#fbfaf6', grid: '#dfe3e9', head: '#f0f1f3', headLn: '#cfd4db', headTx: '#5f6672',

  tsumugi: '#ff4fa3', zunda: '#55c23f', navy: '#1d1b3a', gold: '#ffb700',

  back: '#edf2ff', backGrid: '#cdd8f3', backTx: '#9aa9cf',
};

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const PT = (t, t0, d) => d <= 0 ? (t >= t0 ? 1 : 0) : clamp((t - t0) / d);
const E = {
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  sine: p => .5 - .5 * Math.cos(Math.PI * p),
  // ぷるんと止まる
  elastic: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
// 同じ番号なら同じ値を返す乱数（フレームごとに揺れないように）
const hr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hexA = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};
function mixHex(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const m = s => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, clamp(k)));
  return '#' + ((m(16) << 16) | (m(8) << 8) | m(0)).toString(16).padStart(6, '0');
}

// 時刻表（timeline.py の tld.json）
const L = id => { const l = TLD.lines[id]; if (!l) throw new Error('no line ' + id); return l; };
const S = id => TLD.scenes[id];
const F = (id, f) => { const l = L(id); return l.start + (l.end - l.start) * f; };

// ---------- 録画クリップ ----------
// 置き場所: 確認用のサーバーでは /promo/voice/…、HTML 版では voice/…（build_web.py が置き換える）
const CLIP_DIR = 'voice/ReiwaIE_OfficeScripts/clips/';
// クリップの大きさと長さ（clips.py で切り出したもの）
const CLIPS = {
  desk: { w: 1920, h: 758, dur: 51.5 },
  web: { w: 1920, h: 696, dur: 15.1 },
  help: { w: 1920, h: 822, dur: 32.5 },
  mirror: { w: 1920, h: 1246, dur: 29.0 },

    v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
    v.addEventListener('seeked', () => window.__redraw?.());

    return (els[id] = { v, used: -1, want: 0 });

    begin() { frame++; },
    // クリップ id を、クリップ内の時刻 ct（秒）、速さ rate で使う。描ける状態なら video 要素を返す
    get(id, ct, rate = 1) {
      const e = el(id), v = e.v, dur = CLIPS[id].dur - .05;

      const end = ct >= dur;

        if (!v.seeking && Math.abs(v.currentTime - ct) > .3 * Math.max(1, rate)) v.currentTime = ct;
        if (v.paused) v.play().catch(() => {});
      } else {
        if (!v.paused) v.pause();
        if (!v.seeking && Math.abs(v.currentTime - ct) > .04) v.currentTime = ct;

    },
    end() { for (const id in els) { const e = els[id]; if (e.used !== frame && !e.v.paused) e.v.pause(); } },
    preload() { for (const id in CLIPS) el(id); },
    // 確認用（静止画の書き出し）: いまのフレームで使ったクリップが、目的のコマに着くまで待つ
    async settle() {
      const ws = [];
      for (const id in els) {
        const e = els[id], v = e.v;
        if (e.used !== frame) continue;
        ws.push((async () => {
          if (v.readyState < 1) await new Promise(r => { v.addEventListener('loadedmetadata', r, { once: true }); setTimeout(r, 8000); });
          if (Math.abs(v.currentTime - e.want) > .02 || v.readyState < 2) {
            const p = new Promise(r => { v.addEventListener('seeked', r, { once: true }); setTimeout(r, 8000); });
            v.currentTime = e.want + .001;
            await p;
          }
          if (v.readyState < 2) await new Promise(r => { v.addEventListener('canplay', r, { once: true }); setTimeout(r, 4000); });
        })());
      }
      await Promise.all(ws);

})();

  let best = -1, bestD = 1e9;
  for (const marks of ['、。！？）」…', ' ']) {
    for (let i = 1; i < s.length - 1; i++) {

      if (w1 > maxW || w2 > maxW) continue;

const DASH = 2.6;  // 駆ける時間
function titleCam(t, s) {
  const x0 = camOf('open', S('open').end).x, z1 = 1;
  const x1 = (ROWW + XFD * CW * z1 - 1240) / z1;
  const p = PT(t, s.start, DASH);
  // 対数で補間すると、A→Z→AA→…→XFD と桁が上がっていく感じになる
  const lx = lerp(Math.log(x0 + 1), Math.log(x1 + 1), E.inOut(p));
  return { x: Math.exp(lx) - 1, y: 0, z: lerp(1.2, z1, E.inOut(p)) };
}
// 割れ目と破片（決まった形）
const SHARDS = (() => {
  const out = [], cx = 1240, cy = 470, rays = 14, rings = [0, 120, 300, 560, 900, 1500];
  const ang = [...Array(rays)].map((_, i) => (i / rays) * Math.PI * 2 + (hr(i + 5) - .5) * .3);
  for (let r = 0; r < rings.length - 1; r++) for (let i = 0; i < rays; i++) {
    const a0 = ang[i], a1 = ang[(i + 1) % rays] + (i === rays - 1 ? Math.PI * 2 : 0);
    const r0 = rings[r] * (1 + (hr(i + r * 9) - .5) * .25), r1 = rings[r + 1] * (1 + (hr(i * 3 + r) - .5) * .25);
    const pts = [[cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0], [cx + Math.cos(a1) * r0, cy + Math.sin(a1) * r0], [cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1], [cx + Math.cos(a0) * r1, cy + Math.sin(a0) * r1]];
    const mx = pts.reduce((a, p) => a + p[0], 0) / 4, my = pts.reduce((a, p) => a + p[1], 0) / 4;
    out.push({ pts, mx, my, vx: (mx - cx) * (1.2 + hr(i + r) * .8), vy: (my - cy) * (1.2 + hr(i * 2 + r) * .8) - 200, rot: (hr(i * 5 + r) - .5) * 6, ring: r });
  }
  return { cx, cy, out, ang, rings };
})();
const TI = s => s.start + DASH;        // 壁にぶつかる
const TB = s => s.start + DASH + 1.45; // 割れる

function beyond(t, a = 1) {
  // 壁の向こう: ピンクから黄色へのグラデーションと、集中線

}

        ang.forEach((a, i) => {

  } else {
    // 割れた: 向こう側の世界と、飛び散る破片

function nestBox(x, y, w, h, label, col, p, o = {}) {

}

// デスクトップ版（rel = 証拠シーンの頭からの秒）: Showcase_00 → PlayMandelbrot に入る → 戻って PlayLife に入る
function vbeDesk(ct, rel, a) {
  const X = 1290, Y = 150, WW = 600, HH = 390;
  const into = (r0) => E.inOut(PT(rel, r0, .7));
  // [始まり(rel), 中身, 動いている行]
  let src, top, hi, hiA = 1, cnt = null;
  if (rel < 9.0) { src = VBE_SRC.main; top = 168; hi = 173; }
  else if (rel < 15.65) {
    src = VBE_SRC.mandel; const k = into(9.0); top = lerp(313, 323, k); hi = 334; hiA = PT(k, .8, .2);
    cnt = `f = ${Math.min(119, countAt(VBE_COUNT.deskMandel, ct))}`;
  } else if (rel < 16.6) { src = VBE_SRC.main; top = 168; hi = 174; }
  else {
    src = VBE_SRC.life; const k = into(16.6); top = lerp(342, 349, k); hi = 359; hiA = PT(k, .8, .2);
    cnt = `g = ${Math.min(239, countAt(VBE_COUNT.deskLife, ct))}`;
  }
  // 入れ替わりは、さっと下から差し込む
  const sw = [9.0, 15.65, 16.6].reduce((m, r) => rel >= r && rel < r + .3 ? PT(rel, r, .3) : m, 1);
  vbeWin(X, Y, WW, HH, src.proc, a, (x, y, w, h) => {
    ctx.save(); ctx.globalAlpha *= .4 + .6 * sw; ctx.translate(0, (1 - E.out(sw)) * 26);

// 天秤（バランス崩壊）
function scale2(cx, cy, p, t) {
  const tilt = p < .5 ? 0 : E.out(PT(p, .5, .5)) * .5, brk = PT(p, .75, .25);

  ctx.save(); ctx.rotate(-tilt); line(-300, 0, -20 - brk * 30, 0, '#ffd36b', 10); ctx.restore();
  ctx.save(); ctx.rotate(tilt); line(20 + brk * 30, 0, 300, 0, '#ffd36b', 10); ctx.restore();
  // 天秤の腕が両方とも折れて垂れ下がる（バランス崩壊）
  const pan = (side, label, col) => tagSticker(label, side * 300 * Math.cos(tilt), 300 * Math.sin(tilt) + brk * 120 + 70, { size: 30, font: `800 30px ${JP}`, fill: col, color: '#fff' });

  pan(1, '未来の最新技術（Office.js）', C.pink);
  ctx.restore();
}

  ctx.fillStyle = '#fff'; rr(x + 90, y + 10, w - 110, 20, 10); ctx.fill();

window.renderAudio = async function (mode = 'music') {
  const dur = TLD.duration + 2;
  const ac = new OfflineAudioContext(2, Math.ceil(dur * SR), SR);
  const { run } = buildScore(ac, ac.destination, mode);
  const WIN = 4;
  run(WIN + .5);
  for (let w = WIN; w < dur; w += WIN) ac.suspend(w).then(() => { run(w + WIN + .5); ac.resume(); });
  const buf = await ac.startRendering();
  const L0 = buf.getChannelData(0), R0 = buf.getChannelData(1);
  const pcm = new Int16Array(L0.length * 2);
  for (let i = 0; i < L0.length; i++) {
    pcm[i * 2] = Math.max(-1, Math.min(1, L0[i])) * 32767;
    pcm[i * 2 + 1] = Math.max(-1, Math.min(1, R0[i])) * 32767;

};

// HTML 版の効果音: 再生位置 from から、ムービーの 0 秒 = ac の base 秒として、少し先の分ずつ鳴らす
window.liveSE = function (ac, dest) {
  let timer = 0, out = null;
  return {
    start(from, base) {
      this.stop();
      out = ac.createGain(); out.connect(dest);
      const sc = buildScore(ac, out, 'se', base);
      const step = () => sc.run(ac.currentTime - base + 1.5, from - .05);
      step(); timer = setInterval(step, 100);
    },
    stop() {
      clearInterval(timer);
      if (!out) return;
      const o = out, now = ac.currentTime;
      o.gain.setValueAtTime(o.gain.value, now); o.gain.linearRampToValueAtTime(0, now + .05);
      setTimeout(() => o.disconnect(), 300);
      out = null;
    },
  };
};

window.audioChunk = function (i, size) {
  const sub = window.__PCM.subarray(i * size, (i + 1) * size);
  let s = '';
  for (let k = 0; k < sub.length; k += 0x8000) s += String.fromCharCode.apply(null, sub.subarray(k, k + 0x8000));
  return btoa(s);
};

const DUR = TLD.duration;
const BG = .85, DUCK = .45;
const $ = s => document.querySelector(s);
const fmt = s => { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };

let ac = null, bus = null, bgGain = null, voGain = null, bgm = null, se = null;
const VO = {};
let srcs = [], playing = false, T = 0, base = 0, seeking = false, ready = false, dirty = true, cover = null;

// セリフが続く区間をまとめて、BGM を下げる区間にする
const DUCKS = [];
for (const id of TLD.order) {
  const l = TLD.lines[id], a = l.start - .1, b = l.end + .15, last = DUCKS[DUCKS.length - 1];
  if (last && a - last[1] < .7) last[1] = b; else DUCKS.push([a, b]);
}

function fit() {
  // innerWidth はスマートフォンで縮小表示されると変わってしまうので、画面の実際の幅（clientWidth）で測る
  const vw = document.documentElement.clientWidth || innerWidth, vh = document.documentElement.clientHeight || innerHeight;
  const s = Math.min(vw / 1920, vh / 1080);
  cv.style.width = 1920 * s + 'px'; cv.style.height = 1080 * s + 'px';
  // Canvas の画素数: ふだんは 1920×1080。全画面のときだけ画面の画素数に合わせる（16:9 のまま、1080p 未満にはしない、上限は横 3840）
  const full = document.fullscreenElement || document.webkitFullscreenElement;
  const pw = full ? Math.min(3840, Math.max(1920, Math.round(1920 * s * (devicePixelRatio || 1)))) : 1920;
  if (cv.width !== pw) { cv.width = pw; cv.height = Math.round(pw * 9 / 16); SC = pw / 1920; dirty = true; }
}
// 全画面の出入りと、resize が届かない変わり方（埋め込み先の枠の変化など）も見張る
addEventListener('resize', fit); addEventListener('fullscreenchange', fit); addEventListener('webkitfullscreenchange', fit);
new ResizeObserver(() => fit()).observe(document.documentElement); fit();

async function loadAll() {
  VID.preload();
  const total = TLD.order.length + 2;
  let n = 0;
  const step = () => { $('#startLbl').textContent = `読み込み中… ${Math.round(++n / total * 100)}%`; };
  const weights = [500, 600, 700, 800, 900];
  await Promise.all([
    ...weights.map(w => document.fonts.load(`${w} 40px "Noto Sans JP"`, CHARS).catch(() => {})),
    ...['500 40px "M PLUS Rounded 1c"', '700 40px "M PLUS Rounded 1c"', '800 40px "M PLUS Rounded 1c"', '900 40px "M PLUS Rounded 1c"',
      '400 40px "Mochiy Pop One"', '400 40px "Hachi Maru Pop"', '400 40px "Rampart One"', '400 40px "Fira Code"', '500 40px "Fira Code"', '700 40px "Fira Code"']
      .map(f => document.fonts.load(f, CHARS).catch(() => {})),
  ]);
  step();
  ac = new (window.AudioContext || window.webkitAudioContext)();
  bus = ac.createGain(); bus.connect(ac.destination);
  bgGain = ac.createGain(); bgGain.gain.value = BG; bgGain.connect(bus);
  voGain = ac.createGain(); voGain.connect(bus);
  // 効果音は bgm.mp3 に入れず、絵と同じ時刻表からブラウザの中で鳴らす（BGM と同じく、声の間は下げる）
  se = window.liveSE(ac, bgGain);
  const get = async url => { const r = await fetch(url); if (!r.ok) throw new Error(url); return await ac.decodeAudioData(await r.arrayBuffer()); };
  try { bgm = await get(VOICE_DIR + 'bgm.mp3'); } catch (e) { console.warn('BGM なしで再生します', e); }
  step();
  // 声が読み込めなくても、字幕と BGM だけで再生できるようにする
  await Promise.all(TLD.order.map(async id => { try { VO[id] = await get(VOICE_DIR + id + '.wav'); } catch (e) { console.warn(e); } step(); }));
}

function stopAudio() { for (const s of srcs) { try { s.stop(); } catch (e) {} } srcs = []; se?.stop(); }
function startAudio(from) {
  stopAudio();
  const now = ac.currentTime + .06;
  base = now - from;
  if (bgm && from < bgm.duration) {
    const s = ac.createBufferSource(); s.buffer = bgm; s.connect(bgGain); s.start(now, from); srcs.push(s);
  }
  const g = bgGain.gain;
  g.cancelScheduledValues(0); g.setValueAtTime(BG, now);
  for (const [a, b] of DUCKS) {
    if (b < from) continue;
    const ta = base + a, tb = base + b;
    if (ta > now) { g.setValueAtTime(BG, ta); g.linearRampToValueAtTime(BG * DUCK, ta + .15); }
    else g.setValueAtTime(BG * DUCK, now);
    g.setValueAtTime(BG * DUCK, Math.max(now, tb)); g.linearRampToValueAtTime(BG, Math.max(now, tb) + .35);
  }
  for (const id of TLD.order) {
    const l = TLD.lines[id], buf = VO[id];
    if (!buf) continue;
    const off = Math.max(0, from - l.start);
    if (off >= buf.duration) continue;
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(voGain);
    s.start(base + l.start + off, off); srcs.push(s);
  }
  se.start(from, base);
}

const cur = () => playing ? Math.min(DUR, ac.currentTime - base) : T;
async function play(fromStart) {
  if (!ready) return;
  cover = null;
  await ac.resume();
  if (fromStart || T >= DUR - .05) T = 0;
  startAudio(T);
  playing = true; $('#bPlay').textContent = '❚❚'; idle();
}
function pause() { T = cur(); stopAudio(); playing = false; $('#bPlay').textContent = '▶'; dirty = true; showCtl(); }
const toggle = () => playing ? pause() : play();
function seekTo(t) { cover = null; T = Math.max(0, Math.min(DUR, t)); if (playing) startAudio(T); dirty = true; }

window.__redraw = () => { dirty = true; };
function loop() {
  const t = cur();
  if (playing || dirty) {
    window.__cover = cover != null; window.__playing = playing && cover == null; renderFrame(cover ?? t);
    $('#tm').textContent = `${fmt(t)} / ${fmt(DUR)}`;
    if (!seeking) $('#seek').value = t;
    dirty = false;
  }
  if (playing && t >= DUR) { pause(); T = DUR; }
  requestAnimationFrame(loop);
}

// 操作バーは、再生中に動きがなければ隠す
let hideTimer = 0;
function showCtl() { document.body.classList.remove('idle'); clearTimeout(hideTimer); }
function idle() { showCtl(); hideTimer = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 2500); }
addEventListener('pointermove', idle);

$('#bPlay').onclick = () => { $('#start')?.remove(); toggle(); };
$('#bRe').onclick = () => { $('#start')?.remove(); play(true); };
$('#bMute').onclick = () => { if (!bus) return; const m = bus.gain.value > 0; bus.gain.value = m ? 0 : 1; $('#bMute').textContent = m ? '🔇' : '🔊'; };
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
$('#seek').max = DUR;
$('#seek').oninput = e => { seeking = true; seekTo(+e.target.value); };
$('#seek').onchange = () => { seeking = false; };
addEventListener('keydown', e => {
  if (!ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#start')?.remove(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') { $('#start')?.remove(); play(true); }
  else if (e.key === 'm' || e.key === 'M') $('#bMute').click();
  else if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  else if (e.key === 'ArrowRight') seekTo(cur() + 5);
  else if (e.key === 'ArrowLeft') seekTo(cur() - 5);
});

loadAll().then(() => {
  ready = true;
  // 再生前は、タイトルの場面を表紙として見せる
  T = 0; cover = F('tt1', .9); window.__cover = true; window.__playing = false; renderFrame(cover); dirty = false;
  const st = $('#start');
  st.classList.remove('loading');
  $('#startLbl').textContent = `▶ 再生（${Math.floor(DUR / 60)}分${Math.round(DUR % 60)}秒）`;
  st.onclick = () => { st.remove(); play(true); };
  $('#tm').textContent = `0:00 / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
});
</script>
