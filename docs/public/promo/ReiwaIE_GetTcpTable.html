そうだな」くらいで、眺めていたそうですわ。", "say": "作者さんも最初は、ウィンドウズアップデートで、大変そうだなー、くらいで、眺めていたそうですわ。", "scene": "sns", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "sn4": {"start": 68.393, "end": 74.377, "spk": "z", "text": "SeleniumBasic は、VBA から WebDriver を動かせる、10年来の定番なのだ。", "say": "セレニウムベーシックは、ブイビーエーから、ウェブドライバーを動かせる、じゅうねんらいの、定番なのだ。", "scene": "sns", "p": {"speaker": 3, "speed": 1.38, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "sn5": {"start": 75.177, "end": 79.444, "spk": "i", "text": "そんな話をしていたら、作者さんが、ふとつぶやきましたの。", "say": "そんな話をしていたら、作者さんが、ふと、つぶやきましたの。", "scene": "sns", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "sn6": {"start": 79.964, "end": 84.124, "spk": "i", "text": "「AI に真の原因を調査してもらったら、面白そう」", "say": "エーアイに、真の原因を、調査してもらったら、面白そう。", "scene": "sns", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "sn7": {"start": 85.024, "end": 90.987, "spk": "z", "text": "そこへ、sele_chan さんからお返事なのだ。「私には手に負えないですが、君ならできそう」", "say": "そこへ、セレちゃんさんから、お返事なのだ。私には、手に負えないですが、君なら、できそう。", "scene": "sns", "p": {"speaker": 3, "speed": 1.38, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "sn8": {"start": 91.887, "end": 96.633, "spk": "i", "text": "こうして、他人のツールの不具合を掘る、夜回りが始まったのですわ。", "say": "こうして、他人のツールの不具合を掘る、夜回りが、始まったのですわ。", "scene": "sns", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "er1": {"start": 101.033, "end": 108.692, "spk": "i", "text": "Windows 11 26H2 の PC で、SeleniumBasic から WebDriver を起動すると……", "say": "ウィンドウズイレブン、にじゅうろく、エイチツーの、ピーシーで、セレニウムベーシックから、ウェブドライバーを、起動すると。", "scene": "error", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "er2": {"start": 109.592, "end": 115.075, "spk": "z", "text": "タイムアウトエラー！ 10秒以内に、待ち受けのポートが開かなかった、って言われたのだ。", "say": "タイムアウトエラー！ じゅうびょう以内に、待ち受けのポートが、開かなかったって、言われたのだ。", "scene": "error", "p": {"speaker": 3, "speed": 1.38, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "er3": {"start": 115.475, "end": 125.597, "spk": "i", "text": "報告によると、SeleniumBasic は GetTcpTable で待ち受け中かを確かめていて、確かめられないまま10秒たつと、このエラーですの。", "say": "報告によると、セレニウムベーシックは、ゲットティーシーピーテーブルで、待ち受け中かを確かめていて、確かめられないまま、じゅうびょうたつと、このエラーですの。", "scene": "error", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "er5": {"start": 125.997, "end": 129.304, "spk": "z", "text": "じゃあ、WebDriver が起動に失敗したのだ？", "say": "じゃあ、ウェブドライバーが、起動に失敗したのだ？", "scene": "error", "p": {"speaker": 3, "speed": 1.38, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "er6": {"start": 129.704, "end": 137.459, "spk": "i", "text": "いいえ。/status に HTTP でアクセスすると、200 と、\"ready\": true が返ってきましたの。", "say": "いいえ。スラッシュステータスに、エイチティーティーピーでアクセスすると、にひゃくと、レディ、トゥルーが、返ってきましたの。", "scene": "error", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "er7": {"start": 137.859, "end": 139.395, "spk": "z", "text": "ちゃんと起きてるのだ！？", "say": "ちゃんと、起きてるのだ！？", "scene": "error", "p": {"speaker": 7, "speed": 1.38, "pitch": 0.0, "intonation": 1.12}, "style": "ツンツン"}, "er8": {"start": 140.095, "end": 145.161, "spk": "i", "text": "失敗していたのは、起動ではなく、「起動したかどうかの判定」のほうですわ。", "say": "失敗していたのは、起動ではなく、起動したかどうかの、判定のほうですわ。", "scene": "error", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "tb1": {"start": 149.561, "end": 154.319, "spk": "i", "text": "プログラム同士は、ポートという、番号つきの窓口で話しますの。", "say": "プログラム同士は、ポートという、番号つきの、窓口で話しますの。", "scene": "table", "p": {"speaker": 109, "speed": 1.34, "pitch": 0.0, "intonation": 1.05}, "style": "ノーマル"}, "tb2": {"start": 154.719, "end": 158.495, "spk": "z", "text": "Windows という団地の、窓のひとつひとつが、ポートなのだ。", "say": "ウィンドウズという団地の、窓の、ひとつひとつが、ポートなのだ。", "scene": "table", "p": {"speaker": 3, "speed": 1.38, "pitch": 0.0, "intonation": 1.12}, "style": "ノーマル"}, "tb3": {"start": 158.895, "end": 165.295, "spk": "i", "text": "窓を開けて、相手からの接続を待っている状態。それが、待ち受け中、LISTEN ですわ。", "say": "窓を開けて、相手からの接続を、待っている状 const SRC_BAS = ["Option Explicit", "", "' ============================================================", "' GetTcpTable 時系列検証PoC", "'", "' 対象:", "'   msedgedriver.exe --port=9515", "'", "' 実行:", "'   Probe_EdgeDriver9515", "'", "' 出力先:", "'   VBE Immediate Window", "' ============================================================", "", "#If VBA7 Then", "", "Private Declare PtrSafe Function GetTcpTable Lib \"iphlpapi.dll\" ( _", "    ByVal pTcpTable As LongPtr, _", "    ByRef pdwSize As Long, _", "    ByVal bOrder As Long) As Long", "", "Private Declare PtrSafe Sub RtlMoveMemory Lib \"kernel32\" _", "    Alias \"RtlMoveMemory\" ( _", "    ByRef Destination As Any, _", "    ByVal Source As LongPtr, _", "    ByVal Length As LongPtr)", "", "Private Declare PtrSafe Sub Sleep Lib \"kernel32\" ( _", "    ByVal dwMilliseconds As Long)", "", "#Else", "", "Private Declare Function GetTcpTable Lib \"iphlpapi.dll\" ( _", "    ByVal pTcpTable As Long, _", "    ByRef pdwSize As Long, _", "    ByVal bOrder As Long) As Long", "", "Private Declare Sub RtlMoveMemory Lib \"kernel32\" _", "    Alias \"RtlMoveMemory\" ( _", "    ByRef Destination As Any, _", "    ByVal Source As Long, _", "    ByVal Length As Long)", "", "Private Declare Sub Sleep Lib \"kernel32\" ( _", "    ByVal dwMilliseconds As Long)", "", "#End If", "", "", "' ============================================================", "' Win32エラー", "' ============================================================", "", "Private Const NO_ERROR As Long = 0", "Private Const ERROR_INSUFFICIENT_BUFFER As Long = 122", "", "", "' ============================================================", "' MIB_TCP_STATE", "' ============================================================", "", "Private Const MIB_TCP_STATE_CLOSED As Long = 1", "Private Const MIB_TCP_STATE_LISTEN As Long = 2", "Private Const MIB_TCP_STATE_SYN_SENT As Long = 3", "Private Const MIB_TCP_STATE_SYN_RCVD As Long = 4", "Private Const MIB_TCP_STATE_ESTAB As Long = 5", "Private Const MIB_TCP_STATE_FIN_WAIT1 As Long = 6", "Private Const MIB_TCP_STATE_FIN_WAIT2 As Long = 7", "Private Const MIB_TCP_STATE_CLOSE_WAIT As Long = 8", "Private Const MIB_TCP_STATE_CLOSING As Long = 9", "Private Const MIB_TCP_STATE_LAST_ACK As Long = 10", "Private Const MIB_TCP_STATE_TIME_WAIT As Long = 11", "Private Const MIB_TCP_STATE_DELETE_TCB As Long = 12", "", "", "' ============================================================", "' Windows SDK:", "' MIB_TCPROW", "'", "' DWORD × 5 = 20 bytes", "' ============================================================", "", "Private Type MIB_TCPROW", "    dwState As Long", "    dwLocalAddr As Long", "    dwLocalPort As Long", "    dwRemoteAddr As Long", "    dwRemotePort As Long", "End Type", "", "", "' ============================================================", "' メイン", "' ============================================================", "", "Public Sub Probe_EdgeDriver9515()", "", "    Const TARGET_PORT As Long = 9515", "    Const SAMPLE_COUNT As Long = 10", "    Const INTERVAL_MS As Long = 400", "", "    Debug.Print", "    Debug.Print String$(110, \"=\")", "    Debug.Print \"GetTcpTable / msedgedriver検証\"", "    Debug.Print \"開始日時 : \" & Format$(Now, \"yyyy/mm/dd hh:nn:ss\")", "    Debug.Print \"対象      : 127.0.0.1:\" & TARGET_PORT", "    Debug.Print String$(110, \"=\")", "", "    ' --------------------------------------------------------", "    ' Phase 1", "    '", "    ' HTTPアクセス前", "    ' --------------------------------------------------------", "", "    PrintPhaseHeader _", "        \"Phase 1: HTTPアクセス前\", _", "        SAMPLE_COUNT, _", "        INTERVAL_MS", "", "    PollTcpPort _", "        TARGET_PORT, _", "        SAMPLE_COUNT, _", "        INTERVAL_MS, _", "        \"BEFORE\"", "", "", "    ' --------------------------------------------------------", "    ' Phase 2", "    '", "    ' WebDriver /statusへHTTPアクセス", "    ' --------------------------------------------------------", "", "    Debug.Print", "    Debug.Print String$(110, \"-\")", "    Debug.Print \"Phase 2: HTTP GET /status\"", "    Debug.Print String$(110, \"-\")", "", "    TestWebDriverStatus TARGET_PORT", "", "", "    ' --------------------------------------------------------", "    ' Phase 3", "    '", "    ' HTTPアクセス後", "    ' --------------------------------------------------------", "", "    PrintPhaseHeader _", "        \"Phase 3: HTTPアクセス後\", _", "        SAMPLE_COUNT, _", "        INTERVAL_MS", "", "    PollTcpPort _", "        TARGET_PORT, _", "        SAMPLE_COUNT, _", "        INTERVAL_MS, _", "        \"AFTER\"", "", "", "    ' --------------------------------------------------------", "    ' Phase 4", "    '", "    ' HTTPアクセスとGetTcpTableを交互に実行", "    ' --------------------------------------------------------", "", "    PrintPhaseHeader _", "        \"Phase 4: HTTPアクセス直後に毎回観測\", _", "        SAMPLE_COUNT, _", "        INTERVAL_MS", "", "    PollTcpPortWithHttp _", "        TARGET_PORT, _", "        SAMPLE_COUNT, _", "        INTERVAL_MS", "", "", "    Debug.Print", "    Debug.Print String$(110, \"=\")", "    Debug.Print \"検証終了 : \" & Format$(Now, \"yyyy/mm/dd hh:nn:ss\")", "    Debug.Print String$(110, \"=\")", "", "End Sub", "", "", "' ============================================================", "' 指定間隔でGetTcpTableを繰り返す", "' ============================================================", "", "Private Sub PollTcpPort( _", "    ByVal targetPort As Long, _", "    ByVal sampleCount As Long, _", "    ByVal intervalMs As Long, _", "    ByVal label As String)", "", "    Dim i As Long", "", "    For i = 1 To sampleCount", "", "        PrintTcpRowsForPort _", "            targetPort, _", "            label & \"-\" & Format$(i, \"00\")", "", "        If i < sampleCount Then", "            Sleep intervalMs", "        End If", "", "        DoEvents", "", "    Next i", "", "End Sub", "", "", "' ============================================================", "' HTTPとGetTcpTableを交互に実行", "' ============================================================", "", "Private Sub PollTcpPortWithHttp( _", "    ByVal targetPort As Long, _", "    ByVal sampleCount As Long, _", "    ByVal intervalMs As Long)", "", "    Dim i As Long", "    Dim httpResult As String", "", "    For i = 1 To sampleCount", "", "        httpResult = RequestWebDriverStatus(targetPort)", "", "        Debug.Print _", "            TimeStampText() & _", "            \" HTTP-\" & Format$(i, \"00\") & _", "            \"  \" & httpResult", "", "        PrintTcpRowsForPort _", "            targetPort, _", "            \"HTTP-\" & Format$(i, \"00\")", "", "        If i < sampleCount Then", "            Sleep intervalMs", "        End If", "", "        DoEvents", "", "    Next i", "", "End Sub", "", "", "' ============================================================", "' 指定ポートに関係する全行を出力", "'", "' ローカルポートまたはリモートポートが対象なら表示する。", "'", "' これにより、", "'", "'   LISTEN行", "'   ESTABLISHED行", "'   TIME_WAIT行", "'", "' をまとめて確認できる。", "' ============================================================", "", "Private Sub PrintTcpRowsForPort( _", "    ByVal targetPort As Long, _", "    ByVal sampleLabel As String)", "", "    Dim buffer() As Byte", "    Dim bufferSize As Long", "    Dim ret As Long", "", "    Dim entryCount As Long", "    Dim row As MIB_TCPROW", "", "    Dim i As Long", "    Dim rowOffset As Long", "", "    Dim localPort As Long", "    Dim remotePort As Long", "", "    Dim matchCount As Long", "    Dim stateZeroCount As Long", "    Dim listenCount As Long", "    Dim establishedCount As Long", "", "    ret = ReadTcpTable(buffer, bufferSize)", "", "    If ret <> NO_ERROR Then", "", "        Debug.Print _", "            TimeStampText() & _", "            \" \" & PadRight(sampleLabel, 10) & _", "            \" GetTcpTable ERROR=\" & ret", "", "        Exit Sub", "", "    End If", "", "", "    RtlMoveMemory _", "        entryCount, _", "        VarPtr(buffer(0)), _", "        4", "", "    rowOffset = 4", "", "", "    For i = 0 To entryCount - 1", "", "        ' バッファ境界防止", "        If rowOffset + LenB(row) > bufferSize Then Exit For", "", "        RtlMoveMemory _", "            row, _", "            VarPtr(buffer(0)) + rowOffset, _", "            LenB(row)", "", "        localPort = NetworkPortToHost(row.dwLocalPort)", "        remotePort = NetworkPortToHost(row.dwRemotePort)", "", "        If localPort = targetPort _", "        Or remotePort = targetPort Then", "", "            matchCount = matchCount + 1", "", "            Select Case row.dwState", "", "                Case 0", "                    stateZeroCount = stateZeroCount + 1", "", "                Case MIB_TCP_STATE_LISTEN", "                    listenCount = listenCount + 1", "", "                Case MIB_TCP_STATE_ESTAB", "                    establishedCount = establishedCount + 1", "", "            End Select", "", "", "            Debug.Print _", "                TimeStampText() & _", "                \" \" & PadRight(sampleLabel, 10) & _", "                \" ROW#\" & Format$(matchCount, \"00\") & _", "                \" State=\" & PadRight(TcpStateName(row.dwState), 13) & _", "                \" Raw=\" & PadLeft(CStr(row.dwState), 3) & _", "                \" Local=\" & PadRight( _", "                    IPv4ToString(row.dwLocalAddr) & \":\" & _", "                    CStr(localPort), 23) & _", "                \" Remote=\" & _", "                    IPv4ToString(row.dwRemoteAddr) & \":\" & _", "                    CStr(remotePort)", "", "        End If", "", "        rowOffset = rowOffset + LenB(row)", "", "    Next i", "", "", "    ' --------------------------------------------------------", "    ' 集計", "    ' --------------------------------------------------------", "", "    If matchCount = 0 Then", "", "        Debug.Print _", "            TimeStampText() & _", "            \" \" & PadRight(sampleLabel, 10) & _", "            \" NO ROW for port \" & targetPort", "", "    Else", "", "        Debug.Print _", "            TimeStampText() & _", "            \" \" & PadRight(sampleLabel, 10) & _", "            \" SUMMARY\" & _", "            \" Rows=\" & matchCount & _", "            \" State0=\" & stateZeroCount & _", "            \" Listen=\" & listenCount & _", "            \" Established=\" & establishedCount", "", "    End If", "", "End Sub", "", "", "' ============================================================", "' TCPテーブルを取得", "'", "' 1回目と2回目の間でテーブルサイズが増える可能性があるため、", "' ERROR_INSUFFICIENT_BUFFERなら再確保する。", "' ============================================================", "", "Private Function ReadTcpTable( _", "    ByRef buffer() As Byte, _", "    ByRef returnedSize As Long) As Long", "", "    Const MAX_RETRY As Long = 5", "", "    Dim requiredSize As Long", "    Dim ret As Long", "    Dim retry As Long", "", "    requiredSize = 0", "", "    ret = GetTcpTable(0, requiredSize, 1)", "", "    If ret <> ERROR_INSUFFICIENT_BUFFER Then", "", "        ReadTcpTable = ret", "        Exit Function", "", "    End If", "", "", "    For retry = 1 To MAX_RETRY", "", "        If requiredSize <= 0 Then", "            ReadTcpTable = -1", "            Exit Function", "        End If", "", "        ReDim buffer(0 To requiredSize - 1)", "", "        returnedSize = requiredSize", "", "        ret = GetTcpTable( _", "            VarPtr(buffer(0)), _", "            returnedSize, _", "            1)", "", "        If ret = NO_ERROR Then", "", "            ReadTcpTable = NO_ERROR", "            Exit Function", "", "        End If", "", "", "        If ret <> ERROR_INSUFFICIENT_BUFFER Then", "", "            ReadTcpTable = ret", "            Exit Function", "", "        End If", "", "        ' returnedSizeには、新しく必要になったサイズが入る", "        requiredSize = returnedSize", "", "    Next retry", "", "    ReadTcpTable = ERROR_INSUFFICIENT_BUFFER", "", "End Function", "", "", "' ============================================================", "' HTTP /statusテスト", "' ============================================================", "", "Private Sub TestWebDriverStatus(ByVal targetPort As Long)", "", "    Dim result As String", "", "    result = RequestWebDriverStatus(targetPort)", "", "    Debug.Print TimeStampText() & \" \" & result", "", "End Sub", "", "", "' ============================================================", "' WebDriver /statusへHTTP GET", "'", "' WinHTTPを使う。", "' XMLHTTPの接続再利用・キャッシュなどの影響を減らすため、", "' 毎回新しいWinHttpRequestを生成する。", "' ============================================================", "", "Private Function RequestWebDriverStatus( _", "    ByVal targetPort As Long) As String", "", "    On Error GoTo HttpError", "", "    Dim http As Object", "    Dim url As String", "", "    url = \"http://127.0.0.1:\" & _", "          CStr(targetPort) & _", "          \"/status?probe=\" & _", "          Format$(Timer * 1000, \"0\")", "", "    Set http = CreateObject(\"WinHttp.WinHttpRequest.5.1\")", "", "    ' Resolve, Connect, Send, Receive", "    http.SetTimeouts 1000, 1000, 1000, 2000", "", "    http.Open \"GET\", url, False", "", "    ' 接続再利用をできるだけ避ける", "    http.SetRequestHeader \"Connection\", \"close\"", "    http.SetRequestHeader \"Cache-Control\", \"no-cache\"", "", "    http.Send", "", "    RequestWebDriverStatus = _", "        \"HTTP=\" & http.Status & _", "        \" ready=\" & JsonReadyValue(CStr(http.ResponseText)) & _", "        \" bytes=\" & LenB(http.ResponseBody)", "", "    Set http = Nothing", "", "    Exit Function", "", "", "HttpError:", "", "    RequestWebDriverStatus = _", "        \"HTTP ERROR \" & Err.Number & _", "        \": \" & Err.Description", "", "    Err.Clear", "    Set http = Nothing", "", "End Function", "", "", "' ============================================================", "' responseTextから ready の値だけ簡易抽出", "'", "' JSONパーサーは使用しないPoC用。", "' ============================================================", "", "Private Function JsonReadyValue( _", "    ByVal responseText As String) As String", "", "    Dim normalized As String", "", "    normalized = LCase$(Replace$(responseText, \" \", vbNullString))", "", "    If InStr(1, normalized, \"\"\"ready\"\":true\", vbTextCompare) > 0 Then", "", "        JsonReadyValue = \"true\"", "", "    ElseIf InStr(1, normalized, \"\"\"ready\"\":false\", vbTextCompare) > 0 Then", "", "        JsonReadyValue = \"false\"", "", "    Else", "", "        JsonReadyValue = \"unknown\"", "", "    End If", "", "End Function", "", "", "' ============================================================", "' TCP state名", "' ============================================================", "", "Private Function TcpStateName( _", "    ByVal state As Long) As String", "", "    Select Case state", "", "        Case 0", "            TcpStateName = \"ZERO/INVALID\"", "", "        Case MIB_TCP_STATE_CLOSED", "            TcpStateName = \"CLOSED\"", "", "        Case MIB_TCP_STATE_LISTEN", "            TcpStateName = \"LISTEN\"", "", "        Case MIB_TCP_STATE_SYN_SENT", "            TcpStateName = \"SYN_SENT\"", "", "        Case MIB_TCP_STATE_SYN_RCVD", "            TcpStateName = \"SYN_RCVD\"", "", "        Case MIB_TCP_STATE_ESTAB", "            TcpStateName = \"ESTABLISHED\"", "", "        Case MIB_TCP_STATE_FIN_WAIT1", "            TcpStateName = \"FIN_WAIT1\"", "", "        Case MIB_TCP_STATE_FIN_WAIT2", "            TcpStateName = \"FIN_WAIT2\"", "", "        Case MIB_TCP_STATE_CLOSE_WAIT", "            TcpStateName = \"CLOSE_WAIT\"", "", "        Case MIB_TCP_STATE_CLOSING", "            TcpStateName = \"CLOSING\"", "", "        Case MIB_TCP_STATE_LAST_ACK", "            TcpStateName = \"LAST_ACK\"", "", "        Case MIB_TCP_STATE_TIME_WAIT", "            TcpStateName = \"TIME_WAIT\"", "", "        Case MIB_TCP_STATE_DELETE_TCB", "            TcpStateName = \"DELETE_TCB\"", "", "        Case Else", "            TcpStateName = \"UNKNOWN\"", "", "    End Select", "", "End Function", "", "", "' ============================================================", "' TCPポート", "'", "' dwLocalPort / dwRemotePortはDWORDだが、", "' ポート番号はnetwork byte orderで下位16bitに格納される。", "' ============================================================", "", "Private Function NetworkPortToHost( _", "    ByVal networkPort As Long) As Long", "", "    Dim firstByte As Long", "    Dim secondByte As Long", "", "    firstByte = networkPort And &HFF&", "    secondByte = (networkPort \\ &H100&) And &HFF&", "", "    NetworkPortToHost = _", "        firstByte * &H100& + secondByte", "", "End Function", "", "", "' ============================================================", "' IPv4 DWORDを文字列化", "'", "' 4バイトとして取り出すことで、", "' Longの符号による除算問題を避ける。", "' ============================================================", "", "Private Function IPv4ToString( _", "    ByVal address As Long) As String", "", "    Dim octets(0 To 3) As Byte", "", "    RtlMoveMemory _", "        octets(0), _", "        VarPtr(address), _", "        4", "", "    IPv4ToString = _", "        CStr(octets(0)) & \".\" & _", "        CStr(octets(1)) & \".\" & _", "        CStr(octets(2)) & \".\" & _", "        CStr(octets(3))", "", "End Function", "", "", "' ============================================================", "' 時刻", "' ============================================================", "", "Private Function TimeStampText() As String", "", "    TimeStampText = _", "        Format$(Now, \"hh:nn:ss\") & \".\" & _", "        Format$(CLng((Timer - Fix(Timer)) * 1000), \"000\")", "", "End Function", "", "", "' ============================================================", "' 表示補助", "' ============================================================", "", "Private Function PadRight( _", "    ByVal value As String, _", "    ByVal targetLength As Long) As String", "", "    If Len(value) >= targetLength Then", "", "        PadRight = Left$(value, targetLength)", "", "    Else", "", "        PadRight = value & _", "                   Space$(targetLength - Len(value))", "", "    End If", "", "End Function", "", "", "Private Function PadLeft( _", "    ByVal value As String, _", "    ByVal targetLength As Long) As String", "", "    If Len(value) >= targetLength Then", "", "        PadLeft = Right$(value, targetLength)", "", "    Else", "", "        PadLeft = Space$(targetLength - Len(value)) & _", "                  value", "", "    End If", "", "End Function", "", "", "Private Sub PrintPhaseHeader( _", "    ByVal phaseName As String, _", "    ByVal sampleCount As Long, _", "    ByVal intervalMs As Long)", "", "    Debug.Print", "    Debug.Print String$(110, \"-\")", "    Debug.Print phaseName", "    Debug.Print _", "        \"観測回数=\" & sampleCount & _", "        \", 間隔=\" & intervalMs & \"ms\"", "    Debug.Print String$(110, \"-\")", "", "End Sub"];

// 光のぼかし（shadowBlur）は座標の倍率がかからないので、ここで SC 倍する
{
  const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'shadowBlur');
  Object.defineProperty(ctx, 'shadowBlur', { get() { return d.get.call(this) / SC; }, set(v) { d.set.call(this, v * SC); } });
}

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const PT = (t, t0, d) => d <= 0 ? (t >= t0 ? 1 : 0) : clamp((t - t0) / d);
const E = {
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  sine: p => .5 - .5 * Math.cos(Math.PI * p),
};
// 同じ番号なら同じ値を返す乱数（フレームごとに揺れないように）
const hr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hexA = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};
function mixHex(a, b, k) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const m = s => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, clamp(k)));
  return '#' + ((m(16) << 16) | (m(8) << 8) | m(0)).toString(16).padStart(6, '0');
}

// 時刻表（timeline.py の tld.json）
const L = id => { const l = TLD.lines[id]; if (!l) throw new Error('no line ' + id); return l; };
const S = id => TLD.scenes[id];
const F = (id, f) => { const l = L(id); return l.start + (l.end - l.start) * f; };
// 時刻 a から b まで見せる不透明度（入りと抜けはフェード）
const span = (t, a, b, fi = .45, fo = .45) => PT(t, a, fi) * (1 - PT(t, b - fo, fo));
// 行 a の始まりから、行 b の始まりまで見せる（b を省くとシーンの終わりまで）
const beat = (t, a, b, fi = .45, fo = .45) => {
  const t0 = L(a).start - .2;
  const t1 = b ? L(b).start - .1 : S(L(a).scene).end - .3;
  return span(t, t0, t1, fi, fo);
};

// ---------- 文字 ----------
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = o.font || `700 44px ${JP}`;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.rot) { ctx.translate(x, y); ctx.rotate(o.rot); x = 0; y = 0; }
  if (o.stroke) { ctx.lineWidth = o.sw || 6; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 22; }
  ctx.fillStyle = o.color || C.wht;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function tw(s, font, ls = 0) { ctx.save(); ctx.font = font; if (ls) ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w - (ls ? ls : 0); }
// 幅に収まるよう文字の大きさを下げる（font の "NNpx" を置き換える）
function fitFont(s, font, maxW, min = 14) {
  let fs = +font.match(/(\d+)px/)[1];
  while (fs > min && tw(s, font.replace(/\d+px/, fs + 'px')) > maxW) fs--;
  return font.replace(/\d+px/, fs + 'px');
}
// 決まった幅で折り返す（日本語は1文字ずつ、英単語は切らない）
function wrap(s, font, maxW) {
  const rows = []; let cur = '';
  const toks = s.match(/[A-Za-z0-9_.@:/#\-]+|\s+|./gu) || [];
  for (const k of toks) {
    if (k === '\n') { rows.push(cur); cur = ''; continue; }
    if (tw(cur + k, font) > maxW && cur) { rows.push(cur.trimEnd()); cur = k.trimStart(); } else cur += k;
  }
  if (cur) rows.push(cur);
  return rows;
}

function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function line(x1, y1, x2, y2, col, w = 2, a = 1, dash) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
// 矢印（p まで伸びる）
function arrow(x1, y1, x2, y2, col, p = 1, o = {}) {
  if (p <= 0) return;
  const x = lerp(x1, x2, p), y = lerp(y1, y2, p), a = Math.atan2(y2 - y1, x2 - x1), hs = o.hs || 16, w = o.w || 4;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (o.glow) { ctx.shadowColor = col; ctx.shadowBlur = o.glow; }
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x - Math.cos(a) * hs * .7, y - Math.sin(a) * hs * .7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - Math.cos(a - .5) * hs, y - Math.sin(a - .5) * hs); ctx.lineTo(x - Math.cos(a + .5) * hs, y - Math.sin(a + .5) * hs); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function flash(color, a) {
  if (a <= 0) return;
  ctx.save(); ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.globalAlpha = clamp(a); ctx.fillStyle = color; ctx.fillRect(-50, -50, W + 100, H + 100); ctx.restore();
}
// 中心 (cx, cy) から k 倍に拡大して描く（ポップの演出）
function popAt(cx, cy, p, fn, o = {}) {
  if (p <= 0) return;
  const k = o.k ?? lerp(o.from ?? .8, 1, E.back(clamp(p)));
  ctx.save(); ctx.globalAlpha *= clamp(p * 2.2);
  ctx.translate(cx, cy); ctx.scale(k, k); if (o.rot) ctx.rotate(o.rot * (1 - E.out(clamp(p)))); ctx.translate(-cx, -cy);
  fn(); ctx.restore();
}

const STARS = Array.from({ length: 140 }, (_, i) => [hr(i) * W, hr(i + 500) * 560, .6 + hr(i + 900) * 1.8, hr(i + 1300) * 6.28]);
function nightSky(t, o = {}) {
  const dawn = o.dawn ?? 0;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mixHex(C.sky0, '#2a3a6e', dawn));
  g.addColorStop(.55, mixHex(C.sky1, '#6d6aa8', dawn));
  g.addColorStop(1, mixHex(C.sky2, '#f2a78a', dawn));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save();
  for (const [x, y, r, ph] of STARS) {
    ctx.globalAlpha = (.35 + .65 * (.5 + .5 * Math.sin(t * 1.3 + ph))) * (1 - dawn * .85);
    ctx.fillStyle = '#e9ecff'; ctx.fillRect(x, y, r, r);
  }
  ctx.restore();
  // 月（細い三日月）
  const mx = 1822, my = 92;
  ctx.save(); ctx.globalAlpha = 1 - dawn * .6;
  ctx.shadowColor = 'rgba(246,240,214,.6)'; ctx.shadowBlur = 40;
  ctx.fillStyle = C.moon; ctx.beginPath(); ctx.arc(mx, my, 38, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = mixHex(C.sky0, '#2a3a6e', dawn); ctx.beginPath(); ctx.arc(mx + 17, my - 10, 35, 0, 7); ctx.fill();
  ctx.restore();
}

const FAR = Array.from({ length: 60 }, (_, i) => [i * 110 + hr(i) * 40, 80 + hr(i + 40) * 170, 60 + hr(i + 80) * 70]);
function cityFar(camX) {
  ctx.save(); ctx.fillStyle = '#151a3a';
  const ox = -((camX * .25) % 6600);
  for (const [x0, h, w] of FAR) for (const k of [0, 6600]) {
    const x = x0 + ox + k;
    if (x < -150 || x > W + 150) continue;
    ctx.fillRect(x, 840 - h - 120, w, h + 120);
  }
  ctx.restore();
}

function triBrackets(x, y, from, count, dx, p, col = C.itako) {

    const q = PT(p, g * .12, .3);
    if (q <= 0) continue;
    const i0 = from + g * 3, i1 = Math.min(from + count, i0 + 3) - 1;

    const f = filt(type, f0, q, gn); f.frequency.setValueAtTime(f0, T(t)); f.frequency.exponentialRampToValueAtTime(f1, T(t) + d);

      case 'notify': beep(t, 1320, .12, .05); beep(t + .14, 1760, .18, .05); break;

      case 'wall': thunk(t, .3, 55); hiss(t, .4, .03, 600, 200, 'lowpass'); break;
      case 'drop': sweep(t, 900, 200, .35, .04, 'triangle'); thunk(t + .33, .12, 110); break;
      case 'roulette': for (let k = 0; k < 8; k++) wood(t - .45 + k * .055, .04, 2200); cel(t, 86, .06, { d: 1 }); break;
      case 'flat': { const gn = g(sfx, 0); env(gn, T(t), .02, .05, .7); const f = filt('lowpass', 900, 2, gn); const o1 = osc('sawtooth', 330, T(t), .75, f); o1.frequency.setValueAtTime(330, T(t)); o1.frequency.exponentialRampToValueAtTime(165, T(t) + .7); break; }
      case 'crack': hiss(t, .18, .08, 6000, 2000, 'highpass', .8); for (let k = 0; k < 6; k++) cel(t + rnd() * .2, 96 + Math.floor(rnd() * 12), .025, { d: .5 }); thunk(t, .18, 80); break;
      case 'stamp': thunk(t, .3, 90); fx(t + .02, 'paper', {}); break;
      case 'flame': hiss(t, 1.4, .06, 200, 1500, 'lowpass', 1); for (let k = 0; k < 10; k++) beep(t + .2 + rnd() * 1.1, 3000 + rnd() * 2000, .01, .02); break;
    }
  }

  const run = (limit, skip = -Infinity) => {
    for (const e of EV) if (!e.done && e[0] < limit) { e.done = true; if (e[0] >= skip) e[1](); }
  };
  return { run, EV };
}

// bgm.mp3 用の書き出し（mode = 'music'）
window.renderAudio = async function (mode = 'music') {
  const dur = TLD.duration + 2;
  const ac = new OfflineAudioContext(2, Math.ceil(dur * SR), SR);
  const { run } = buildScore(ac, ac.destination, mode);
  const WIN = 4;
  run(WIN + .5);
  for (let w = WIN; w < dur; w += WIN) ac.suspend(w).then(() => { run(w + WIN + .5); ac.resume(); });
  const buf = await ac.startRendering();
  const L0 = buf.getChannelData(0), R0 = buf.getChannelData(1);
  const pcm = new Int16Array(L0.length * 2);
  for (let i = 0; i < L0.length; i++) {
    pcm[i * 2] = Math.max(-1, Math.min(1, L0[i])) * 32767;
    pcm[i * 2 + 1] = Math.max(-1, Math.min(1, R0[i])) * 32767;
  }
  window.__PCM = new Uint8Array(pcm.buffer);
  return { sampleRate: SR, bytes: window.__PCM.length };
};

// HTML 版の効果音: 再生位置 from から、ムービーの 0 秒 = ac の base 秒として、少し先の分ずつ鳴らす
window.liveSE = function (ac, dest) {
  let timer = 0, out = null;
  return {
    start(from, base) {
      this.stop();
      out = ac.createGain(); out.connect(dest);
      const sc = buildScore(ac, out, 'se', base);
      const step = () => sc.run(ac.currentTime - base + 1.5, from - .05);
      step(); timer = setInterval(step, 100);
    },
    stop() {
      clearInterval(timer);
      if (!out) return;
      const o = out, now = ac.currentTime;
      o.gain.setValueAtTime(o.gain.value, now); o.gain.linearRampToValueAtTime(0, now + .05);
      setTimeout(() => o.disconnect(), 300);
      out = null;
    },
  };
};

window.audioChunk = function (i, size) {
  const sub = window.__PCM.subarray(i * size, (i + 1) * size);
  let s = '';
  for (let k = 0; k < sub.length; k += 0x8000) s += String.fromCharCode.apply(null, sub.subarray(k, k + 0x8000));
  return btoa(s);
};

function fit() {

  const vw = document.documentElement.clientWidth || innerWidth, vh = document.documentElement.clientHeight || innerHeight;
