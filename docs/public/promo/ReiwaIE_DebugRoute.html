<script>window.TL={"fps": 30, "duration": 508.784, "scenes": {"open": {"start": 0.0, "first": 2.6, "end": 26.623}, "begin": {"start": 26.623, "first": 29.023, "end": 133.597}, "pipe": {"start": 133.597, "first": 135.997, "end": 200.803}, "port": {"start": 200.803, "first": 203.203, "end": 296.351}, "wv2": {"start": 296.351, "first": 298.751, "end": 377.915}, "finale": {"start": 377.915, "first": 380.115, "end": 499.184}, "end": {"start": 499.184, "first": 499.784, "end": 508.784}}, "lines": {"o1": {"start": 2.6, "end": 7.656, "text": "外部ドライバなし。管理者権限なし。DLLの登録もなし。", "scene": "open"}, "o2": {"start": 8.156, "end": 12.092, "text": "Excel VBA だけで、Edge を操るのだ。", "scene": "open"}, "o3": {"start": 12.692, "end": 15.199, "text": "その名も――令和のIE。", "scene": "open"}, "o4": {"start": 16.599, "end": 21.964, "text": "ブラウザへ続く道は3つ。パイプ、ポート、そして WebView2。", "scene": "open"}, "o5": {"start": 22.264, "end": 25.123, "text": "今日はその裏側を、ぜんぶ見せるのだ。", "scene": "open"}, "b1": {"start": 29.023, "end": 33.876, "text": "ルート0。すべての始まり、ブラウザの探し方なのだ。", "scene": "begin"}, "b2": {"start": 34.476, "end": 42.689, "text": "対応しているのは Chrome と Edge。それぞれ Stable、Beta、Dev、Canary の4つなのだ。", "scene": "begin"}, "b3": {"start": 42.989, "end": 51.245, "text": "置き場所には、決まった型がある。メーカー名、ブラウザ名と開発レベル、Application、そして実行ファイル。", "scene": "begin"}, "b4": {"start": 51.545, "end": 60.761, "text": "Stable には名前が付かない。Canary だけは SxS。通常版と並べて入れられる、サイド・バイ・サイドの印なのだ。", "scene": "begin"}, "b5": {"start": 61.261, "end": 70.84, "text": "親フォルダは、入れたときの権限で2つに分かれる。マシン単位なら Program Files、ユーザー単位なら LOCALAPPDATA。", "scene": "begin"}, "b6": {"start": 71.14, "end": 81.412, "text": "Canary は、いつでもユーザー単位。2020年6月からは、新しく入れた64bit版の Chrome が Program Files に入るのだ。", "scene": "begin"}, "b7": {"start": 81.912, "end": 88.792, "text": "Puppeteer も Playwright も、レジストリまでは追わない。決まった場所を、順番に当たるだけなのだ。", "scene": "begin"}, "b8": {"start": 89.392, "end": 99.077, "text": "では WebView2 は？ 最近の Office に最初から入っている、WebView2Loader.dll に任せているのだ。", "scene": "begin"}, "b9": {"start": 99.377, "end": 109.607, "text": "EXCEL.EXE と同じフォルダにあるから、パスを書かなくても見つかる。Windows の DLL の探し方のおかげなのだ。", "scene": "begin"}, "b10": {"start": 110.107, "end": 118.693, "text": "その奥には、ローダーすら使わない道もある。本当のコアは、EmbeddedBrowserWebView.dll。", "scene": "begin"}, "b11": {"start": 118.993, "end": 126.887, "text": "ただし、呼ぶのは非公開の API。古い Office でも動くかもしれない、というロマンの話なのだ。", "scene": "begin"}, "b12": {"start": 127.487, "end": 132.297, "text": "さあ、ブラウザは見つかった。ここから、道の話に入るのだ。", "scene": "begin"}, "p1": {"start": 135.997, "end": 138.931, "text": "ルート1。パイプなのだ。", "scene": "pipe"}, "p2": {"start": 139.531, "end": 148.8, "text": "WScript.Shell の Exec なら、StdIn・StdOut・StdErr の3本でやり取りできる。", "scene": "pipe"}, "p3": {"start": 149.1, "end": 153.409, "text": "CDPもここを通る……と思ったら、大間違いだったのだ。", "scene": "pipe"}, "p4": {"start": 154.009, "end": 159.353, "text": "Chromium が使うのは、予約のない fd3 と fd4。", "scene": "pipe"}, "p5": {"start": 159.653, "end": 167.44, "text": "fd3 からコマンドを読み、fd4 へ結果を書く。番号はソースに、定数で固定されているのだ。", "scene": "pipe"}, "p6": {"start": 168.04, "end": 174.376, "text": "でも Windows の CreateProcess で渡せるのは、標準入出力の3本だけ。", "scene": "pipe"}, "p7": {"start": 174.676, "end": 180.084, "text": "そこで使うのが、STARTUPINFO の lpReserved2 なのだ。", "scene": "pipe"}, "p8": {"start": 180.384, "end": 190.731, "text": "fdの数、フラグ、ハンドル。隙間なくバイトで詰め込めば、Chromium は fd3 と fd4 として受け取ってくれるのだ。", "scene": "pipe"}, "p9": {"start": 191.331, "end": 195.533, "text": "あとの決まりは、メッセージの終わりにヌル文字を1つ付けるだけ。", "scene": "pipe"}, "p10": {"start": 195.833, "end": 199.503, "text": "この単純なルールが、すべての道の土台になるのだ。", "scene": "pipe"}, "r1": {"start": 203.203, "end": 207.768, "text": "ルート2。ポート、つまり WebSocket なのだ。", "scene": "port"}, "r2": {"start": 208.368, "end": 214.181, "text": "最初は winhttp の WebSocket API に頼ったのだ。", "scene": "port"}, "r3": {"start": 214.481, "end": 217.159, "text": "同期モードでは、Excel がフリーズ。", "scene": "port"}, "r4": {"start": 217.359, "end": 222.884, "text": "非同期モードでは、Excel ごとクラッシュ。どっちに進んでも詰みだったのだ。", "scene": "port"}, "r5": {"start": 223.584, "end": 228.299, "text": "でも、気づいてしまったのだ。WebSocket は特別な管じゃない。", "scene": "port"}, "r6": {"start": 228.599, "end": 232.631, "text": "パイプにネットワークを足した、ただのメッセージのルールなのだ。", "scene": "port"}, "r7": {"start": 233.131, "end": 245.568, "text": "だから WinSock で、一から書いた。DevToolsActivePort でポートを調べ、HTTP で切り替えを頼み、101 が返れば接続成功なのだ。", "scene": "port"}, "r8": {"start": 245.868, "end": 254.081, "text": "届いたフレームは、パイプと同じ受信ストリームへ。最後にヌル文字を足せば、その先はパイプとまったく同じ処理なのだ。", "scene": "port"}, "r9": {"start": 254.881, "end": 264.887, "text": "そして2026年。拡張機能のインストールに必須だった、パイプ経由と専用の引数。その要件が外されたのだ。", "scene": "port"}, "r10": {"start": 265.187, "end": 271.96, "text": "その5日後、Chrome DevTools MCP に、拡張機能を入れるツールが入った。", "scene": "port"}, "r11": {"start": 272.26, "end": 277.455, "text": "マルウェア対策で閉めた扉が、AIのために開いたように見えるのだ。", "scene": "port"}, "r12": {"start": 278.155, "end": 282.517, "text": "普段使いのブラウザにも、確認ダイアログひとつでつながる時代。", "scene": "port"}, "r13": {"start": 282.717, "end": 288.659, "text": "Excel は接続をつなぎっぱなしにできるから、ダイアログは最初の1回だけ。", "scene": "port"}, "r14": {"start": 289.259, "end": 295.051, "text": "……でもそれは、セキュリティの境界が Excel に移る、ということでもあるのだ。", "scene": "port"}, "w1": {"start": 298.751, "end": 301.897, "text": "ルート3。WebView2 なのだ。", "scene": "wv2"}, "w2": {"start": 302.497, "end": 311.201, "text": "Excel に WebView2 を出すには、ずっと外部の部品が必要だった。VBA界隈で長く続いた議論なのだ。", "scene": "wv2"}, "w3": {"start": 311.701, "end": 319.648, "text": "参照設定を使わないから、メソッドを名前で呼べない。だから vtable の番号を、自分で数えるのだ。", "scene": "wv2"}, "w4": {"start": 319.948, "end": 327.276, "text": "36番、42番、99番。1つでも数え間違えたら、Excel ごと落ちるのだ。", "scene": "wv2"}, "w5": {"start": 327.776, "end": 331.659, "text": "結果を受け取るコールバックも、VBAには作れない。", "scene": "wv2"}, "w6": {"start": 331.959, "end": 339.383, "text": "だから実行できるメモリを確保して、COMオブジェクトの形と機械語のサンクを、直接書き込むのだ。", "scene": "wv2"}, "w7": {"start": 339.883, "end": 347.051, "text": "本来は C++ のコンパイラーとライブラリが作るものを、VBAで手作業で組み立てる。", "scene": "wv2"}, "w8": {"start": 347.351, "end": 349.932, "text": "……これ、人間に書けると思うのだ？", "scene": "wv2"}, "w9": {"start": 350.832, "end": 354.363, "text": "この壁を、あっさり越えたのが AI なのだ。", "scene": "wv2"}, "w10": {"start": 354.863, "end": 362.191, "text": "ルールは厳格。そしてネットの海には、先人たちが25年かけて書きためた COMハックが沈んでいる。", "scene": "wv2"}, "w11": {"start": 362.491, "end": 365.403, "text": "AIにとっては、解けるパズルだったのだ。", "scene": "wv2"}, "w12": {"start": 366.203, "end": 369.2, "text": "こうして3つの道は、1つに合流する。", "scene": "wv2"}, "w13": {"start": 369.5, "end": 376.615, "text": "パイプも、ポートも、WebView2も。最後はヌル文字で区切られた、同じメッセージになるのだ。", "scene": "wv2"}, "f1": {"start": 380.115, "end": 387.069, "text": "「なるほど、原理はそういうことか。じゃあ、その原理に基づいてこう組んで」", "scene": "finale"}, "f2": {"start": 387.869, "end": 396.819, "text": "たったこの1文で、Excel に WebView2 が召喚された。外部依存ゼロ。VBAの歴史が、ひとつ動いたのだ。", "scene": "finale"}, "f3": {"start": 397.719, "end": 402.199, "text": "……でも。同じ1文は、別の扉も開けてしまうのだ。", "scene": "finale"}, "g1": {"start": 403.199, "end": 414.153, "text": "2025年。AIエージェントが、公開の Issue に仕込まれた指示にだまされ、非公開リポジトリの中身を漏らしてしまう。そんな実証が出たのだ。", "scene": "finale"}, "f7": {"start": 414.653, "end": 423.005, "text": "AIブラウザも、ページに隠された1文にだまされる。利用者の情報を持ち出せると、示されたのだ。", "scene": "finale"}, "f8": {"start": 423.505, "end": 431.164, "text": "コーディングAIに、犯行の大部分を任せた攻撃者もいた。標的は、少なくとも17の組織。", "scene": "finale"}, "f9": {"start": 431.464, "end": 437.725, "text": "マルウェアが、開発者のパソコンにあるAIツールを悪用した事件もあったのだ。", "scene": "finale"}, "g2": {"start": 438.225, "end": 448.465, "text": "国家の支援を受けたとみられる諜報活動では、戦術的な作業の8割から9割を、AIが自律的にこなしていたのだ。", "scene": "finale"}, "f10": {"start": 448.965, "end": 459.643, "text": "日本でも。17歳の高校生が生成AIを悪用し、約724万件の不正な指令を送って、会員情報を漏えいさせた。", "scene": "finale"}, "f12": {"start": 459.943, "end": 467.175, "text": "IPAの10大脅威にも、AIのリスクが初めて入った。いきなり3位なのだ。", "scene": "finale"}, "f13": {"start": 468.175, "end": 473.444, "text": "AIは、原理にたどり着くまでの距離を、限りなくゼロにしたのだ。", "scene": "finale"}, "f14": {"start": 474.044, "end": 481.82, "text": "ボクたちが通した3つの道も、ブラウザを丸ごと操れる道。便利な道は、そのまま抜け道にもなるのだ。", "scene": "finale"}, "f15": {"start": 482.62, "end": 486.631, "text": "その先にあるのは、革命か。それとも、事件か。", "scene": "finale"}, "f16": {"start": 487.831, "end": 492.833, "text   find: '#34d399', pipe: '#22d3ee', port: '#f59e0b', wv2: '#a855f7', ai: '#fde68a', red: '#ef4444',
  green: '#4ade80', white: '#f8fafc', dim: '#64748b', zunda: '#8bc34a',
};

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  elastic: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -10 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
// インデックスから決まる疑似乱数
const hr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const L = id => TLD.lines[id];
const S = id => TLD.scenes[id];
// 行 id の開始から o 秒後を起点に、d 秒かけて 0→1
const P = (t, id, d = .6, o = 0) => clamp((t - L(id).start - o) / d);
// 行 id の f 割の時刻（言葉が出るタイミングに合わせる用）
const F = (id, f) => { const l = L(id); return l.start + (l.end - l.start) * f; };
const PF = (t, id, f, d = .5) => clamp((t - F(id, f)) / d);
const PT = (t, t0, d) => clamp((t - t0) / d);
// 区間 [a,b] でフェードイン・アウトする不透明度
const win = (t, a, b, fi = .3, fo = .3) => clamp(Math.min((t - a) / fi, (b - t) / fo));

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}

function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = o.font || `700 48px ${FONT}`;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.stroke) {
    ctx.lineWidth = o.sw || 6; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round';
    ctx.strokeText(s, x, y);
  }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 24; }
  if (!o.outline) { ctx.fillStyle = o.color || COL.white; ctx.fillText(s, x, y); }
  if (o.glow && o.double) ctx.fillText(s, x, y);
  ctx.restore();
}

function measure(s, font) { ctx.save(); ctx.font = font; const w = ctx.measureText(s).width; ctx.restore(); return w; }

// 色ずれ＋横スライスのグリッチ文字
function glitchText(s, x, y, o = {}, amt = 1, seed = 0) {
  const k = Math.floor(seed * 24);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const off = 6 * amt;
  txt(s, x - off * (hr(k) - .3), y, { ...o, color: '#ff2a55', glow: null, alpha: (o.alpha ?? 1) * .8 });
  txt(s, x + off * (hr(k + 7) - .3), y + 2 * amt, { ...o, color: '#00e5ff', glow: null, alpha: (o.alpha ?? 1) * .8 });
  ctx.restore();
  txt(s, x, y, o);
  if (amt > .05) {
    for (let i = 0; i < 4; i++) {
      if (hr(k * 13 + i) < .5) continue;
      const sy = y - 80 + hr(k * 31 + i) * 160, sh = 6 + hr(k * 17 + i) * 22;
      const dx = (hr(k * 7 + i) - .5) * 120 * amt;
      ctx.drawImage(cv, 0, sy, W, sh, dx, sy, W, sh);
    }
  }
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function panel(x, y, w, h, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.alpha ?? 1);
  const c = o.color || COL.pipe;
  rr(x, y, w, h, o.r ?? 14);
  ctx.fillStyle = o.fill || 'rgba(8,13,30,0.82)';
  ctx.fill();
  ctx.shadowColor = c; ctx.shadowBlur = o.blur ?? 18;
  ctx.strokeStyle = hexA(c, o.edge ?? .85); ctx.lineWidth = o.lw || 2;
  ctx.stroke();
  ctx.shadowBlur = 0;
  if (o.title) {
    ctx.fillStyle = hexA(c, .16);
    rr(x, y, w, 44, o.r ?? 14); ctx.fill();
    txt(o.title, x + 20, y + 23, { font: `600 22px ${MONO}`, color: c });
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(x + w - 30 - i * 26, y + 22, 7, 0, 7);
      ctx.fillStyle = hexA(c, .35 + i * .15); ctx.fill();
    }
  }
  ctx.restore();
}

// 簡易シンタックスハイライトのコード（p で何文字目までタイプされたか）
const KW = /\b(static|constexpr|int|Dim|As|Long|LongPtr|Byte|Declare|PtrSafe|Function|Lib|Private|Public|Sub|End|Type|typedef|struct|DWORD|WORD|HANDLE|LPBYTE|LPWSTR|GET|HTTP)\b/;
function codeLines(lines, x, y, p, o = {}) {
  const size = o.size || 28, lh = o.lh || size * 1.55;
  const total = lines.reduce((a, l) => a + l.length, 0);
  let left = Math.floor(total * p);
  ctx.save();
  ctx.font = `500 ${size}px ${MONO}`;
  ctx.textBaseline = 'middle';
  let cy = y, cursor = null;
  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    const show = line.slice(0, Math.max(0, left));
    left -= line.length;
    const hl = o.hl && o.hl[li];
    if (hl) {
      ctx.save(); ctx.fillStyle = hexA(hl, .18 * (o.hla ?? 1)); ctx.fillRect(x - 12, cy - lh / 2, o.w || 900, lh);
      ctx.fillStyle = hexA(hl, o.hla ?? 1); ctx.fillRect(x - 12, cy - lh / 2, 5, lh); ctx.restore();
    }
    const dim = o.dim && o.dim[li];
    let cx = x;
    const toks = show.split(/(\s+|[(){}\[\];,=*<>"'.:]|\/\/.*$)/);
    for (const tk of toks) {
      if (!tk) continue;
      let c = o.color || '#cbd5e1';
      if (tk.startsWith('//') || tk.startsWith('\'')) c = '#64748b';
      else if (KW.test(tk)) c = '#c084fc';
      else if (/^[0-9][0-9xA-Fa-f]*$/.test(tk)) c = '#fbbf24';
      else if (/^[A-Z][A-Za-z0-9_]+$/.test(tk)) c = '#7dd3fc';
      ctx.fillStyle = c;
      ctx.globalAlpha = dim ? .3 : 1;
      ctx.fillText(tk, cx, cy);
      cx += ctx.measureText(tk).width;
    }
    ctx.globalAlpha = 1;
    if (show.length < line.length && left + line.length >= 0 && !cursor) cursor = [cx, cy];
    cy += lh;
  }
  if (cursor && p < 1) { ctx.fillStyle = o.cur || COL.pipe; ctx.fillRect(cursor[0] + 2, cursor[1] - size * .5, size * .55, size); }
  ctx.restore();
}

// 光る線（p まで描く）
function beam(pts, color, width, p = 1, o = {}) {
  if (p <= 0) return;
  const segs = [];
  let len = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); len += d; }
  let rem = len * p;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && rem > 0; i++) {
    const f = Math.min(1, rem / segs[i - 1]);
    ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f));
    rem -= segs[i - 1];
  }
  ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.strokeStyle = hexA(color, .35); ctx.lineWidth = width * 3; ctx.shadowColor = color; ctx.shadowBlur = 30; ctx.stroke();
  ctx.shadowBlur = 0; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1, width / 3); ctx.stroke();
  ctx.restore();
}

// 折れ線上の位置（0..1）
function along(pts, f) {
  let len = 0; const segs = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); segs.push(d); len += d; }
  let r = len * clamp(f);
  for (let i = 0; i < segs.length; i++) {
    if (r <= segs[i]) { const k = r / segs[i]; return [lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)]; }
    r -= segs[i];
  }
  return pts[pts.length - 1];
}

function bezierPts(x1, y1, cx1, cy1, cx2, cy2, x2, y2, n = 40) {
  const a = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u;
    a.push([v * v * v * x1 + 3 * v * v * u * cx1 + 3 * v * u * u * cx2 + u * u * u * x2, v * v * v * y1 + 3 * v * v * u * cy1 + 3 * v * u * u * cy2 + u * u * u * y2]);
  }
  return a;
}

// 線の上を流れる光の粒（ラベル付き）
function packets(pts, t, color, o = {}) {
  const n = o.n || 4, speed = o.speed || .5, dir = o.dir || 1;
  ctx.save();
  for (let i = 0; i < n; i++) {
    let f = ((t * speed + i / n) % 1 + 1) % 1;
    if (dir < 0) f = 1 - f;
    const [x, y] = along(pts, f);
    const a = Math.sin(f * Math.PI) * (o.alpha ?? 1);
    ctx.globalAlpha = a;
    ctx.shadowColor = color; ctx.shadowBlur = 25;
    if (o.label) {
      ctx.font = `700 ${o.size || 20}px ${MONO}`;
      const w = ctx.measureText(o.label).width + 20;
      ctx.fillStyle = color; rr(x - w / 2, y - 16, w, 32, 8); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#020617'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(o.label, x, y + 1);
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, o.r || 6, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

// ハンコ（大きく出て縮みながら着地）
function stamp(s, x, y, p, color, o = {}) {
  if (p <= 0) return;
  const k = E.out(clamp(p * 1.6));
  const sc = lerp(o.from || 2.6, 1, k);
  ctx.save();
  ctx.translate(x, y); ctx.rotate((o.rot ?? -6) * Math.PI / 180); ctx.scale(sc, sc);
  ctx.globalAlpha *= clamp(p * 3) * (o.alpha ?? 1);
  const font = o.font || `900 ${o.size || 96}px ${FONT}`;
  ctx.font = font;
  const w = ctx.measureText(s).width + 60, h = (o.size || 96) * 1.35;
  if (o.box !== false) {
    ctx.strokeStyle = color; ctx.lineWidth = 8; ctx.shadowColor = color; ctx.shadowBlur = 30;
    rr(-w / 2, -h / 2, w, h, 12); ctx.stroke();
  }
  ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(s, 0, 4);
  ctx.restore();
}

// 背景: グラデーション＋遠近グリッド＋粒子
function bg(t, th) {
  const g = ctx.createRadialGradient(W / 2, H * .45, 50, W / 2, H * .5, W * .75);
  g.addColorStop(0, th.c1 || '#0b1730'); g.addColorStop(1, th.c2 || '#020409');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const acc = th.acc || COL.pipe;
  // 床のグリッド
  if (th.grid !== 0) {
    ctx.save();
    ctx.globalAlpha = th.grid ?? .5;
    const hy = H * .58;
    const vg = ctx.createLinearGradient(0, hy, 0, H);
    vg.addColorStop(0, hexA(acc, 0)); vg.addColorStop(.35, hexA(acc, .12)); vg.addColorStop(1, hexA(acc, .3));
    ctx.strokeStyle = vg; ctx.lineWidth = 1.5;
    for (let i = -24; i <= 24; i++) {
      ctx.beginPath(); ctx.moveTo(W / 2 + i * 22, hy); ctx.lineTo(W / 2 + i * 260, H + 40); ctx.stroke();
    }
    ctx.strokeStyle = hexA(acc, .22);
    const sp = (t * (th.speed ?? .35)) % 1;
    for (let j = 0; j < 14; j++) {
      const z = (j + sp) / 14;
      const y = hy + Math.pow(z, 2.2) * (H - hy + 60);
      ctx.globalAlpha = (th.grid ?? .5) * z * z;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }
  // 漂う粒子
  ctx.save();
  for (let i = 0; i < (th.dust ?? 70); i++) {
    const x = (hr(i) * W + t * (8 + hr(i + 50) * 30)) % W;
    const y = (hr(i + 100) * H - t * (4 + hr(i + 150) * 14) % H + H) % H;
    const a = .15 + .35 * Math.sin(t * (1 + hr(i + 200)) + i) ** 2;
    ctx.globalAlpha = a;
    ctx.fillStyle = hr(i + 300) < .7 ? acc : '#ffffff';
    ctx.fillRect(x, y, 2 + hr(i + 400) * 2, 2 + hr(i + 400) * 2);
  }
  ctx.restore();
}

function vignette(a = .75) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function scanlines(a = .08) {
  ctx.save(); ctx.fillStyle = `rgba(0,0,0,${a})`;
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2);
  ctx.restore();
}

function flash(color, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(a); ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore();
}

// 画面全体の横スライスずらし（グリッチ）
function sliceGlitch(amt, seed) {
  if (amt <= 0) return;
  const k = Math.floor(seed * 30);
  for (let i = 0; i < 10; i++) {
    if (hr(k * 3 + i) > .25 + amt * .6) continue;
    const y = hr(k * 11 + i) * H, h = 8 + hr(k * 5 + i) * 70;
    const dx = (hr(k * 19 + i) - .5) * 160 * amt;
    ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
  }
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .12 * amt;
  ctx.fillStyle = '#ff004c'; ctx.fillRect((hr(k) - .5) * 30, 0, W, H);
  ctx.restore();
}

// 章扉
function chapterCard(t, t0, t1, num, title, sub, color) {
  const lt = t - t0, p = clamp(lt / .9), out = clamp((t - (t1 - .5)) / .5);
  ctx.save();
  ctx.globalAlpha = 1 - out;
  // 光の筋
  for (let i = 0; i < 18; i++) {
    const y = 140 + hr(i + 900) * 800;
    const x = ((hr(i + 950) * 2400 + lt * (900 + hr(i) * 1500)) % 2600) - 340;
    ctx.fillStyle = hexA(color, .12 + hr(i + 33) * .2);
    ctx.fillRect(x, y, 220 + hr(i + 5) * 400, 2 + hr(i + 9) * 3);
  }
  const k = E.expo(p);
  txt(`ROUTE ${num}`, W / 2, 330 - (1 - k) * 40, { font: `800 64px ${MONO}`, align: 'center', color, alpha: k, ls: 18, glow: color, blur: 18 });
  const tw = measure(title, `900 230px ${FONT}`);
  ctx.save();
  ctx.beginPath(); ctx.rect(W / 2 - tw / 2 - 40, 380, (tw + 80) * E.inOut(clamp(lt / .8)), 300); ctx.clip();
  glitchText(title, W / 2, 530, { font: `900 230px ${FONT}`, align: 'center', color: '#fff', glow: color, blur: 50 }, clamp(1 - lt / 1.2), lt);
  ctx.restore();
  const lw = 900 * E.inOut(clamp((lt - .3) / .7));
  ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 20;
  ctx.fillRect(W / 2 - lw / 2, 680, lw, 4);
  ctx.shadowBlur = 0;
  const sp = clamp((lt - .6) / .9);
  const s2 = sub.slice(0, Math.floor(sub.length * sp));
  txt(s2 + (sp < 1 && Math.floor(lt * 4) % 2 ? '▌' : ''), W / 2, 740, { font: `500 46px ${MONO}`, align: 'center', color: '#e2e8f0' });
  ctx.restore();
}

// 上部の HUD（いまどの経路か）
function hud(t, cur) {
  ctx.save();
  txt('令和のIE', 60, 56, { font: `800 26px ${FONT}`, color: '#e2e8f0', alpha: .85 });
  txt('// 技術秘話 DebugRouteTech', 190, 57, { font: `500 20px ${MONO}`, color: '#94a3b8', alpha: .8 });
  const items = [['00', 'FIND', COL.find, 'begin'], ['01', 'PIPE', COL.pipe, 'pipe'], ['02', 'PORT', COL.port, 'port'], ['03', 'WEBVIEW2', COL.wv2, 'wv2'], ['∞', 'AI', COL.red, 'finale']];
  let x = W - 60;
  for (let i = items.length - 1; i >= 0; i--) {
    const [n, name, c, id] = items[i];
    const s = `${n} ${name}`;
    ctx.font = `700 20px ${MONO}`;
    const w = ctx.measureText(s).width + 28;
    x -= w;
    const on = id === cur;
    rr(x, 38, w, 36, 18);
    ctx.fillStyle = on ? hexA(c, .25) : 'rgba(15,23,42,.6)'; ctx.fill();
    ctx.strokeStyle = on ? c : 'rgba(148,163,184,.3)'; ctx.lineWidth = 1.5; ctx.stroke();
    txt(s, x + w / 2, 57, { font: `700 20px ${MONO}`, align: 'center', color: on ? c : '#64748b' });
    x -= 12;
  }
  ctx.restore();
}

// 字幕（ずんだもんのレベルメーター付き）
function subtitles(t) {
  let cur = null;
  for (const id of TLD.order) {
    const l = TLD.lines[id];
    if (t >= l.start - .08 && t <= l.end + .25) { cur = l; break; }
  }
  if (!cur || cur.nosub) return;
  const a = clamp(Math.min((t - cur.start + .08) / .15, (cur.end + .25 - t) / .2));
  const font = `700 44px ${FONT}`;
  ctx.save();
  ctx.font = font;
  // 折り返し
  const maxW = 1460, rows = [];
  let row = '';
  for (const ch of cur.text) {
    if (ctx.measureText(row + ch).width > maxW) { rows.push(row); row = ''; }
    row += ch;
  }
  rows.push(row);
  const lh = 62, bh = rows.length * lh + 34, by = H - 48 - bh;
  const bw = Math.max(...rows.map(r => ctx.measureText(r).width)) + 160;
  const bx = W / 2 - bw / 2 + 40;
  ctx.globalAlpha = a;
  const gr = ctx.createLinearGradient(0, by, 0, by + bh);
  gr.addColorStop(0, 'rgba(2,6,23,.78)'); gr.addColorStop(1, 'rgba(2,6,23,.9)');
  rr(bx, by, bw, bh, 18); ctx.fillStyle = gr; ctx.fill();
  ctx.strokeStyle = hexA(COL.zunda, .55); ctx.lineWidth = 2; ctx.stroke();
  // ずんだもんバッジ
  const lv = (TLD.env[Math.floor(t * TLD.fps)] || 0) / 100;
  const cx = bx - 10, cy = by + bh / 2;
  ctx.beginPath(); ctx.arc(cx, cy, 44 + lv * 14, 0, 7); ctx.fillStyle = hexA(COL.zunda, .18 + lv * .3); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 40, 0, 7); ctx.fillStyle = '#0f1f0a'; ctx.fill();
  ctx.strokeStyle = COL.zunda; ctx.lineWidth = 4; ctx.shadowColor = COL.zunda; ctx.shadowBlur = 12 + lv * 25; ctx.stroke();
  ctx.shadowBlur = 0;
  for (let i = 0; i < 5; i++) {
    const h = 6 + lv * 40 * (0.5 + .5 * Math.sin(t * 30 + i * 1.7));
    ctx.fillStyle = COL.zunda; ctx.fillRect(cx - 22 + i * 10, cy - h / 2, 6, h);
  }
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  rows.forEach((r, i) => {
    const y = by + 17 + lh / 2 + i * lh;
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineJoin = 'round';
    ctx.strokeText(r, bx + 80, y + 2);
    ctx.fillText(r, bx + 80, y + 2);
  });
  ctx.restore();
}

// 画面の揺れ（衝撃の時刻リストから）
const IMPACTS = [];
function shakeAt(t) {
  let x = 0, y = 0;
  for (const [t0, amp] of IMPACTS) {
    const d = t - t0;
    if (d < 0 || d > .6) continue;
    const k = amp * Math.exp(-d * 9);
    x += Math.sin(d * 90) * k; y += Math.cos(d * 70) * k;
  }
  return [x, y];
}

// シーン: ルート0 すべての始まり（ブラウザの探し方）

function chip(s, x, y, c, a = 1, o = {}) {
  ctx.save(); ctx.globalAlpha *= a;
  ctx.font = o.font || `700 30px ${MONO}`;
  const w = (o.w || ctx.measureText(s).width + 44), h = o.h || 64;
  rr(x - w / 2, y - h / 2, w, h, o.r ?? 14);
  ctx.fillStyle = o.fill || hexA(c, .16); ctx.fill();
  ctx.strokeStyle = c; ctx.lineWidth = 2; if (o.glow) { ctx.shadowColor = c; ctx.shadowBlur = o.glow; } ctx.stroke();
  ctx.restore();

function keyed(t, ks) {
  if (t <= ks[0][0]) return ks[0][1];
  for (let i = 1; i < ks.length; i++) {
    if (t <= ks[i][0]) { const p = (t - ks[i - 1][0]) / (ks[i][0] - ks[i - 1][0]); return lerp(ks[i - 1][1], ks[i][1], E.inOut(p)); }
  }
  return ks[ks.length - 1][1];
}

    ['', 'TheBeginningOfEverything ／ pipe-tech ／ websocket-tech ／ webview2-tech'],
    ['事件の出典', 'Invariant Labs (2025) ／ Brave (2025) ／ Anthropic (2025) ／ StepSecurity (2025)'],
    ['', '警察庁 (2026) ／ IPA (2026)'],
  ];
  lines.forEach(([k, v], i) => {
    const y = 520 + i * 70;
    const a = PT(t, s.start + .8 + i * .25, .5);
    if (k) txt(k, 520, y, { font: `700 28px ${FONT}`, align: 'right', color: '#94a3b8', alpha: a });
    txt(v, 560, y, { font: `600 28px ${FONT}`, color: '#e2e8f0', alpha: a });
  });
  ctx.restore();
}

// 1フレームの合成と、シーンのつなぎ
const ORDER = ['open', 'begin', 'pipe', 'port', 'wv2', 'finale', 'end'];
const SCENES = { open: sceneOpen, begin: sceneBegin, pipe: scenePipe, port: scenePort, wv2: sceneWv2, finale: sceneFinale, end: sceneEnd };
const TCOL = { begin: COL.find, pipe: COL.pipe, port: COL.port, wv2: COL.wv2, finale: '#ffffff', end: '#000000' };

// 画面を揺らす時刻（音の衝撃音と同じ時刻を audio.js でも使う）
const HITS = [
  [F('o3', .42), 16], [F('b4', .5), 8], [F('b7', .2), 8], [F('b11', .15), 8], [L('b12').start + .3, 6], [F('p3', .5), 18], [F('r4', .22), 28], [F('r4', .6), 16], [F('r7', .76), 12],
  [F('w4', .1), 6], [F('w4', .24), 6], [F('w4', .38), 6], [F('w4', .7), 24], [L('w11').start + .5, 8],
  [F('f2', .62), 10], [F('f3', .5), 16], [F('f13', .3) + 1.6, 14], [F('f14', .55), 12],
];
HITS.forEach(h => IMPACTS.push(h));

function sceneAt(t) {
  for (const id of ORDER) { const s = S(id); if (t >= s.start && t < s.end) return id; }
  return 'end';
}

window.renderFrame = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const id = sceneAt(t);
  const [sx, sy] = shakeAt(t);
  ctx.save(); ctx.translate(sx, sy);
  SCENES[id](t);
  ctx.restore();
  scanlines(.07);
  vignette(id === 'finale' ? .8 : .65);
  const caseTime = t >= L(CASES[0].id).start - .2 && t < L('f13').start;
  if (id !== 'open' && id !== 'end' && (id !== 'finale' || caseTime)) hud(t, id);
  // シーンの切り替わり: 直前は横ずれ、直後は光
  for (const nid of ORDER.slice(1)) {
    const d = t - S(nid).start;
    if (d > -.25 && d < 0) sliceGlitch((d + .25) / .25, t);
    if (d >= 0 && d < .5 && nid !== 'end') flash(TCOL[nid], (1 - d / .5) * (nid === 'finale' ? .15 : .45));
  }
  subtitles(t);
  // 全体のフェードイン・アウト
  flash('#000', 1 - clamp(t / .8));
  flash('#000', clamp((t - (TLD.duration - .6)) / .6));
};

window.FRAME_COUNT = Math.ceil(TLD.duration * TLD.fps);
</script>
<script>
// HTML 版の再生: 声（セリフごとの wav）と BGM（bgm.mp3）を鳴らし、その再生位置で Canvas を描く
const VOICE_DIR = 'voice/ReiwaIE_DebugRoute/';
const CHARS = "―•…※←→⇄∞⊕①②③─▌■✓✕、。々〆「」〜あいうえおかがきぎくぐけげこごさしじすずせぜそぞただちっつづてでとどなにのはばぱひびぶへべほまみむめもゃやよらりるれわをんァアィイウェエォオカキクグケコサザシジスズセゼソタダチッツテデトドナニヌネハバパビフブプベペボポマミムメモャュユョラリルレロワン・ー一万上不並中丸主乗乱予事人今仕付代令件任伏会似位住体何作使例依価便保信値側元先光入全公典内冒処出分切列初別利制刻前割力功加動勢区単印原厳参取受口古召可台史右号合同名否告呼命和品員喚喝回固国土地型基報場境壁変外大奥始威子字存定実家察対専射導小少届市常幕年庁床度廃引張強当形影律後必応思恐悪情成戦所扉手打承技折抜拒拡持指捕探接描援揺撃操支攻放数文料新方日明易時普景更書替最月期本来果柱校格械業標模権横機欠次止正歳歴段氏気求決沈法活流海渡準漂漏点無照版特犯理生用由画界番疑発登的目直相県真着知確示秒秘移空立章等筋答策管簡粉粒約純終組経結絵続線緩縮織置者背能脅自色落葉行術衝表装裏要見規覧親解言記設許証評詰話認語説読調論諜警議資走起越足距路身込近返追送透通逮進道違遠選部錠録長閉開間限陣陥隈隙隠離霜非面革音順須頭頼類高魔（）＋／：＝？［］";
const DUR = TLD.duration;
const BG = .85, DUCK = .45;
const $ = s => document.querySelector(s);
const fmt = s => { s = Math.max(0, s); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; };

let ac = null, bus = null, bgGain = null, voGain = null, bgm = null;
const VO = {};
let srcs = [], playing = false, T = 0, base = 0, seeking = false, ready = false, dirty = true;

// セリフが続く区間をまとめて、BGM を下げる区間にする
const DUCKS = [];
for (const id of TLD.order) {
  const l = TLD.lines[id], a = l.start - .1, b = l.end + .15, last = DUCKS[DUCKS.length - 1];
  if (last && a - last[1] < .7) last[1] = b; else DUCKS.push([a, b]);
}

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  cv.style.width = 1920 * s + 'px'; cv.style.height = 1080 * s + 'px';
}
addEventListener('resize', fit); fit();

async function loadAll() {
  const total = TLD.order.length + 2;
  let n = 0;
  const step = () => { $('#startLbl').textContent = `読み込み中… ${Math.round(++n / total * 100)}%`; };
  const weights = [500, 600, 700, 800, 900];
  await Promise.all([
    ...weights.map(w => document.fonts.load(`${w} 40px "Noto Sans JP"`, CHARS).catch(() => {})),
    document.fonts.load(`700 40px "JetBrains Mono"`, 'abc0123').catch(() => {}),
  ]);
  step();
  ac = new (window.AudioContext || window.webkitAudioContext)();
  bus = ac.createGain(); bus.connect(ac.destination);
  bgGain = ac.createGain(); bgGain.gain.value = BG; bgGain.connect(bus);
  voGain = ac.createGain(); voGain.connect(bus);
  const get = async url => { const r = await fetch(url); if (!r.ok) throw new Error(url); return await ac.decodeAudioData(await r.arrayBuffer()); };
  try { bgm = await get(VOICE_DIR + 'bgm.mp3'); } catch (e) { console.warn('BGM なしで再生します', e); }
  step();
  // 声が読み込めなくても、字幕と BGM だけで再生できるようにする
  await Promise.all(TLD.order.map(async id => { try { VO[id] = await get(VOICE_DIR + id + '.wav'); } catch (e) { console.warn(e); } step(); }));
}

function stopAudio() { for (const s of srcs) { try { s.stop(); } catch (e) {} } srcs = []; }
function startAudio(from) {
  stopAudio();
  const now = ac.currentTime + .06;
  base = now - from;
  if (bgm && from < bgm.duration) {
    const s = ac.createBufferSource(); s.buffer = bgm; s.connect(bgGain); s.start(now, from); srcs.push(s);
  }
  const g = bgGain.gain;
  g.cancelScheduledValues(0); g.setValueAtTime(BG, now);
  for (const [a, b] of DUCKS) {
    if (b < from) continue;
    const ta = base + a, tb = base + b;
    if (ta > now) { g.setValueAtTime(BG, ta); g.linearRampToValueAtTime(BG * DUCK, ta + .15); }
    else g.setValueAtTime(BG * DUCK, now);
    g.setValueAtTime(BG * DUCK, Math.max(now, tb)); g.linearRampToValueAtTime(BG, Math.max(now, tb) + .35);
  }
  for (const id of TLD.order) {
    const l = TLD.lines[id], buf = VO[id];
    if (!buf) continue;
    const off = Math.max(0, from - l.start);
    if (off >= buf.duration) continue;
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(voGain);
    s.start(base + l.start + off, off); srcs.push(s);
  }
}

const cur = () => playing ? Math.min(DUR, ac.currentTime - base) : T;
async function play(fromStart) {
  if (!ready) return;
  await ac.resume();
  if (fromStart || T >= DUR - .05) T = 0;
  startAudio(T);
  playing = true; $('#bPlay').textContent = '❚❚'; idle();
}
function pause() { T = cur(); stopAudio(); playing = false; $('#bPlay').textContent = '▶'; dirty = true; showCtl(); }
const toggle = () => playing ? pause() : play();
function seekTo(t) { T = Math.max(0, Math.min(DUR, t)); if (playing) startAudio(T); dirty = true; }

function loop() {
  const t = cur();
  if (playing || dirty) {
    renderFrame(t);
    $('#tm').textContent = `${fmt(t)} / ${fmt(DUR)}`;
    if (!seeking) $('#seek').value = t;
    dirty = false;
  }
  if (playing && t >= DUR) { pause(); T = DUR; }
  requestAnimationFrame(loop);
}

// 操作バーは、再生中に動きがなければ隠す
let hideTimer = 0;
function showCtl() { document.body.classList.remove('idle'); clearTimeout(hideTimer); }
function idle() { showCtl(); hideTimer = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 2500); }
addEventListener('pointermove', idle);

$('#bPlay').onclick = () => { $('#start')?.remove(); toggle(); };
$('#bRe').onclick = () => { $('#start')?.remove(); play(true); };
$('#bMute').onclick = () => { if (!bus) return; const m = bus.gain.value > 0; bus.gain.value = m ? 0 : 1; $('#bMute').textContent = m ? '🔇' : '🔊'; };
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
$('#seek').max = DUR;
$('#seek').oninput = e => { seeking = true; seekTo(+e.target.value); };
$('#seek').onchange = () => { seeking = false; };
addEventListener('keydown', e => {
  if (!ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#start')?.remove(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') { $('#start')?.remove(); play(true); }
  else if (e.key === 'm' || e.key === 'M') $('#bMute').click();
  else if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  else if (e.key === 'ArrowRight') seekTo(cur() + 5);
  else if (e.key === 'ArrowLeft') seekTo(cur() - 5);
});

loadAll().then(() => {
  ready = true;
  // 再生前は、タイトルの場面を表紙として見せる
  T = 0; renderFrame(F('o3', .95)); dirty = false;
  const st = $('#start');
  st.classList.remove('loading');
  $('#startLbl').textContent = `▶ 再生（${Math.floor(DUR / 60)}分${Math.round(DUR % 60)}秒）`;
  st.onclick = () => { st.remove(); play(true); };
  $('#tm').textContent = `0:00 / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
});
</script>
