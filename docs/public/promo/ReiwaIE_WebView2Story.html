<script>// 描画の土台: 地中の断面図。カメラは化石の眠る深い地層から、時代を追って地上へ昇っていく
// 通信の「ルート」は光る「根（ルート）」として描き、WebView2 の種は、ずんだもん（枝豆）にちなんで光る豆にする
// スクリーンショットは、発掘した標本としてガラスの展示ケースに収める
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1920, H = 1080;
// 描く倍率。HTML 版は全画面のときに Canvas の画素数を変え、座標は 1920×1080 のまま SC 倍して描く
let SC = 1;
// 光のぼかし（shadowBlur）は座標の倍率がかからないので、ここで SC 倍する
{
  const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, 'shadowBlur');
  Object.defineProperty(ctx, 'shadowBlur', { get() { return d.get.call(this) / SC; }, set(v) { d.set.call(this, v * SC); } });
}

const JP = "'Noto Sans JP','Yu Gothic UI','Meiryo',sans-serif";
const MIN = "'Shippori Mincho B1','Yu Mincho','MS Mincho',serif";
const EN = "'Cormorant Garamond','Georgia',serif";
const CODE = "'IBM Plex Mono','Consolas',monospace";
const IMG_BASE = '../img/';

// 色: 土の茶、琥珀の化石、光る根（WebView2）、枝豆の緑、霜の青。つむぎだけは黄色
const C = {
  ink: '#090604', soil0: '#120d09', soil1: '#1b140f', soil2: '#251b14', soil3: '#33261b', clay: '#5b4130',
  amber: '#f0a73a', amberD: '#7a4310', honey: '#ffd27a',
  root: '#5cf2b4', rootD: '#1c6a50', bean: '#a6e85f', beanD: '#3f7a1f',
  frost: '#c4e8ff', frostD: '#4d7fa6',
  cream: '#f3e7cf', paper: '#e8dbbd', sepia: '#6b4e2e', wht: '#fff8ea', dim: '#ab9779', dim2: '#5e4e3c',
  red: '#ff5d4f', yel: '#ffd23f', acc: '#d0484f', xl: '#35c27a', edge: '#4cb0ff', ps: '#5b9cf0',
  pipe: '#36d6f0', ws: '#f5a524', wv2: '#5cf2b4', gold: '#d9b36c',
};

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const PT = (t, t0, d) => d <= 0 ? (t >= t0 ? 1 : 0) : clamp((t - t0) / d);
const E = {
  out: p => 1 - Math.pow(1 - p, 3),
  in: p => p * p * p,
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  sine: p => .5 - .5 * Math.cos(Math.PI * p),
};
// 同じ番号なら同じ値を返す乱数（フレームごとに揺れないように）
const hr = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hexA = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

// 時刻表（timeline.py の tld.json）
const L = id => { const l = TLD.lines[id]; if (!l) throw new Error('no line ' + id); return l; };
const S = id => TLD.scenes[id];
const F = (id, f) => { const l = L(id); return l.start + (l.end - l.start) * f; };
// 行 a の始まりから、行 b の始まり（なければシーンの終わり）まで見せる不透明度
const span = (t, a, b, fi = .5, fo = .5) => PT(t, a, fi) * (1 - PT(t, b - fo, fo));

// ---------- 文字 ----------
function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.font = o.font || `700 44px ${JP}`;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'middle';
  ctx.globalAlpha *= (o.alpha ?? 1);
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.stroke) { ctx.lineWidth = o.sw || 6; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 22; }
  ctx.fillStyle = o.color || C.wht;
  ctx.fillText(s, x, y);
  ctx.restore();
}
// 明朝の「！」「？」は斜めの字形で読みにくいので、その字だけゴシックで描く（中央・左揃え）
function txtMix(s, x, y, o = {}) {
  const font = o.font || `800 96px ${MIN}`, alt = font.replace(MIN, JP).replace(/^(\d+)/, '900');
  const parts = s.split(/([！？!?]+)/).filter(Boolean);
  const ws = parts.map(p => tw(p, /^[！？!?]+$/.test(p) ? alt : font));
  const total = ws.reduce((a, b) => a + b, 0);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  parts.forEach((p, i) => { txt(p, cx, y, { ...o, font: /^[！？!?]+$/.test(p) ? alt : font, align: 'left' }); cx += ws[i]; });
}
function tw(s, font, ls = 0) { ctx.save(); ctx.font = font; if (ls) ctx.letterSpacing = ls + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w - (ls ? ls : 0); }
// 幅に収まるよう文字の大きさを下げる（font の "NNpx" を置き換える）
function fitFont(s, font, maxW, min = 14) {
  let fs = +font.match(/(\d+)px/)[1];
  while (fs > min && tw(s, font.replace(/\d+px/, fs + 'px')) > maxW) fs--;
  return font.replace(/\d+px/, fs + 'px');
}
// 決まった幅で折り返す（日本語は1文字ずつ、英単語は切らない）
function wrap(s, font, maxW) {
  const rows = []; let cur = '';
  const toks = s.match(/[A-Za-z0-9_.@:/#\-]+|\s+|./gu) || [];
  for (const k of toks) {
    if (k === '\n') { rows.push(cur); cur = ''; continue; }
    if (tw(cur + k, font) > maxW && cur) { rows.push(cur.trimEnd()); cur = k.trimStart(); } else cur += k;
  }
  if (cur) rows.push(cur);
  return rows;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function line(x1, y1, x2, y2, col, w = 2, a = 1, dash) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function flash(color, a) {
  if (a <= 0) return;
  ctx.save(); ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.globalAlpha = clamp(a); ctx.fillStyle = color; ctx.fillRect(-50, -50, W + 100, H + 100); ctx.restore();
}

// ---------- 画像（記事のスクリーンショット） ----------
const IMG_FILES = {
  fossil: '化石コントロール.png', access: 'Access先行.png', kiosk: '疑似WebView2.png', psWv2: 'WebView2×Powershell.png',
  pqDll: 'ExcelのPowerQueryにWebView2DLL発見.png', psProc: 'PowerShell配下にWebView2プロセス.png', xlWv2: 'Excel直からWebView2.png',
  acc2: 'story/human/20.png', ext: '拡張機能がWebView2で動作してる様子.png',
};
const IMGS = {};
for (const [k, f] of Object.entries(IMG_FILES)) {
  const im = new Image(); im.src = IMG_BASE + f.split('/').map(encodeURIComponent).join('/'); IMGS[k] = im;
}
// 標本ケース: クルミ材の額に、ガラスの映り込み。下に紙の札を下げる。crop: [sx, sy, sw, sh]
function plate(key, x, y, w, h, o = {}) {

  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1); ctx.translate(x, y); ctx.scale(s, s);
  const q = E.out(clamp(p));
  // 幹
  ctx.fillStyle = '#5a3d27';
  ctx.beginPath(); ctx.moveTo(-34, 0); ctx.bezierCurveTo(-24, -120 * q, -18, -200 * q, -10, -300 * q);
  ctx.lineTo(10, -300 * q); ctx.bezierCurveTo(18, -200 * q, 24, -120 * q, 34, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#3c281a'; ctx.lineWidth = 3; ctx.stroke();
  // 枝
  const br = o.branches ?? [[-1, .55, 150], [1, .68, 140], [-1, .82, 110], [1, .9, 90]];
  ctx.strokeStyle = '#5a3d27'; ctx.lineCap = 'round';
  br.forEach(([side, f, len], i) => {
    const bp = clamp((p - .3 - i * .08) * 2.4);
    if (bp <= 0) return;
    ctx.lineWidth = 14 - i * 2;
    ctx.beginPath(); ctx.moveTo(0, -300 * q * f); ctx.quadraticCurveTo(side * len * .5 * bp, -300 * q * f - 30 * bp, side * len * bp, -300 * q * f - 60 * bp); ctx.stroke();
  });
  // 茂み
  const cp = clamp((p - .45) * 2);
  if (cp > 0) {
    const blobs = [[0, -360, 120], [-120, -330, 90], [120, -320, 95], [-60, -430, 90], [70, -440, 85], [-170, -260, 60], [170, -250, 64]];
    ctx.shadowColor = o.glow || '#7ae08a'; ctx.shadowBlur = 30;
    blobs.forEach(([bx, by, br0], i) => {
      const r = br0 * E.back(clamp(cp * 1.4 - i * .06)) + Math.sin(t * 1.1 + i) * 2;
      if (r <= 0) return;
      const g = ctx.createRadialGradient(bx - r * .3, by - r * .3, r * .1, bx, by, r);
      g.addColorStop(0, o.leafHi || '#8fe07a'); g.addColorStop(1, o.leafLo || '#2f7a3e');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by * q, r, 0, 7); ctx.fill();
    });
  }
  ctx.restore();
}

// 琥珀（中に昔のものを閉じ込めた化石）。inner は琥珀の中を描く関数
function amber(x, y, w, h, t, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0) return;
  const pts = [];
  for (let i = 0; i < 11; i++) {
    const an = i / 11 * Math.PI * 2, r = .82 + hr(i * 3.7 + 1) * .2;
    pts.push([x + Math.cos(an) * w / 2 * r, y + Math.sin(an) * h / 2 * r]);
  }
  ctx.save(); ctx.globalAlpha *= a;
  ctx.beginPath(); pts.forEach(([px, py], i) => ctx[i ? 'lineTo' : 'moveTo'](px, py)); ctx.closePath();
  ctx.shadowColor = C.amber; ctx.shadowBlur = 50 * (o.glow ?? 1);
  const g = ctx.createRadialGradient(x - w * .15, y - h * .2, 10, x, y, Math.max(w, h) * .6);
  g.addColorStop(0, '#ffcf6a'); g.addColorStop(.55, '#d8861f'); g.addColorStop(1, '#7a4310');
  ctx.fillStyle = g; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.save(); ctx.clip();
  if (o.inner) { ctx.globalAlpha *= .9; o.inner(); }
  // 琥珀の色を中身にかぶせる
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(255,170,60,.55)'; ctx.fillRect(x - w, y - h, w * 2, h * 2);
  ctx.globalCompositeOperation = 'source-over';
  // ひび
  ctx.strokeStyle = 'rgba(255,240,200,.35)'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 5; k++) {
    ctx.beginPath(); let cx = x + (hr(k + 9) - .5) * w * .6, cy = y + (hr(k + 19) - .5) * h * .6; ctx.moveTo(cx, cy);
    for (let j = 0; j < 4; j++) { cx += (hr(k * 9 + j) - .5) * 80; cy += (hr(k * 7 + j + 3) - .5) * 60; ctx.lineTo(cx, cy); }
    ctx.stroke();
  }
  // 照り
  const sh = ctx.createLinearGradient(x - w / 2, y - h / 2, x, y);
  sh.addColorStop(0, 'rgba(255,255,255,.35)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sh; ctx.fillRect(x - w / 2, y - h / 2, w, h);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,214,140,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); pts.forEach(([px, py], i) => ctx[i ? 'lineTo' : 'moveTo'](px, py)); ctx.closePath(); ctx.stroke();
  ctx.restore();
}

// 地割れ（感情が噴き出す場面の文字の後ろ）。中から琥珀色の光が漏れる
function crack(x, y, t, t0, o = {}) {
  const p = E.out(PT(t, t0, .35));
  if (p <= 0) return;
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  const col = o.color || C.amber, n = o.n ?? 9, R = (o.r ?? 520) * p;
  ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 20; ctx.lineCap = 'round';
  for (let k = 0; k < n; k++) {
    const an = k / n * Math.PI * 2 + hr(k + (o.seed || 0)) * .5;
    let px = x, py = y; ctx.beginPath(); ctx.moveTo(px, py);
    const steps = 6;
    for (let j = 1; j <= steps; j++) {
      const d = R * j / steps * (.6 + hr(k * 11 + j) * .5);
      const jit = (hr(k * 13 + j) - .5) * .5;
      px = x + Math.cos(an + jit) * d; py = y + Math.sin(an + jit) * d * .55;
      ctx.lineTo(px, py);
    }
    ctx.lineWidth = 5 * (1 - p * .4); ctx.stroke();
  }
  ctx.restore();
}
// 気持ちが噴き出す一言（明朝の大きな文字。地割れの上に出る）
function shout(s, x, y, t, t0, o = {}) {
  const p = PT(t, t0, .3);
  if (p <= 0) return;
  const a = (o.alpha ?? 1) * clamp(p * 2);
  if (o.crack !== false) crack(x, y, t, t0, { alpha: a * .8, color: o.crackColor, r: o.r, seed: o.seed });
  const k = lerp(1.6, 1, E.out(p));
  const shake = (1 - p) * 10;
  ctx.save(); ctx.translate(x + (hr(Math.floor(t * 40)) - .5) * shake, y); ctx.scale(k, k);
  const font = fitFont(s, o.font || `800 96px ${MIN}`, o.maxW || 1500);
  txtMix(s, 0, 0, { font, align: 'center', color: o.color || C.wht, stroke: 'rgba(10,6,3,.9)', sw: 14, alpha: a, glow: o.glow || C.amber, blur: 30 });
  ctx.restore();
}

// 霜（画面の端から氷の結晶が伸びる）
function frost(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H);
  g.addColorStop(0, 'rgba(160,210,255,0)'); g.addColorStop(1, 'rgba(160,210,255,.35)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(220,240,255,.55)'; ctx.lineWidth = 1.4; ctx.shadowColor = C.frost; ctx.shadowBlur = 8;
  for (let k = 0; k < 26; k++) {
    const edge = k % 4, u = hr(k * 3.3);
    let x = edge === 0 ? u * W : edge === 1 ? W : edge === 2 ? u * W : 0;
    let y = edge === 0 ? 0 : edge === 1 ? u * H : edge === 2 ? H : u * H;
    const an = Math.atan2(H / 2 - y, W / 2 - x) + (hr(k + 1) - .5) * .8, len = (90 + hr(k + 2) * 170) * a;
    crystal(x, y, an, len, 3, k);
  }
  ctx.restore();
}
function crystal(x, y, an, len, depth, seed) {
  if (depth <= 0 || len < 6) return;
  const x2 = x + Math.cos(an) * len, y2 = y + Math.sin(an) * len;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
  for (let j = 1; j <= 3; j++) {
    const f = j / 4, bx = lerp(x, x2, f), by = lerp(y, y2, f);
    crystal(bx, by, an + .9, len * .35, depth - 1, seed + j);
    crystal(bx, by, an - .9, len * .35, depth - 1, seed + j * 3);
  }
}

// 漂う土ぼこり・胞子
function motes(t, o = {}) {
  ctx.save();
  const n = o.n ?? 60, col = o.color || '#ffe2b0';
  for (let i = 0; i < n; i++) {
    const sp = 8 + hr(i + .1) * 20;
    const x = (hr(i) * W + Math.sin(t * .3 + i) * 30) % W;
    const y = ((hr(i + .5) * H - t * sp * (o.dir ?? 1)) % H + H) % H;
    const r = .8 + hr(i + .9) * 2.2;
    ctx.globalAlpha = (o.alpha ?? .35) * (.4 + .6 * Math.sin(t * 2 + i * 3) ** 2);
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.restore();
}
// 灯り（中心の周りだけ見せて、外を暗くする）
function lantern(x, y, r, a = 1, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createRadialGradient(x, y, r * .25, x, y, r);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.7, `rgba(4,2,1,${o.mid ?? .6})`); g.addColorStop(1, `rgba(4,2,1,${o.edge ?? .96})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
// 上から差しこむ光の筋
function rays(x, y, a, t, o = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'lighter';
  const col = o.color || '255,230,170', n = o.n ?? 7, spread = o.spread ?? .5, len = o.len ?? 1100;
  for (let i = 0; i < n; i++) {
    const an = Math.PI / 2 + (i / (n - 1) - .5) * spread + Math.sin(t * .4 + i) * .02;
    const w = 30 + hr(i) * 60;
    const g = ctx.createLinearGradient(x, y, x + Math.cos(an) * len, y + Math.sin(an) * len);
    g.addColorStop(0, `rgba(${col},.22)`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x - w * .2, y); ctx.lineTo(x + w * .2, y);
    ctx.lineTo(x + Math.cos(an) * len + Math.cos(an + Math.PI / 2) * w, y + Math.sin(an) * len + Math.sin(an + Math.PI / 2) * w);
    ctx.lineTo(x + Math.cos(an) * len - Math.cos(an + Math.PI / 2) * w, y + Math.sin(an) * len - Math.sin(an + Math.PI / 2) * w);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// コード1行（等幅、簡単な色分け）
function code(s, x, y, o = {}) {
  const font = o.font || `500 30px ${CODE}`;
  const parts = s.split(/("[^"]*")/);
  let cx = x;
  ctx.save(); ctx.font = font;
  const total = ctx.measureText(s).width;
  ctx.restore();
  if (o.align === 'center') cx = x - total / 2;
  for (const part of parts) {
    if (!part) continue;
    const col = part.startsWith('"') ? '#f2b880' : /^\s*(Set|Dim|Sub|End|As|New)\b/.test(part) ? '#8fb8ff' : (o.color || '#e9e2d0');
    txt(part, cx, y, { font, color: col, alpha: o.alpha ?? 1 });
    cx += tw(part, font);
  }
}

// ---------- 画面の揺れ（main.js の HITS） ----------
// シーンの表と、時刻に結びつく出来事（揺れ・効果音）。各シーンのファイルが書き足す
const SCN = {}, OVER = {}, HITS = [], SEQ = [];
// 効果音の予約: cue(時刻, 種類, 設定)
const cue = (t, kind, o = {}) => SEQ.push([t, kind, o]);

// シーンで使い回す部品: ガラス瓶・フォームの窓・箱と矢印・印・刻んだ文字・魔法陣・家・壁 など

// ガラス瓶（テラリウム）。inner で中身を描く
function jar(x, y, w, h, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  if (o.shake) ctx.translate(Math.sin(o.t * 60) * o.shake, 0);
  // 台
  ctx.fillStyle = '#2a1c12'; rr(x - w / 2 - 20, y + h / 2 - 6, w + 40, 30, 6); ctx.fill();
  ctx.fillStyle = '#4a3220'; rr(x - w / 2 - 20, y + h / 2 - 6, w + 40, 8, 4); ctx.fill();
  // 中身（瓶の形で切り抜く）
  ctx.save();
  rr(x - w / 2, y - h / 2, w, h, 40); ctx.clip();
  ctx.fillStyle = 'rgba(30,40,38,.55)'; ctx.fillRect(x - w / 2, y - h / 2, w, h);
  if (o.inner) o.inner();
  ctx.restore();
  // ガラス
  ctx.strokeStyle = 'rgba(220,240,235,.55)'; ctx.lineWidth = 3; rr(x - w / 2, y - h / 2, w, h, 40); ctx.stroke();
  const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, 'rgba(255,255,255,.16)'); g.addColorStop(.18, 'rgba(255,255,255,.03)'); g.addColorStop(.8, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.1)');
  ctx.fillStyle = g; rr(x - w / 2, y - h / 2, w, h, 40); ctx.fill();
  // ふた
  ctx.fillStyle = '#6b4b2e'; rr(x - w / 2 + 16, y - h / 2 - 26, w - 32, 32, 6); ctx.fill();
  ctx.fillStyle = '#8a6440'; rr(x - w / 2 + 16, y - h / 2 - 26, w - 32, 8, 4); ctx.fill();
  // ひび
  if (o.crack > 0) {
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
    for (let k = 0; k < 6; k++) {
      ctx.beginPath(); let cx = x + (hr(k + 3) - .5) * w * .3, cy = y + h * .1; ctx.moveTo(cx, cy);
      for (let j = 0; j < 4 * o.crack; j++) { cx += (hr(k * 7 + j) - .5) * 70; cy += (hr(k * 5 + j + 1) - .3) * 60; ctx.lineTo(cx, cy); }
      ctx.stroke();
    }
  }
  ctx.restore();
  // 名札
  if (o.label) {
    const lw = tw(o.label, `700 34px ${JP}`) + 56;
    ctx.save(); ctx.globalAlpha *= a;
    ctx.fillStyle = o.labelColor || C.acc; rr(x - lw / 2, y + h / 2 - 90, lw, 52, 8); ctx.fill();
    ctx.restore();
    txt(o.label, x, y + h / 2 - 63, { font: `700 34px ${JP}`, color: '#fff', align: 'center', alpha: a });
  }
}

// Windows のフォーム（UserForm）の窓。inner で中身を描く
function winForm(x, y, w, h, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#f0f0f0'; ctx.fillRect(x, y, w, h);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = o.barColor || '#ffffff'; ctx.fillRect(x, y, w, 40);
  ctx.strokeStyle = o.edge || '#9aa5b1'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
  txt(o.title || 'UserForm1', x + 16, y + 21, { font: `500 20px ${JP}`, color: '#222' });
  txt('✕', x + w - 24, y + 21, { font: `400 20px ${JP}`, color: '#444', align: 'center' });
  ctx.save(); ctx.beginPath(); ctx.rect(x + 14, y + 54, w - 28, h - 68); ctx.clip();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 14, y + 54, w - 28, h - 68);
  if (o.inner) o.inner(x + 14, y + 54, w - 28, h - 68);
  ctx.restore();
  ctx.strokeStyle = '#b8c0c8'; ctx.lineWidth = 1; ctx.strokeRect(x + 14, y + 54, w - 28, h - 68);
  ctx.restore();
}

// 角丸の箱（図の部品）
function box(x, y, w, h, label, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0) return;
  const col = o.color || C.gold;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = o.fill || hexA(col, .12); rr(x - w / 2, y - h / 2, w, h, o.r ?? 12); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = o.lw || 2;
  if (o.glow) { ctx.shadowColor = col; ctx.shadowBlur = 20; }
  rr(x - w / 2, y - h / 2, w, h, o.r ?? 12); ctx.stroke();
  ctx.restore();
  const font = fitFont(label, o.font || `700 30px ${JP}`, w - 24);
  txt(label, x, y - (o.sub ? 14 : 0), { font, color: o.tcol || C.cream, align: 'center', alpha: a });
  if (o.sub) txt(o.sub, x, y + 22, { font: fitFont(o.sub, o.subFont || `500 20px ${JP}`, w - 20), color: o.scol || C.dim, align: 'center', alpha: a });
}
// 矢印（p: 伸びた割合）
function arrow(x1, y1, x2, y2, p, o = {}) {
  if (p <= 0) return;
  const col = o.color || C.gold, x = lerp(x1, x2, p), y = lerp(y1, y2, p);
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = o.w || 3; ctx.lineCap = 'round';
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x, y); ctx.stroke();
  ctx.setLineDash([]);
  const an = Math.atan2(y2 - y1, x2 - x1), hs = o.head ?? 16;
  const tip = [[x, y], [x - Math.cos(an - .45) * hs, y - Math.sin(an - .45) * hs], [x - Math.cos(an + .45) * hs, y - Math.sin(an + .45) * hs]];
  ctx.beginPath(); tip.forEach(([px, py], i) => ctx[i ? 'lineTo' : 'moveTo'](px, py)); ctx.closePath(); ctx.fill();
  if (o.both) {
    const tb = [[x1, y1], [x1 + Math.cos(an - .45) * hs, y1 + Math.sin(an - .45) * hs], [x1 + Math.cos(an + .45) * hs, y1 + Math.sin(an + .45) * hs]];
    ctx.beginPath(); tb.forEach(([px, py], i) => ctx[i ? 'lineTo' : 'moveTo'](px, py)); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
// ○ と ✕ の印
function mark(ok, x, y, s, p, o = {}) {
  if (p <= 0) return;
  const col = o.color || (ok ? C.bean : C.red);
  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1) * clamp(p * 2); ctx.translate(x, y); ctx.scale(lerp(1.6, 1, E.out(p)), lerp(1.6, 1, E.out(p)));
  ctx.strokeStyle = col; ctx.lineWidth = s * .16; ctx.lineCap = 'round'; ctx.shadowColor = col; ctx.shadowBlur = 16;
  ctx.beginPath();

  else { ctx.moveTo(-s * .36, -s * .36); ctx.lineTo(s * .36, s * .36); ctx.moveTo(s * .36, -s * .36); ctx.lineTo(-s * .36, s * .36); }
  ctx.stroke(); ctx.restore();
}
// 地層に刻んだ文字（彫り込みのように、上に暗い影・下に明るい縁）
function carve(s, x, y, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0) return;
  const font = o.font || `500 26px ${CODE}`;
  const n = o.p === undefined ? s.length : Math.floor([...s].length * clamp(o.p));
  const show = [...s].slice(0, n).join('');
  txt(show, x, y + 1.5, { font, color: 'rgba(255,225,180,.18)', alpha: a, align: o.align });
  txt(show, x, y - 1, { font, color: 'rgba(0,0,0,.75)', alpha: a, align: o.align });
  txt(show, x, y, { font, color: o.color || '#b99a74', alpha: a, align: o.align });
}
// 小さな札（文字の大きさに合わせる）
function chip(s, x, y, o = {}) {
  const a = o.alpha ?? 1;
  if (a <= 0) return 0;
  const font = o.font || `600 26px ${JP}`, col = o.color || C.gold;
  const w = tw(s, font) + 40, h = o.h || 48;
  const x0 = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.fillStyle = o.fill || 'rgba(12,8,5,.85)'; rr(x0, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2; rr(x0, y - h / 2, w, h, h / 2); ctx.stroke();
  ctx.restore();
  txt(s, x0 + w / 2, y + 1, { font, color: o.tcol || col, align: 'center', alpha: a });
  return w;
}

// 魔法陣（呪文に見えた単語を、円に沿って並べる）。spin: 回転、burst: 外へ飛び散る割合
function magicCircle(x, y, r, words, t, o = {}) {
  const a = o.alpha ?? 1;

  ctx.save(); ctx.globalAlpha *= a * (1 - burst * .6); ctx.translate(x, y);
  ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 18;
  for (const [rr0, lw] of [[r, 3], [r * .82, 1.5], [r * .5, 2], [r * 1.08, 1]]) { ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(0, 0, rr0 * (1 + burst * .6), 0, 7); ctx.stroke(); }
  // 星形
  ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = 0; i <= 5; i++) { const an = spin * -1.3 + i * Math.PI * 4 / 5 - Math.PI / 2; ctx[i ? 'lineTo' : 'moveTo'](Math.cos(an) * r * .8, Math.sin(an) * r * .8); }
  ctx.stroke();
  ctx.restore();
  // 単語
  words.forEach((wd, i) => {
    const an = spin + i / words.length * Math.PI * 2;

// 1フレームの合成: 地層（カメラの深さ）→ シーン → 年代の目盛り・章の札 → 字幕 → 周辺減光と粒子

const RISE = { route3: 3.4 };

  kiosk: ['第三層', '誘拐', ''], real: ['第四層', '本物への渇望', ''], qiita: ['第五層', '突破口', '2026.03'],
  swamp: ['第六層', '沼', '2026.03 – 04'], winter: ['第七層', '冬眠', '2026.05 – 07'], letter: ['第八層', '一通の報告', '2026.08'],

function sceneAt(t) {
  let id = TLD.sceneOrder[0];
  for (const s of TLD.sceneOrder) if (t >= TLD.scenes[s].start) id = s;
  return id;
}
const DRIFT = 120;
function camY(t) {
  const sid = sceneAt(t), s = S(sid), i = TLD.sceneOrder.indexOf(sid);
  const d0 = DEPTH[sid], still = d0 < 0;
  let y = still ? d0 : d0 + DRIFT / 2 - DRIFT * PT(t, s.start, s.end - s.start);
  if (i > 0) {
    const prev = TLD.sceneOrder[i - 1], pe = DEPTH[prev] < 0 ? DEPTH[prev] : DEPTH[prev] - DRIFT / 2;
    y = lerp(pe, y, E.inOut(PT(t, s.start, RISE[sid] ?? 1.3)));

}
// シーンの中身を出す不透明度（昇っている間は出さない）
const enter = (t, s, d = .7) => PT(t, s.start + (RISE[TLD.sceneOrder.find(k => TLD.scenes[k] === s)] ?? 1.3) * .55, d);

function shakeAt(t) {
  let x = 0, y = 0;
  for (const [t0, k] of HITS) {
    const d = t - t0;
    if (d < 0 || d > .6) continue;
    const a = k * Math.pow(1 - d / .6, 2);
    x += Math.sin(d * 80 + t0) * a; y += Math.cos(d * 63 + t0 * 3) * a;
  }
  return [x, y];
}

// ---------- 年代の目盛り（左端） ----------
function drawRuler(t, sid, a) {
  if (a <= 0) return;
  const cy = camY(t), x = 58, top = 240, bot = 850;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 0, 150, 0);
  g.addColorStop(0, 'rgba(6,4,2,.55)'); g.addColorStop(1, 'rgba(6,4,2,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 160, H);
  ctx.strokeStyle = 'rgba(217,179,108,.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bot); ctx.stroke();
  // 細かい目盛り（世界に貼りつける）
  for (let wy = Math.floor((cy - 400) / 50) * 50; wy < cy + 400; wy += 50) {
    const y = H / 2 + (wy - cy) * .85;
    if (y < top || y > bot) continue;
    const big = wy % 250 === 0;
    ctx.globalAlpha = a * (big ? .7 : .35);
    ctx.beginPath(); ctx.moveTo(x - (big ? 12 : 6), y); ctx.lineTo(x, y); ctx.stroke();
  }

  for (let i = 1; i < STRATA.length - 1; i++) {
    const st = STRATA[i];
    const y = H / 2 + (st.y - cy) * .85;

    const k = clamp(1 - Math.abs(y - H / 2) / 380);

  bean(x, H / 2, .2, { rot: -1.57, glow: 16 });
  ctx.restore();

// ---------- 章の札（大きく出てから、左上に収まる） ----------
function drawChapter(t, sid, s) {
  const ch = CHAPTER[sid];
  if (!ch) return;
  const t0 = CH_AT[sid] ? s.start + CH_AT[sid] : s.start + (RISE[sid] ?? 1.3) * .45;
  const p = PT(t, t0, .6), q = E.inOut(PT(t, t0 + 1.7, .8));

  const lw = tw(ch[1], `800 118px ${MIN}`);
  const x = lerp(W / 2 - lw / 2, 112, q), y = lerp(H * .42, 98, q), k = lerp(1, .42, q);
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);

// ---------- 字幕 ----------
const CAPS = {};
function capLayout(id, s, font, maxW) {
  if (CAPS[id]) return CAPS[id];
  const rows = wrap2(s, font, maxW);
  const out = [];
  ctx.save(); ctx.font = font;
  let n = 0;
  rows.forEach((r, ri) => {
    const chars = [...r];
    let x = 0;
    chars.forEach(ch => { out.push({ ch, x, row: ri, i: n++ }); x += ctx.measureText(ch).width; });
  });
  ctx.restore();
  return (CAPS[id] = { rows: rows.length, chars: out, n });
}
// 2行に分ける: 真ん中に近い区切り（、。！？ や空白）で切る
function wrap2(s, font, maxW) {
  if (tw(s, font) <= maxW) return [s];
  let best = -1, bestD = 1e9;
  for (const marks of ['、。！？）」…', ' ']) {
    for (let i = 1; i < s.length - 1; i++) {
      if (!marks.includes(s[i - 1])) continue;
      const w1 = tw(s.slice(0, i), font), w2 = tw(s.slice(i), font);
      if (w1 > maxW || w2 > maxW) continue;
      const d = Math.abs(w1 - w2);
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best >= 0) break;
  }
  if (best < 0) { best = s.length; while (best > 1 && tw(s.slice(0, best), font) > maxW) best--; }
  return [s.slice(0, best).trimEnd(), s.slice(best).trimStart()];
}
function curLine(t) {
  let cur = null;
  for (const id of TLD.order) { if (TLD.lines[id].start - .12 <= t) cur = id; else break; }
  return cur;
}
function drawCaption(t) {
  const id = curLine(t);
  if (!id) return;
  const l = L(id), idx = TLD.order.indexOf(id), next = TLD.order[idx + 1];
  const until = Math.min(next ? L(next).start - .12 : 1e9, l.end + 1.8);

  if (a <= 0) return;
  if (l.spk === 't') return whisper(t, id, l, a);

  const fadeZ = id === 'ha6' ? 1 - PT(t, l.end + .2, 1.4) : 1;
  ctx.save(); ctx.globalAlpha = a * fadeZ;
  const g = ctx.createLinearGradient(0, 850, 0, H);
  g.addColorStop(0, 'rgba(7,4,2,0)'); g.addColorStop(.35, 'rgba(7,4,2,.78)'); g.addColorStop(1, 'rgba(7,4,2,.92)');
  ctx.fillStyle = g; ctx.fillRect(0, 850, W, H - 850);
  // 話している間だけ伸びる根（行の進み具合）
  const pr = PT(t, l.start, l.end - l.start);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = a * fadeZ * .9;
  root(vine(150, 906, 1770, 906, idx, 40, 5), pr, { w: 3, w1: 1.2, blur: 12, tip: pr < 1, color: C.bean });
  ctx.restore();
  const talking = t < l.end;
  ctx.save(); ctx.globalAlpha = a * fadeZ;
  bean(104, 975 + (talking ? Math.sin(t * 18) * 2 : 0), .58, { rot: -.15, glow: talking ? 24 : 8 });
  ctx.restore();
  const font = `700 46px ${JP}`;
  const lay = capLayout(id, l.text, font, 1560);
  const dur = Math.max(.45, (l.end - l.start) * .6);
  const y0 = lay.rows === 1 ? 978 : 950;
  ctx.save(); ctx.font = font; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 8;
  for (const c of lay.chars) {
    const ta = l.start + c.i / lay.n * dur;
    const p = PT(t, ta, .16);
    if (p <= 0) break;

}

const FILM = (() => {
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const vig = mk(W, H);
  {
    const g = vig.getContext('2d');

    const c = mk(256, 256), g = c.getContext('2d'), d = g.createImageData(256, 256);

  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;

  ctx.restore();
}

    ...['500 40px "Shippori Mincho B1"', '600 40px "Shippori Mincho B1"', '800 40px "Shippori Mincho B1"',
      'italic 500 40px "Cormorant Garamond"', 'italic 600 40px "Cormorant Garamond"', 'italic 700 40px "Cormorant Garamond"', '800 40px "Cormorant Garamond"',
      '500 40px "IBM Plex Mono"', '600 40px "IBM Plex Mono"', '700 40px "IBM Plex Mono"']
      .map(f => document.fonts.load(f, CHARS).catch(() => {})),
  ]);
  step();
  ac = new (window.AudioContext || window.webkitAudioContext)();
  bus = ac.createGain(); bus.connect(ac.destination);
  bgGain = ac.createGain(); bgGain.gain.value = BG; bgGain.connect(bus);
  voGain = ac.createGain(); voGain.connect(bus);
  // 効果音は bgm.mp3 に入れず、絵と同じ時刻表からブラウザの中で鳴らす（BGM と同じく、声の間は下げる）
  se = window.liveSE(ac, bgGain);
  const get = async url => { const r = await fetch(url); if (!r.ok) throw new Error(url); return await ac.decodeAudioData(await r.arrayBuffer()); };
  try { bgm = await get(VOICE_DIR + 'bgm.mp3'); } catch (e) { console.warn('BGM なしで再生します', e); }
  step();
  // 声が読み込めなくても、字幕と BGM だけで再生できるようにする
  await Promise.all(TLD.order.map(async id => { try { VO[id] = await get(VOICE_DIR + id + '.wav'); } catch (e) { console.warn(e); } step(); }));
}

function stopAudio() { for (const s of srcs) { try { s.stop(); } catch (e) {} } srcs = []; se?.stop(); }
function startAudio(from) {
  stopAudio();
  const now = ac.currentTime + .06;
  base = now - from;
  if (bgm && from < bgm.duration) {
    const s = ac.createBufferSource(); s.buffer = bgm; s.connect(bgGain); s.start(now, from); srcs.push(s);
  }
  const g = bgGain.gain;
  g.cancelScheduledValues(0); g.setValueAtTime(BG, now);
  for (const [a, b] of DUCKS) {
    if (b < from) continue;
    const ta = base + a, tb = base + b;
    if (ta > now) { g.setValueAtTime(BG, ta); g.linearRampToValueAtTime(BG * DUCK, ta + .15); }
    else g.setValueAtTime(BG * DUCK, now);
    g.setValueAtTime(BG * DUCK, Math.max(now, tb)); g.linearRampToValueAtTime(BG, Math.max(now, tb) + .35);
  }
  for (const id of TLD.order) {
    const l = TLD.lines[id], buf = VO[id];
    if (!buf) continue;
    const off = Math.max(0, from - l.start);
    if (off >= buf.duration) continue;
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(voGain);
    s.start(base + l.start + off, off); srcs.push(s);
  }
  se.start(from, base);
}

const cur = () => playing ? Math.min(DUR, ac.currentTime - base) : T;
async function play(fromStart) {
  if (!ready) return;
  cover = null;
  await ac.resume();
  if (fromStart || T >= DUR - .05) T = 0;
  startAudio(T);
  playing = true; $('#bPlay').textContent = '❚❚'; idle();
}
function pause() { T = cur(); stopAudio(); playing = false; $('#bPlay').textContent = '▶'; dirty = true; showCtl(); }
const toggle = () => playing ? pause() : play();
function seekTo(t) { cover = null; T = Math.max(0, Math.min(DUR, t)); if (playing) startAudio(T); dirty = true; }

function loop() {
  const t = cur();
  if (playing || dirty) {
    renderFrame(cover ?? t);
    $('#tm').textContent = `${fmt(t)} / ${fmt(DUR)}`;
    if (!seeking) $('#seek').value = t;
    dirty = false;
  }
  if (playing && t >= DUR) { pause(); T = DUR; }
  requestAnimationFrame(loop);
}

// 操作バーは、再生中に動きがなければ隠す
let hideTimer = 0;
function showCtl() { document.body.classList.remove('idle'); clearTimeout(hideTimer); }
function idle() { showCtl(); hideTimer = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 2500); }
addEventListener('pointermove', idle);

$('#bPlay').onclick = () => { $('#start')?.remove(); toggle(); };
$('#bRe').onclick = () => { $('#start')?.remove(); play(true); };
$('#bMute').onclick = () => { if (!bus) return; const m = bus.gain.value > 0; bus.gain.value = m ? 0 : 1; $('#bMute').textContent = m ? '🔇' : '🔊'; };
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
$('#seek').max = DUR;
$('#seek').oninput = e => { seeking = true; seekTo(+e.target.value); };
$('#seek').onchange = () => { seeking = false; };
addEventListener('keydown', e => {
  if (!ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#start')?.remove(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') { $('#start')?.remove(); play(true); }
  else if (e.key === 'm' || e.key === 'M') $('#bMute').click();
  else if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  else if (e.key === 'ArrowRight') seekTo(cur() + 5);
  else if (e.key === 'ArrowLeft') seekTo(cur() - 5);
});

loadAll().then(() => {
  ready = true;
  // 再生前は、タイトルの場面を表紙として見せる
  T = 0; cover = L('fo5').end + 3.4; renderFrame(cover); dirty = false;
  const st = $('#start');
  st.classList.remove('loading');
  $('#startLbl').textContent = `▶ 再生（${Math.floor(DUR / 60)}分${Math.round(DUR % 60)}秒）`;
  st.onclick = () => { st.remove(); play(true); };
  $('#tm').textContent = `0:00 / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
});
</script>

</body>
