<script>window.TL={"fps": 30, "duration": 782.191, "scenes": {"open": {"start": 0.0, "first": 2.6, "end": 38.961}, "lineage": {"start": 38.961, "first": 40.361, "end": 153.009}, "blood": {"start": 153.009, "first": 155.809, "end": 212.445}, "branch": {"start": 212.445, "first": 215.245, "end": 259.279}, "events": {"start": 259.279, "first": 262.079, "end": 334.619}, "tabs": {"start": 334.619, "first": 337.419, "end": 405.944}, "async": {"start": 405.944, "first": 408.744, "end": 482.511}, "build": {"start": 482.511, "first": 485.311, "end": 578.689}, "fork": {"start": 578.689, "first": 581.489, "end": 660.605}, "finale": {"start": 660.605, "first": 662.205, "end": 765.191}, "end": {"start": 765.191, "first": 766.191, "end": 782.191}}, "lines": {"op1": {"start": 2.6, "end": 10.141, "text": "2021年7月。IE のサポート終了を前に、CodeProject に一本の記事が載った。", "scene": "open"}, "op2": {"start": 10.641, "end": 15.975, "text": "WebDriver を入れられない環境でも、VBA から Edge を動かす方法。", "scene": "open"}, "op3": {"start": 16.575, "end": 22.431, "text": "ここから、VBA で CDP を話す線路が、何本も伸びていったのだ。", "scene": "open"}, "op4": {"start": 22.931, "end": 29.459, "text": "同じ VBA、同じ CDP。どこで同じ駅に着き、どこで道が分かれたのか。", "scene": "open"}, "op5": {"start": 29.859, "end": 33.261, "text": "3つのプロジェクトを、路線図にしてたどるのだ。", "scene": "open"}, "ln1": {"start": 40.361, "end": 48.329, "text": "始発駅は、ChrisK23 氏の clsEdge。Pipe で Edge とつながる、小さなクラスなのだ。", "scene": "lineage"}, "ln2": {"start": 48.629, "end": 55.947, "text": "Pipe を選んだのは、ポートだと同じ PC の誰からでも入れてしまうから、と記事に書かれている。", "scene": "lineage"}, "ln3": {"start": 56.447, "end": 64.361, "text": "2022年1月、PerditionC 氏の VBAChromeDevProtocol が、ここから枝分かれする。", "scene": "lineage"}, "ln4": {"start": 64.661, "end": 73.867, "text": "6月8日には、longvh211 氏の Chromium-Automation-with-CDP-for-VBA も、ここから伸びた。", "scene": "lineage"}, "ln5": {"start": 74.367, "end": 81.279, "text": "その5日後。ChrisK23 氏の記事とは別のところから、もう一本の線が生まれる。", "scene": "lineage"}, "ln6": {"start": 81.579, "end": 90.741, "text": "24000 氏、Qiita では kabkabkab 氏の ChromeControler。最初から WebSocket で走る、もう一つの源流なのだ。", "scene": "lineage"}, "ln7": {"start": 91.341, "end": 96.024, "text": "そして6月15日。IE のサポートが、終わった。", "scene": "lineage"}, "ln8": {"start": 96.724, "end": 102.431, "text": "IE の終わりと入れ替わるように、源流が2つ、走り出していたのだ。", "scene": "lineage"}, "ln9": {"start": 103.131, "end": 113.093, "text": "時は流れて、2025年12月。longvh211 氏の土台をフォークして、StarterWebScrapingKit が開業する。", "scene": "lineage"}, "ln10": {"start": 113.393, "end": 121.735, "text": "WebSocket のコアロジックは、kabkabkab 氏の作品から乗り入れた。2つの源流、両方の血を引く路線なのだ。", "scene": "lineage"}, "ln11": {"start": 122.235, "end": 131.728, "text": "2026年3月には、kabkabkab 氏の作品を機能強化した派生版、vba-cdp-webdriver が公開された。", "scene": "lineage"}, "ln12": {"start": 132.028, "end": 142.044, "text": "ファイルは16本から19本へ。行数は、およそ5,300から1万4千へ。2.7倍に延びているのだ。", "scene": "lineage"}, "ln13": {"start": 142.544, "end": 151.909, "text": "比べるのは、この3本。キット、VBAChromeDevProtocol、そして vba-cdp-webdriver なのだ。", "scene": "lineage"}, "bl1": {"start": 155.809, "end": 165.025, "text": "まずは、従兄弟どうしの VBAChromeDevProtocol とキット。ソースを並べると、同じ駅名標が残っていた。", "scene": "blood"}, "bl2": {"start": 165.525, "end": 175.285, "text": "CDP messages received from chrome are null-terminated。コメントの一行が、一字一句同じなのだ。", "scene": "blood"}, "bl3": {"start": 175.785, "end": 187.049, "text": "VBAChromeDevProtocol 側は、VBA では vbNullChar を検索できないと思った、という当時の判断のまま。1文字ずつ Mid で調べている。", "scene": "blood"}, "bl4": {"start": 187.349, "end": 197.088, "text": "キット側は InStr の1回に置き換わり、Daniel Polak 氏の名前と、2025年10月の日付が書き足されている。", "scene": "blood"}, "bl5": {"start": 197.388, "end": 204.993, "text": "この改修は、longvh211 氏の本家に入ったもの。キットは、本家の改修も取り込んでいるのだ。", "scene": "blood"}, "bl6": {"start": 205.593, "end": 211.545, "text": "出発点は同じ。違うのは、その後も手を入れ続けたかどうか、だけなのだ。", "scene": "blood"}, "br1": {"start": 215.245, "end": 221.699, "text": "もう一つの一致。どちらも、Pipe が本線で、WebSocket は後から足した支線なのだ。", "scene": "branch"}, "br2": {"start": 222.199, "end": 231.703, "text": "VBAChromeDevProtocol は後から WebSocket にも対応し、キットも v2.3.0 で Port ルートを開いた。", "scene": "branch"}, "br3": {"start": 232.203, "end": 238.261, "text": "真似ではなく、必然なのだ。Pipe が使えるのは、自分でブラウザを起動したときだけ。", "scene": "branch"}, "br4": {"start": 238.561, "end": 247.329, "text": "もう走っているブラウザ、たとえばログイン済みの画面に後から乗るには、Port 経由の WebSocket しか道がない。", "scene": "branch"}, "br5": {"start": 247.829, "end": 258.379, "text": "一方、源流Bの2本は、最初から WebSocket 一本。中核のクラス名が、a1_WebSocketCommunicator なのだ。", "scene": "branch"}, "ev1": {"start": 262.079, "end": 269.471, "text": "ここからは、3者の違い。まずは、ブラウザから勝手に届く知らせ、イベントの受け取り方なのだ。", "scene": "events"}, "ev2": {"start": 269.971, "end": 279.72, "text": "キットは、VBA の RaiseEvent を4種類。method か id か、sessionId があるかないかで、届け先を分ける。", "scene": "events"}, "ev3": {"start": 280.02, "end": 287.273, "text": "受け取る側は、WithEvents で購読するだけ。同じイベントを、何人でも別々に聞けるのだ。", "scene": "events"}, "ev4": {"start": 287.773, "end": 294.557, "text": "VBAChromeDevProtocol は、イベント名ごとに受け手を登録する、伝言板の方式。", "scene": "events"}, "ev5": {"start": 294.857, "end": 302.409, "text": "本体を改造せずに拡張できるのは、キットと互角。ただし、1つの名前に書けるのは1件だけなのだ。", "scene": "events"}, "ev6": {"start": 302.709, "end": 306.88, "text": "2人目が登録すると、1人目は黙って上書きされる。", "scene": "events"}, "ev7": {"start": 307.38, "end": 316.329, "text": "vba-cdp-webdriver は、Select Case に決め打ち。知っているイベントだけを読んで、自分の状態を書き換える。", "scene": "events"}, "ev8": {"start": 316.629, "end": 322.837, "text": "その数は21種類。元の作品の9種類から、大きく増えたところなのだ。", "scene": "events"}, "ev9": {"start": 323.137, "end": 333.719, "text": "新しいイベントを拾うには、本体を改造するしかない。その代わり、アラートの自動処理やダウンロード監視が、最初から完成品として載っている。", "scene": "events"}, "tb1": {"start": 337.419, "end": 345.611, "text": "次はタブ。CDP には、ウィンドウを切り替える命令がない。タブの管理は、各自が発明するしかないのだ。", "scene": "tabs"}, "tb2": {"start": 346.111, "end": 353.663, "text": "キットのタブは、それぞれ独立したオブジェクト。1本の接続を、sessionId で多重化している。", "scene": "tabs"}, "tb3": {"start": 353.963, "end": 360.373, "text": "タブ1とタブ2に、交互に命令を送っても、切り替えという手順そのものがないのだ。", "scene": "tabs"}, "tb4": {"start": 360.873, "end": 371.903, "text": "VBAChromeDevProtocol も、同じ1本の接続を多重化している。ただ、今どのタブ宛てかを示す sessionId は、全体で1つ。", "scene": "tabs"}, "tb5": {"start": 372.203, "end": 377.429, "text": "switchTo を呼び忘れると、命令は別のタブへ走っていくのだ。", "scene": "tabs"}, "tb6": {"start": 377.929, "end": 383.828, "text": "vba-cdp-webdriver は、タブを替えるたびに、いったん改札を出る。", "scene": "tabs"}, "tb7": {"start": 384.128, "end": 393.813, "text": "HTTP で一覧を取り直し、ソケットを張り直して、CDP を9往復。これを、切り替えのたびに繰り返すのだ。", "scene": "tabs"}, "tb8": {"start": 394.313, "end": 405.044, "text": "ただ、クリックで開いた別タブを、親子関係から正確に追えるのは VBAChromeDevProtocol。ここは3者で一番厳密なのだ。", "scene": "tabs"}, "as1": {"start": 408.744, "end": 413.832, "text": "速さを決めるのは、結果を待たずに、次のコマンドを撃てるかどうか。", "scene": "async"}, "as2": {"start": 414.132, "end": 423.871, "text": "キットは ExecuteCDPAsync で整理券だけ受け取って先へ進み、あとから TakeResultCDP で回収できる。", "scene": "async"}, "as3": {"start": 424.371, "end": 433.448, "text": "VBAChromeDevProtocol にも、nowait という土台はある。でも Private のまま、公開の入口にはつながらなかった。", "scene": "async"}, "as4": {"start": 433.748, "end": 438.42, "text": "vba-cdp-webdriver には、この仕組み自体がないのだ。", "scene": "async"}, "as5": {"start": 438.92, "end": 444.541, "text": "分かれ目は、覗き見。届いているかどうかを、待たずに確かめられるか、なのだ。", "scene": "async"}, "as6": {"start": 444.841, "end": 456.34, "text": "Pipe には PeekNamedPipe がある。でも WinHttpWebSocketReceive には覗き見がなく、届くまで Excel ごと止まってしまう。", "scene": "async"}, "as7": {"start": 456.64, "end": 463.765, "text": "VBAChromeDevProtocol の作者自身も、応答不能になる、とコメントに書き残しているのだ。", "scene": "async"}, "as8": {"start": 464.265, "end": 474.569, "text": "キットは WinSock まで降りて、WebSocket を自前で実装した。ioctlsocket で、何バイト届いているかを先に聞けるのだ。", "scene": "async"}, "as9": {"start": 474.869, "end": 481.611, "text": "非同期が3者で1つしか成り立たなかった理由は、突き詰めると、この1点だった。", "scene": "async"}, "bd1": {"start": 485.311, "end": 487.999, "text": "ファイルの分け方も、3者3様なのだ。", "scene": "build"}, "bd2": {"start": 488.299, "end": 496.459, "text": "キットは、ブラウザ、タブ、要素という、スコープの階層。Puppeteer や Playwright と同じ軸なのだ。", "scene": "build"}, "bd3": {"start": 496.959, "end": 508.681, "text": "vba-cdp-webdriver は、a1 から a6 まで、処理の段階に番号を振っている。駅ナンバリングのように、積み上げの順番そのものなのだ。", "scene": "build"}, "bd4": {"start": 508.981, "end": 515.552, "text": "生きている接続は、いつも1本。タブで分ける必要がないから、工程で並べたのだ。", "scene": "build"}, "bd5": {"start": 515.852, "end": 527.063, "text": "ChromeDriver と EdgeDriver は、およそ2,700行の97%が同じ。インターフェースはあるのに、ファイルごと複製されている。", "scene": "build"}, "bd6": {"start": 527.663, "end": 539.204, "text": "そして VBAChromeDevProtocol。CDP の公式仕様から、VBA 製のジェネレーターで、236ファイル、3万行を自動生成したのだ。", "scene": "build"}, "bd7": {"start": 539.504, "end": 546.885, "text": "cdp.Page.navigate と書ける。打ち間違いはコンパイルで止まり、IntelliSense も効く。", "scene": "build"}, "bd8": {"start": 547.185, "end": 553.916, "text": "VBA 圏で、型付きのプロトコル定義を実際に作ったのは、この1つだけなのだ。", "scene": "build"}, "bd9": {"start": 554.416, "end": 560.539, "text": "ただし、45あるドメインのうち、すぐ使えるように配線されたのは10個。", "scene": "build"}, "bd10": {"start": 560.839, "end": 571.217, "text": "要素を扱う clsElement は、8つのメンバーで止まった。キットの CDPElement は、公開メソッドだけで35あるのだ。", "scene": "build"}, "bd11": {"start": 571.517, "end": 577.789, "text": "下ごしらえは完璧。でも、その上に、人が使う層が積まれなかったのだ。", "scene": "build"}, "fk1": {"start": 581.489, "end": 589.34, "text": "並べてみると、VBAChromeDevProtocol とキットは、設計のアイデアがほとんど同じ駅に立っていた。", "scene": "fork"}, "fk2": {"start": 589.64, "end": 597.277, "text": "Pipe が先で WebSocket が後。sessionId での多重化。非同期の下地。別タブへの備え。", "scene": "fork"}, "fk3": {"start": 597.577, "end": 604.457, "text": "型付きの自動生成という、一番効くはずの投資にまで手を付けていた。骨格は良いのだ。", "scene": "fork"}, "fk4": {"start": 604.957, "end": 616.872, "text": "全部門1位はいない。単体タブで手早くなら vba-cdp-webdriver、生の CDP を型付きで叩くなら VBAChromeDevProtocol なのだ。", "scene": "fork"}, "fk5": {"start": 617.472, "end": 622.005, "text": "分かれたのは、その先。工事が、続いたかどうかなのだ。", "scene": "fork"}, "fk6": {"start": 622.305, "end": 633.633, "text": "キットの CDPBrowser には、2023年から2026年まで、longvh211 氏と Daniel Polak 氏の工事記録が残っている。", "scene": "fork"}, "fk7": {"start": 633.933, "end": 645.379, "text": "同じ検索を VBAChromeDevProtocol にかけても、更新履歴のコメントは1件も出てこない。最後の更新は、2022年の12月なのだ。", "scene": "fork"}, "fk8": {"start": 645.979, "end": 651.536, "text": "差を作ったのは、情熱の量というより、情熱を持続させる構造だった。", "scene": "fork"}, "fk9": {"start": 651.836, "end": 659.505, "text": "1人か、複数人か。ライブラリか、製品か。ゼロから作るか、良いものを組み合わせるか。", "scene": "fork"}, "fn1": {"start": 662.205, "end": 666.365, "text": "では、キットの路線には、何が注ぎ込まれてきたのか。", "scene": "finale"}, "fn2": {"start": 666.965, "end": 668.544, "text": "1つ目は、技術。", "scene": "finale"}, "fn3": {"start": 668.944, "end": 679.525, "text": "Pipe に WebSocket、WebView2。CDP に加えて、WebDriver BiDi。WinSock の上に、WebSocket を一から書き起こした。", "scene": "finale"}, "fn4": {"start": 680.125, "end": 681.96, "text": "2つ目は、AI。", "scene": "finale"}, "fn5": {"start": 682.36, "end": 693.859, "text": "きっちり決まった RFC の仕様を、AI と一緒に VBA へ訳していった。ハルシネーションに振り回されながらも、仕組みを理解して直す相棒だったのだ。", "scene": "finale"}, "fn6": {"start": 694.459, "end": 697.083, "text": "そして3つ目は、人の気持ち。", "scene": "finale"}, "fn7": {"start": 697.583, "end": 706.383, "text": "インストール不要で、ブラウザを意のままに操れた、あの頃の手軽さ。意地でも、IE を令和に蘇らせる。", "scene": "finale"}, "fn8": {"start": 707.183, "end": 712.804, "text": "5つのクラスから始まった土台は、10か月で、77の版を重ねた。", "scene": "finale"}, "fn9": {"start": 713.104, "end": 724.005, "text": "7ファイル、およそ5千行だった本家の土台に、先人たちのライブラリも乗り入れて、今は45ファイル、4万1千行の路線網なのだ。", "scene": "finale"}, "fn10": {"start": 724.705, "end": 735.148, "text": "Chromium-Automation-with-CDP-for-VBA から始まった線路は、ここまで、育ったのだ。", "scene": "finale"}, "fn11": {"start": 737.548, "end": 741.228, "text": "同じ物差しは、もう一段先まで続いている。", "scene": "finale"}, "fn12": {"start": 741.528, "end": 752.397, "text": "VBAChromeDevProtocol、キット、そして Playwright と Puppeteer。分けたのは、どれだけ投資を続けられたか、という1本の軸なのだ。", "scene": "finale"}, "fn13": {"start": 752.997, "end": 758.971, "text": "コアの設計さえ正しければ、VBA でも、商用ツールと同じホームに立てる。", "scene": "finale"}, "fn14": {"start": 759.771, "end": 762.491, "text": "この路線は、まだ延びているのだ。", "scene": "finale"}, "ed1": {"start": 766.191, "end": 770.383, "text": "この路線図は、たくさんの人が敷いた線路の上にあるのだ。", "scene": "end"}, "ed2": {"start": 770.783, "end": 775.391, "text": "乗り入れてくれた、すべての路線に、ありがとうなのだ。", "scene": "end"}}, "order": ["op1", "op2", "op3", "op4", "op5", "ln1", "ln2", "ln3", "ln4", "ln5", "ln6", "ln7", "ln8", "ln <script>// 描画の土台: 時間 t（秒）だけで絵が決まるようにする（乱数も t とインデックスから作る）

function pathLen(pts) {
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);

    if (r <= d) { const k = d ? r / d : 0; return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)]; }

function partPts(pts, a, b) {
  const tot = pathLen(pts), A = tot * clamp(a), B = tot * clamp(b), out = [];
  if (B <= A) return out;
  let s = 0;
  for (let i = 1; i < pts.length; i++) {

    if (s1 >= A && s <= B && d > 0) {

      if (!out.length) out.push([lerp(p0[0], p1[0], k0), lerp(p0[1], p1[1], k0)]);
      out.push([lerp(p0[0], p1[0], k1), lerp(p0[1], p1[1], k1)]);
    }
    s = s1;
  }
  return out;
}
// 折れ線の角を丸める（路線図の線は 45°・90° に折り、角だけ丸く曲げる）
function rounded(pts, r = 46, n = 10) {
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i], [cx, cy] = pts[i + 1];
    const d1 = Math.hypot(bx - ax, by - ay), d2 = Math.hypot(cx - bx, cy - by);
    const q = Math.min(r, d1 / 2, d2 / 2);
    const p1 = [bx + (ax - bx) / d1 * q, by + (ay - by) / d1 * q], p2 = [bx + (cx - bx) / d2 * q, by + (cy - by) / d2 * q];
    for (let k = 0; k <= n; k++) {
      const u = k / n, v = 1 - u;
      out.push([v * v * p1[0] + 2 * v * u * bx + u * u * p2[0], v * v * p1[1] + 2 * v * u * by + u * u * p2[1]]);

function offsetPts(pts, d) {
  return pts.map((p, i) => {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;

  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
}

function rail(pts, p, c, o = {}) {

// コード（VBA の色分け）。暗い札の上に打ち出す
const KW = /^(Dim|As|Set|Sub|End|Function|Private|Public|Const|String|Long|Boolean|If|Then|Else|ElseIf|Do|Loop|For|To|Next|Exit|Mod|Or|And|Not|Static|New|Event|RaiseEvent|WithEvents|Property|Let|Get|Optional|Case|Select|Enum|ByVal|ByRef|Call|Nothing|True|False|Is|Each|In)$/;

  let m;
  while ((m = re.exec(line))) {
    const [s, com, str, sp, id, num] = m;
    let c = '#d5dbe5';
    if (com) c = '#7f8ea3';
    else if (str) c = '#9be29b';
    else if (sp) c = null;
    else if (id) c = KW.test(id) ? '#c7b5ff' : /^[A-Z]/.test(id) ? '#8fd3ff' : '#e8edf3';

}

      ctx.fillStyle = hexA(hl, ha); ctx.fillRect(x - 12, cy - lh / 2, 5, lh); ctx.restore();

const IMPACTS = [];

  let x = 0, y = 0;

// 線上の x に当たる割合（S は斜めの区間があるので、点列から探す）
function fracAtX(pts, x) {
  const tot = pathLen(pts);

  for (let i = 1; i < pts.length; i++) {

  }

    // 転てつ機（今の行き先）

    rr(1180, 560, 300, 150, 12); ctx.fillStyle = '#2a3140'; ctx.fill();

    ctx.strokeStyle = COL.gold; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(1250, 710); ctx.lineTo(1290, 760); ctx.stroke();

  // 4. vba-cdp-webdriver: 切り替えのたびに、改札を出て、張り直して、9往復
  const s4 = win(t, L('tb6').start - .2, L('tb7').end + .3, .4, .4);
  if (s4 > 0) {
    ctx.save(); ctx.globalAlpha *= s4;

    const route = [[200, 330], [1720, 330]];

      const x = 260 + i * 480, p = PK(t, k, .4);

      txt(a, x, 392, { font: `900 28px ${FONT}`, align: 'center', color: COL.ink, alpha: p });
      txt(b, x, 430, { font: `700 20px ${MONO}`, align: 'center', color: COL.sub, alpha: p });
    });
    // 改札（1つ目の駅）と、タブを替える命令

      ctx.save(); ctx.globalAlpha *= gp;
      for (const gx of [190, 300]) { rr(gx, 520, 50, 150, 8); ctx.fillStyle = '#d7dbe2'; ctx.fill(); ctx.strokeStyle = '#5b6170'; ctx.lineWidth = 3; ctx.stroke(); }
      ctx.fillStyle = COL.red; const fo = PK(t, 'tGate', .3); ctx.fillRect(240, 560, 30 * (1 - fo) + 4, 16); ctx.fillRect(290 - 30 * (1 - fo), 560, 30 * (1 - fo) + 4, 16);

    }
    // 歩く人（改札を出て、また入る）
    const wk = clamp((t - K('tGate')) / (K('tCdp') - K('tGate') + .3));
    if (wk > 0) pict(lerp(260, 1700, E.inOut(wk)), 318, 64, COL.ink, { walk: t * 12 });
    // 9往復のチェック
    const cmds = ['Target.attachToTarget', 'Target.activateTarget', 'Page.enable', 'DOM.enable', 'Runtime.enable', 'Network.enable', 'Page.setLifecycleEventsEnabled', 'Runtime.evaluate（document）', 'DOM.getDocument'];
    const cx = 1220, cy = 500;
    card(cx - 20, cy - 30, 560, 9 * 34 + 50, LINE.W.c, { pop: PK(t, 'tCdp', .4), r: 12 });
    const loop = t > K('tAgain') ? ((t - K('tAgain')) % 2.4) / 2.4 : 1;
    cmds.forEach((c, i) => {
      const on = t > K('tCdp') + .2 + i * .14 && (t < K('tAgain') || loop * 9 > i);
      mark('ok', cx + 14, cy + 4 + i * 34, 12, on ? 1 : 0);
      txt(c, cx + 40, cy + 5 + i * 34, { font: `700 20px ${MONO}`, color: on ? COL.ink : '#b8b0a0', alpha: PK(t, 'tCdp', .4) });
    });
    const n9 = clamp((t - K('tCdp') - .2) / (9 * .14));
    if (n9 > 0) txt(`${Math.min(9, Math.ceil(n9 * 9))} / 9`, cx + 520, cy - 2, { font: `900 26px ${MONO}`, align: 'right', color: LINE.W.c });
    const ag = PK(t, 'tAgain', .4);
    if (ag > 0) {
      arrowPts(rounded([[1150, 760], [300, 760], [300, 470]], 40), ag, COL.red, { w: 6, dash: [14, 10] });
      txt(`切り替えのたびに × ${1 + Math.floor((t - K('tAgain')) / 2.4)}`, 720, 800, { font: `900 30px ${FONT}`, align: 'center', color: COL.red, alpha: ag });
    }
    ctx.restore();
  }
  // 5. ただ、別タブを親子関係で正確に追えるのは VBAChromeDevProtocol
  const s5 = seg(t, 'tb8', 'tb8');
  if (s5 > 0) {

    browserWin(260, 280, 560, 320, { tabs: [{ label: '親タブ', on: true }], label: '一覧ページ' });
    chip('クリック', 540, 520, COL.ink, { pop: PK(t, 'tPop', .4), solid: true, font: `900 22px ${FONT}`, h: 40 });

    const op = PK(t, 'tOpener', .7);
    arrowPts(rounded([[820, 440], [960, 440], [1080, 470]], 40), op, LINE.V.c, { w: 6 });
    chip('openerId', 950, 400, LINE.V.c, { pop: op, solid: true, font: `900 24px ${MONO}`, h: 44 });
    badge('V', 960, 720, 44, { pop: PK(t, 'tExact', .5) });
    chip('3者で一番厳密', 1140, 720, LINE.V.c, { pop: PK(t, 'tBest', .5), solid: true, font: `900 28px ${FONT}`, h: 54 });
    ctx.restore();
  }
}

// ---- 非同期 ----
function sceneAsync(t) {
  mapPaper(t, { dots: .5 });
  // 1. 結果を待たずに次を撃てるか（2本の線: 待つ / 待たない）
  const s1 = seg(t, 'as1', 'as1');

    lanes.forEach(([y, s, c], li) => {

      txt(s, 300, y - 52, { font: `900 30px ${FONT}`, color: c, alpha: li ? PK(t, 'aFire', .4) : PK(t, 'aKey', .4) });
    });
    const lt = t - L('as1').start;
    for (let k = 0; k < 3; k++) {

    // キット: 整理券

    rr(180, 380, 110, 26, 6); ctx.fillStyle = '#0b0d10'; ctx.fill();
    for (let i = 0; i < 3; i++) {
      const p = PT(t, K('aTicket') + i * .22, .4);
      ticket(lerp(235, 420 + i * 140, E.out(p)), lerp(420, 380, E.out(p)), 101 + i, { pop: p, rot: [-6, 3, -2][i], color: LINE.S.c });
    }

    const gp = PK(t, 'aGo', .4);
    if (gp > 0) for (let i = 0; i < 3; i++) { const f = clamp((t - K('aGo') - i * .2) / 1.4); if (f < 1) train([[340, 560], [820, 560]], f * 1.15, LINE.S.c, { cars: 1, len: 50, w: 22, label: String(101 + i) }); }
    // あとから回収

    if (PK(t, 'aGot', .3) > 0) { chip('→ 結果', 560, 700, LINE.S.c, { pop: PK(t, 'aGot', .4), solid: true, font: `900 24px ${FONT}`, h: 42 }); mark('ok', 690, 700, 22, PK(t, 'aGot', .4)); }
    // VBAChromeDevProtocol: nowait は Private のまま
    const va = PF(t, 'as3', 0, .4);
    ctx.save(); ctx.globalAlpha *= va;
    badge('V', 950, 230, 26);
    txt('nowait', 990, 232, { font: `900 30px ${MONO}`, color: COL.ink, alpha: PK(t, 'aNw', .4) });
    // 柵の向こうの扉
    rr(1020, 300, 220, 230, 10); ctx.fillStyle = '#efe8d8'; ctx.fill(); ctx.strokeStyle = LINE.V.c; ctx.lineWidth = 4; ctx.stroke();
    txt('nowait', 1130, 420, { font: `900 30px ${MONO}`, align: 'center', color: LINE.V.c, alpha: PK(t, 'aNw', .4) });
    const pv = PK(t, 'aPriv', .5);

    ctx.globalAlpha = va;
    chip('Private', 1130, 580, COL.red, { pop: pv, solid: true, font: `900 24px ${MONO}`, h: 42 });
    txt('公開の入口: InvokeMethod', 940, 670, { font: `800 22px ${MONO}`, color: COL.ink, alpha: PK(t, 'aPub', .4) });
    txt('→ いつも結果を待つ', 940, 710, { font: `800 22px ${FONT}`, color: COL.sub, alpha: PK(t, 'aPub', .4) });
    mark('ng', 1300, 690, 22, PK(t, 'aNot', .4));
    ctx.restore();
    // vba-cdp-webdriver: なし

    txt('なし', 1610, 470, { font: `900 64px ${FONT}`, align: 'center', color: '#b8b0a0', alpha: PK(t, 'aNone', .4) });
    ctx.restore();
    ctx.restore();
  }
  // 5〜6. 覗き見: Pipe の窓 / WinHttp は届くまで止まる

    const tf = ((t - K('aPnp')) * .35) % 1;

    ctx.save(); ctx.globalAlpha *= PK(t, 'aPnp', .4); ctx.strokeStyle = COL.gold; ctx.lineWidth = 6; rr(460, 410, 120, 140, 12); ctx.stroke(); ctx.restore();
    txt('窓', 520, 610, { font: `900 26px ${FONT}`, align: 'center', color: COL.gold, alpha: PK(t, 'aPnp', .4) });
    txt('届いていなければ、素通り', 520, 700, { font: `900 30px ${FONT}`, align: 'center', color: COL.green, alpha: PT(t, K('aPnp') + .6, .4) });
    // 右: WinHttpWebSocketReceive（届くまで Excel ごと止まる）
    card(1000, 260, 800, 520, LINE.V.c, { pop: pk });
    txt('WinHttpWebSocketReceive', 1040, 316, { font: `900 28px ${MONO}`, color: COL.ink, alpha: PK(t, 'aWh', .4) });
    const fr = PK(t, 'aFreeze', .6);
    excelIcon(1200, 500, 140, { alpha: PK(t, 'aWh', .4) });
    if (fr > 0) {
      ctx.save(); ctx.globalAlpha *= fr; ctx.fillStyle = 'rgba(255,255,255,.7)'; rr(1120, 420, 160, 160, 20); ctx.fill(); ctx.restore();
      ctx.save(); ctx.globalAlpha *= fr; ctx.translate(1200, 500); ctx.rotate(t * 4); ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, 34, 0, 4.4); ctx.stroke(); ctx.restore();
      txt('（応答なし）', 1200, 620, { font: `900 30px ${FONT}`, align: 'center', color: COL.red, alpha: fr });
    }
    chip('覗き見なし', 1560, 420, COL.red, { pop: PK(t, 'aNoPeek', .4), solid: true, font: `900 24px ${FONT}`, h: 44 });
    txt('届くまで、戻ってこない', 1560, 500, { font: `900 26px ${FONT}`, align: 'center', color: COL.ink, alpha: PT(t, K('aNoPeek') + .3, .4) });
    ctx.restore();
  }
  // 7. 作者自身のコメント
  const s7 = seg(t, 'as7', 'as7');
  if (s7 > 0) {
    codeCard(200, 300, 1520, 'VBAChromeDevProtocol / clsWebSocket.cls : 608', ["DoEvents ' the WinHttpWebSocketReceive call will make the VBA Application", "         ' unresponsive until it returns, give slice back"], PF(t, 'as7', .05, 1.6), LINE.V.c, { alpha: s7, size: 28, hl: { 1: PK(t, 'aCmt', .3) > 0 ? COL.red : null }, w: 1480 });
    txt('「戻ってくるまで、応答不能になる」', 960, 560, { font: `900 40px ${FONT}`, align: 'center', color: COL.red, alpha: PK(t, 'aCmt', .4) * s7 });
  }
  // 8. キット: WinSock まで降りる → ioctlsocket で先に聞く
  const s8 = seg(t, 'as8', 'as8');
  if (s8 > 0) {
    ctx.save(); ctx.globalAlpha *= s8;
    const layers = [['VBA', COL.green], ['WinHTTP', '#7c8796'], ['WinSock（ws2_32.dll）', LINE.S.c]];

      const y = 260 + i * 150;

    ctx.restore();
  }
  // 9. まとめ
  const s9 = PF(t, 'as9', 0, .4);
  if (s9 > 0) {
    ctx.save(); ctx.globalAlpha *= s9;
    [['S', 'ok', 'ExecuteCDPAsync'], ['V', 'tri', 'nowait は Private'], ['W', 'ng', '仕組みなし']].forEach(([k, m, s], i) => {

    txt('分けたのは、覗き見があるかどうか', 960, 640, { font: `900 46px ${FONT}`, align: 'center', color: COL.ink, alpha: PK(t, 'aWhy', .5) });
    ctx.restore();
  }

// BGM と効果音（タイミングは timeline.js と、場面の K から）
// 主題は「発車メロディ」: 駅に着くたび（章の扉）にチェレスタで鳴り、最後は弦と一緒に大きく鳴る
// 楽器は鉄道の旅の音: 線路の継ぎ目（ガタン・ゴトン）、ブラシ、ウッドベース、エレピ、チェレスタ
// MP4 は全部を1本に合成する。HTML 版は BGM だけを bgm.mp3 にし、効果音はブラウザの中で鳴らす（liveSE）
const SR = 48000;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// 譜面を組み立てる。ac は OfflineAudioContext（書き出し）でも AudioContext（HTML 版の効果音）でもよい
//   mode: 'all'（全部）/ 'music'（BGM だけ）/ 'se'（効果音だけ）
//   off : ムービーの 0 秒が、ac の何秒にあたるか
function buildScore(ac, dest, mode = 'all', off = 0) {
  // 決まった乱数のノイズ
  let seed = 1357911;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x3fffffff - 1; };
  const noiseBuf = ac.createBuffer(1, SR * 3, SR);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd(); }
  const ir = ac.createBuffer(2, SR * 3, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = rnd() * Math.pow(1 - i / d.length, 3.2); }

  const master = ac.createDynamicsCompressor();
  master.threshold.value = -14; master.ratio.value = 3; master.attack.value = .01; master.release.value = .25;
  master.connect(dest);
  const verb = ac.createConvolver(); verb.buffer = ir;
  const verbOut = ac.createGain(); verbOut.gain.value = .32; verb.connect(verbOut); verbOut.connect(master);
  const music = ac.createGain(); music.gain.value = .78; music.connect(master);
  const sfx = ac.createGain(); sfx.gain.value = .7; sfx.connect(master);
  // 曲全体の音量の流れ（静かにしたい区間を作る）
  const musicLv = ac.createGain(); musicLv.connect(music);
  const lv = musicLv.gain;
  let curLv = 1, lastLv = 0;
  // 時刻順に呼ぶこと（前後すると音量の予定が壊れるので、ここで止める）
  const setLv = (t, v, ramp = .4) => {
    if (t - ramp < lastLv - 1e-6) throw new Error('setLv の順番が前後しています: ' + t.toFixed(2));
    const at = t + off, now = ac.currentTime;
    if (at <= now) lv.setValueAtTime(v, now);
    else { lv.setValueAtTime(curLv, Math.max(now, at - ramp)); lv.linearRampToValueAtTime(v, at); }
    curLv = v; lastLv = t;
  };
  lv.setValueAtTime(1, Math.max(ac.currentTime, off));

  const env = (g, t, a, peak, d) => {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(1e-4, t + a + d);
  };
  // 出力先へつなぎ、作ったノードを返す（鳴り終わったら切り離すため）。pan は -1（左）〜 1（右）
  const out = (node, dry, wet = 0, bus = musicLv, pan = 0) => {
    const g = ac.createGain(); g.gain.value = dry; node.connect(g);
    const ns = [node, g];
    let last = g;
    if (pan) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); last = p; ns.push(p); }
    last.connect(bus);
    if (wet > 0) { const w = ac.createGain(); w.gain.value = wet; last.connect(w); w.connect(verb); ns.push(w); }
    return ns;
  };
  const done = (src, ns) => { src.onended = () => ns.forEach(n => n.disconnect()); };

  // 音はすべて「時刻つきの予約」にしておき、少し先の分ずつ実体化する
  // 予約には種類（BGM か効果音か）があり、mode に合わないものは予約しない。nt は先頭から何個の引数が時刻か
  const EV = [];
  let running = false;
  const later = (fn, kindOf, nt = 1) => (...a) => {
    if (running) return fn(...a);
    const kind = typeof kindOf === 'function' ? kindOf(a) : kindOf;
    if (mode !== 'all' && kind !== mode) return;
    EV.push([a[0], () => { running = true; try { fn(...a.map((v, i) => i < nt ? v + off : v)); } finally { running = false; } }]);
  };
  const isSe = a => a[2]?.se;

  // ---- 楽器 ----
  // エレピ（FM: 同じ高さの変調で、打った瞬間だけ明るい）
  const ep = later((t, n, o = {}) => {
    const f = mtof(n), v = o.vol || .045, d = o.d || 1.3, bus = o.se ? sfx : musicLv;
    const car = ac.createOscillator(); car.frequency.value = f;
    const mod = ac.createOscillator(); mod.frequency.value = f;
    const mg = ac.createGain(); mg.gain.setValueAtTime(f * (o.idx || 1.6), t); mg.gain.exponentialRampToValueAtTime(f * .04, t + d * .5);
    mod.connect(mg); mg.connect(car.frequency);
    const g = ac.createGain(); env(g, t, .004, v, d);
    car.connect(g); done(car, [mod, mg, ...out(g, 1, o.wet ?? .3, bus, o.pan || 0)]);
    car.start(t); mod.start(t); car.stop(t + d + .05); mod.stop(t + d + .05);
  }, a => isSe(a) ? 'se' : 'music');
  // チェレスタ（主題の音色）と鐘
  const cel = later((t, n, o = {}) => {
    const bus = o.se ? sfx : musicLv;
    for (const [mul, k, dd] of [[1, 1, 1], [2, .25, .5], [4.02, .12, .25]]) {
      const osc = ac.createOscillator(); osc.type = 'sine'; osc.frequency.value = mtof(n) * mul;
      const g = ac.createGain(); env(g, t, .003, (o.vol || .05) * k, (o.d || 1.2) * dd);
      osc.connect(g); done(osc, out(g, 1, o.wet ?? .45, bus, o.pan || 0));
      osc.start(t); osc.stop(t + (o.d || 1.2) * dd + .05);
    }
  }, a => isSe(a) ? 'se' : 'music');
  const bell = later((t, n, o = {}) => {
    const bus = o.se ? sfx : musicLv;
    for (const [mul, k] of [[1, 1], [2.76, .3], [5.4, .1]]) {
      const osc = ac.createOscillator(); osc.type = 'sine'; osc.frequency.value = mtof(n) * mul;
      const g = ac.createGain(); env(g, t, .003, (o.vol || .05) * k, (o.d || 1.6) / (mul > 1 ? mul * .6 : 1));
      osc.connect(g); done(osc, out(g, 1, o.wet ?? .55, bus, o.pan || 0));
      osc.start(t); osc.stop(t + (o.d || 1.6) + .05);
    }
  }, a => isSe(a) ? 'se' : 'music');
  // 弦（のこぎり波を重ねてこもらせる）
  const pad = later((t0, t1, notes, o = {}) => {
    if (t1 <= t0) return;
    for (const n of notes) {
      for (const det of [-7, 6]) {
        const osc = ac.createOscillator(); osc.type = o.type || 'sawtooth'; osc.frequency.value = mtof(n); osc.detune.value = det;
        const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.cut || 900; f.Q.value = .4;
        if (o.cut2) { f.frequency.setValueAtTime(o.cut, t0); f.frequency.linearRampToValueAtTime(o.cut2, t1); }
        const g = ac.createGain();
        const a = Math.min(o.att ?? 1.2, (t1 - t0) / 2), v = o.vol || .04;
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + a);
        g.gain.setValueAtTime(v, Math.max(t0 + a, t1 - (o.rel ?? 1))); g.gain.linearRampToValueAtTime(0, t1);
        osc.connect(f); f.connect(g);
        done(osc, [f, ...out(g, 1, o.wet ?? .45, musicLv, det < 0 ? -.35 : .35)]);
        osc.start(t0); osc.stop(t1 + .05);
      }
    }
  }, 'music', 2);
  // ウッドベース（三角波をこもらせ、指で弾いた減衰）
  const bass = later((t, n, o = {}) => {
    const osc = ac.createOscillator(); osc.type = 'triangle'; osc.frequency.value = mtof(n);
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(260, t + .3);
    const g = ac.createGain(); env(g, t, .006, o.vol || .2, o.d || .5);
    osc.connect(f); f.connect(g); done(osc, [f, ...out(g, 1, .05, musicLv)]); osc.start(t); osc.stop(t + (o.d || .5) + .05);
  }, 'music');
  // 長い環境音（3秒より長いもの）は BGM 側に入れる
  const noise = later((t, d, o = {}) => {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    if (o.rate) s.playbackRate.value = o.rate;
    const f = ac.createBiquadFilter(); f.type = o.ft || 'highpass'; f.frequency.value = o.f || 7000; f.Q.value = o.q || .7;
    if (o.f2) { f.frequency.setValueAtTime(o.f, t); f.frequency.exponentialRampToValueAtTime(o.f2, t + d); }
    const g = ac.createGain(), v = o.vol || .05;
    if (o.swell) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + d * .7); g.gain.linearRampToValueAtTime(0, t + d); }
    else if (o.hold) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .1); g.gain.setValueAtTime(v, t + d - .1); g.gain.linearRampToValueAtTime(0, t + d); }
    else env(g, t, o.a || .002, v, d);
    s.connect(f); f.connect(g); done(s, [f, ...out(g, 1, o.wet || 0, o.bus || sfx, o.pan || 0)]);
    s.start(t, Math.abs(rnd()) * .5 + 1); s.stop(t + d + .05);
  }, a => a[2]?.bus === musicLv || a[1] > 3 ? 'music' : 'se');
  // 低いどすん（線路の継ぎ目・車止め・衝撃）
  const thump = later((t, v = .3, f0 = 90, o = {}) => {
    const osc = ac.createOscillator(); osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(f0 * .45, t + .12);
    const g = ac.createGain(); env(g, t, .002, v, o.d || .22);
    osc.connect(g); done(osc, out(g, 1, o.wet ?? 0, o.music ? musicLv : sfx)); osc.start(t); osc.stop(t + (o.d || .22) + .05);
  }, a => a[3]?.music ? 'music' : 'se');
  // ガタン・ゴトン（継ぎ目を2つの台車が越える）。BGM のリズムにもする
  const clack = (t, v = .08, music = true, pan = 0) => {
    for (const [o, k] of [[0, 1], [.12, .8]]) {
      thump(t + o, v * k, 85, { music, d: .12 });
      noise(t + o, .05, { ft: 'bandpass', f: 1100, q: 1.2, vol: v * .5 * k, bus: music ? musicLv : sfx, pan });
    }
  };

  const hat = (t, v = .015, pan = 0) => noise(t, .035, { f: 8000, vol: v, bus: musicLv, pan });
  const tick = (t, v = .04, pan = 0) => noise(t, .015, { f: 3200, vol: v, pan });

window.renderAudio = async function (mode = 'all') {
  const dur = TLD.duration + 1;
  const ac = new OfflineAudioContext(2, Math.ceil(dur * SR), SR);
  const { run } = buildScore(ac, ac.destination, mode);
  // 区切りごとに、その少し先までの予約を実体化する
  // （最初に全部つなぐと、鳴る前のノードまで毎回処理されて終わらない）
  const WIN = 4;
  run(WIN + .5);
  for (let w = WIN; w < dur; w += WIN) ac.suspend(w).then(() => { run(w + WIN + .5); ac.resume(); });
  const buf = await ac.startRendering();
  const L0 = buf.getChannelData(0), R0 = buf.getChannelData(1);
  const pcm = new Int16Array(L0.length * 2);
  for (let i = 0; i < L0.length; i++) {
    pcm[i * 2] = Math.max(-1, Math.min(1, L0[i])) * 32767;
    pcm[i * 2 + 1] = Math.max(-1, Math.min(1, R0[i])) * 32767;
  }
  window.__PCM = new Uint8Array(pcm.buffer);
  return { sampleRate: SR, bytes: window.__PCM.length };
};

// HTML 版の効果音: 再生位置 from から、ムービーの 0 秒 = ac の base 秒として、少し先の分ずつ鳴らす
window.liveSE = function (ac, dest) {
  let timer = 0, out = null;
  return {
    start(from, base) {
      this.stop();
      out = ac.createGain(); out.connect(dest);
      const sc = buildScore(ac, out, 'se', base);
      const step = () => sc.run(ac.currentTime - base + 1.5, from - .05);
      step(); timer = setInterval(step, 100);
    },
    stop() {
      clearInterval(timer);
      if (!out) return;
      const o = out, now = ac.currentTime;
      o.gain.setValueAtTime(o.gain.value, now); o.gain.linearRampToValueAtTime(0, now + .05);
      setTimeout(() => o.disconnect(), 300);
      out = null;
    },
  };
};

window.audioChunk = function (i, size) {
  const sub = window.__PCM.subarray(i * size, (i + 1) * size);
  let s = '';
  for (let k = 0; k < sub.length; k += 0x8000) s += String.fromCharCode.apply(null, sub.subarray(k, k + 0x8000));
  return btoa(s);
};

function startAudio(from) {
  stopAudio();
  const now = ac.currentTime + .06;
  base = now - from;
  if (bgm && from < bgm.duration) {
    const s = ac.createBufferSource(); s.buffer = bgm; s.connect(bgGain); s.start(now, from); srcs.push(s);
  }
  const g = bgGain.gain;
  g.cancelScheduledValues(0); g.setValueAtTime(BG, now);
  for (const [a, b] of DUCKS) {
    if (b < from) continue;
    const ta = base + a, tb = base + b;
    if (ta > now) { g.setValueAtTime(BG, ta); g.linearRampToValueAtTime(BG * DUCK, ta + .15); }
    else g.setValueAtTime(BG * DUCK, now);
    g.setValueAtTime(BG * DUCK, Math.max(now, tb)); g.linearRampToValueAtTime(BG, Math.max(now, tb) + .35);
  }
  for (const id of TLD.order) {
    const l = TLD.lines[id], buf = VO[id];
    if (!buf) continue;
    const off = Math.max(0, from - l.start);
    if (off >= buf.duration) continue;
    const s = ac.createBufferSource(); s.buffer = buf; s.connect(voGain);
    s.start(base + l.start + off, off); srcs.push(s);
  }
  se.start(from, base);
}

const cur = () => playing ? Math.min(DUR, ac.currentTime - base) : T;
async function play(fromStart) {
  if (!ready) return;
  cover = null;
  await ac.resume();
  if (fromStart || T >= DUR - .05) T = 0;
  startAudio(T);
  playing = true; $('#bPlay').textContent = '❚❚'; idle();
}
function pause() { T = cur(); stopAudio(); playing = false; $('#bPlay').textContent = '▶'; dirty = true; showCtl(); }
const toggle = () => playing ? pause() : play();
function seekTo(t) { cover = null; T = Math.max(0, Math.min(DUR, t)); if (playing) startAudio(T); dirty = true; }

function loop() {
  const t = cur();
  if (playing || dirty) {
    renderFrame(cover ?? t);
    $('#tm').textContent = `${fmt(t)} / ${fmt(DUR)}`;
    if (!seeking) $('#seek').value = t;
    dirty = false;
  }
  if (playing && t >= DUR) { pause(); T = DUR; }
  requestAnimationFrame(loop);
}

// 操作バーは、再生中に動きがなければ隠す
let hideTimer = 0;
function showCtl() { document.body.classList.remove('idle'); clearTimeout(hideTimer); }
function idle() { showCtl(); hideTimer = setTimeout(() => { if (playing) document.body.classList.add('idle'); }, 2500); }
addEventListener('pointermove', idle);

$('#bPlay').onclick = () => { $('#start')?.remove(); toggle(); };
$('#bRe').onclick = () => { $('#start')?.remove(); play(true); };
$('#bMute').onclick = () => { if (!bus) return; const m = bus.gain.value > 0; bus.gain.value = m ? 0 : 1; $('#bMute').textContent = m ? '🔇' : '🔊'; };
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); };
$('#seek').max = DUR;
$('#seek').oninput = e => { seeking = true; seekTo(+e.target.value); };
$('#seek').onchange = () => { seeking = false; };
addEventListener('keydown', e => {
  if (!ready) return;
  if (e.code === 'Space') { e.preventDefault(); $('#start')?.remove(); toggle(); }
  else if (e.key === 'r' || e.key === 'R') { $('#start')?.remove(); play(true); }
  else if (e.key === 'm' || e.key === 'M') $('#bMute').click();
  else if (e.key === 'f' || e.key === 'F') $('#bFull').click();
  else if (e.key === 'ArrowRight') seekTo(cur() + 5);
  else if (e.key === 'ArrowLeft') seekTo(cur() - 5);
});

loadAll().then(() => {
  ready = true;
  // 再生前は、タイトルの場面を表紙として見せる
  T = 0; cover = L('op5').end + 3.0; renderFrame(cover); dirty = false;
  const st = $('#start');
  st.classList.remove('loading');
  $('#startLbl').textContent = `▶ 再生（${Math.floor(DUR / 60)}分${Math.round(DUR % 60)}秒）`;
  st.onclick = () => { st.remove(); play(true); };
  $('#tm').textContent = `0:00 / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
});
</script>
