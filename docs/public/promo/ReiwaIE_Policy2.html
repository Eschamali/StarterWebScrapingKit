    pal: { g: '#86e05a', G: '#3f8f2a', s: '#fff1e6', e: '#2b2b2b', w: '#ffffff', b: '#c6f58f', m: '#e0607a', r: '#ff9aa8' },
    rows: [
      '.bb........bb.', 'bGGb......bGGb', '.bGGbgggggbGb.', '...gggggggggg.', '..gggggggggggg', '.ggssssssssssg', '.ggseeesseeesg',
      '.ggsewesseweg.', '.ggsssssssssg.', '.ggrsssmmssrg.', '..gsssssssssg.', '..gg.ssssss.gg', '..G...ssss..G.', '.......ss.....',
    ],
  },
};
function sprite(name, x, y, px, o = {}) {

  ctx.save(); ctx.globalAlpha *= (o.alpha ?? 1);
  sp.rows.forEach((row, j) => {
    [...row].forEach((ch, i) => {
      if (ch === '.') return;
      ctx.fillStyle = sp.pal[ch];
      ctx.fillRect(Math.round(x + i * px), Math.round(y + j * px), Math.ceil(px), Math.ceil(px));

}
const SPK = {
  t: { name: 'tsumugi', tag: 'TSUMUGI', role: '主任', col: C.yel },
  z: { name: 'zundamon', tag: 'ZUNDAMON', role: '見習い', col: C.grn },
};

// シーンの表と、時刻に結びつく出来事（揺れ・効果音）。各シーンのファイルが書き足す
// CELL: 区画の中身（区画の座標で描く）/ OV: 画面に重ねる絵 / CAMK: カメラの動き / STRINGS: 区画をまたぐ赤い糸
const CELL = {}, OV = {}, CAMK = {}, STRINGS = [], HITS = [], SEQ = [];
const cue = (t, kind, o = {}) => SEQ.push([t, kind, o]);
const hit = (t, k = 10) => HITS.push([t, k]);

// 1フレームの合成: ボード（カメラ越し）→ 電気スタンドの光とブラインドの影 → 画面に重ねる絵 → 章のテロップ → HUD → 字幕
// 録画を使うフレームでは、VID.begin / VID.end で使わなかったクリップを止める

// ---------- ボードの区画 ----------
// 左上から右へ、2段目は右から左へ、3段目はまた右へ（赤い糸が蛇行する）
const PX = 2200, PY = 1360, BM = 240;
const GRID = [
  ['title', 'report', 'repro', 'direct', 'policy', 'evidence'],
  ['answer', 'fix', 'edge', 'rollback', 'culprit', 'minimal'],
  ['race', 'blackbox', 'why', 'future', 'year', 'ending'],
];
const CELLPOS = {};
GRID.forEach((row, r) => row.forEach((id, c) => { CELLPOS[id] = [BM + c * PX, BM + r * PY]; }));
const BW = BM * 2 + 5 * PX + 1920, BH = BM * 2 + 2 * PY + 1080;
const ZALL = Math.min(1920 / BW, 1080 / BH) * .96;
const wp = (sid, x, y) => [CELLPOS[sid][0] + x, CELLPOS[sid][1] + y];

// 章の名前（区画の見出しとテロップ）
const CHAP = {
  report: [1, '通報'], repro: [2, '現場検証'], direct: [3, '裏取り'], policy: [4, '聞き込み'], evidence: [5, '物証'],
  minimal: [6, '再現実験'], culprit: [7, '真犯人'], rollback: [8, '経緯'], edge: [9, '消去法'], fix: [10, '応急処置'],
  answer: [11, '答え合わせ'], race: [12, '勝負の行方'], blackbox: [13, '捜査の勘'], why: [14, '動機'], future: [15, '見立て'],
  year: [16, '余罪'], ending: [17, '終章'],
};
const KN = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
const kanji = n => n <= 10 ? KN[n] : n < 20 ? '十' + KN[n - 10] : String(n);
const chapLabel = sid => sid === 'ending' ? '終章' : `第${kanji(CHAP[sid][0])}章`;

function sceneAt(t) {
  let id = TLD.sceneOrder[0];
  for (const s of TLD.sceneOrder) if (t >= TLD.scenes[s].start) id = s;
  return id;
}
const T_LAMP = () => L('op10').start;
const T_PULL = () => L('en14').end + .8;

// ---------- カメラ ----------
// CAMK[sid] = [[時刻, x, y, 倍率, 動く秒数], ...]（区画の座標）。先頭には区画の真ん中・等倍が入る
const TR = 1.35;
function camIn(sid, t) {
  const s = S(sid);
  const ks = [[s.start, 960, 540, 1, 0], ...(CAMK[sid] || [])];
  let [, x, y, z] = ks[0];
  for (let i = 1; i < ks.length; i++) {
    const [t0, x1, y1, z1, d = .9] = ks[i];
    if (t < t0) break;
    const k = E.io(PT(t, t0, d));
    x = lerp(x, x1, k); y = lerp(y, y1, k); z = lerp(z, z1, k);
  }
  const [ox, oy] = CELLPOS[{ credits: 'ending', open: 'title' }[sid] || sid];
  // ゆっくり漂う（手持ちのカメラ）
  return [ox + x + Math.sin(t * .23) * 6, oy + y + Math.cos(t * .19) * 5, z];
}
function camAt(t) {
  const sid = sceneAt(t), s = S(sid);
  let cam;
  if (sid === 'credits') cam = camIn('ending', t);
  else cam = camIn(sid, t);
  const i = TLD.sceneOrder.indexOf(sid);
  if (i > 0 && sid !== 'credits' && t < s.start + TR) {
    const prev = TLD.sceneOrder[i - 1];
    const a = camIn(prev, s.start), b = camIn(sid, s.start);
    const k = E.io(PT(t, s.start, TR));
    const dip = 1 - .5 * Math.sin(Math.PI * k);
    cam = [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k) * dip];
  }
  // 終わり: ボード全体まで引く
  if (t > T_PULL()) {
    const k = E.io(PT(t, T_PULL(), 5.5));
    cam = [lerp(cam[0], BW / 2, k), lerp(cam[1], BH / 2 + 40, k), Math.exp(lerp(Math.log(cam[2]), Math.log(ZALL), k))];
  }
  return cam;
}
function shakeAt(t) {
  let x = 0, y = 0;
  for (const [t0, k] of HITS) {
    const d = t - t0;
    if (d < 0 || d > .45) continue;
    const a = k * Math.pow(1 - d / .45, 2);
    x += Math.sin(d * 90 + t0) * a; y += Math.cos(d * 70 + t0 * 3) * a;
  }
  return [x, y];
}

// ---------- ボード ----------
function drawBoard(vx, vy, vw, vh) {
  // 木の枠
  ctx.fillStyle = '#3b2616'; ctx.fillRect(-60, -60, BW + 120, BH + 120);
  ctx.fillStyle = '#5a3a20'; ctx.fillRect(-36, -36, BW + 72, BH + 72);
  if (!CORKPAT) CORKPAT = ctx.createPattern(CORK, 'repeat');
  const x0 = Math.max(0, vx), y0 = Math.max(0, vy), x1 = Math.min(BW, vx + vw), y1 = Math.min(BH, vy + vh);
  if (x1 > x0 && y1 > y0) { ctx.fillStyle = CORKPAT; ctx.fillRect(x0, y0, x1 - x0, y1 - y0); }
}
function drawCells(t, vx, vy, vw, vh) {
  for (const sid in CELLPOS) {
    if (!CELL[sid]) continue;
    const st = sid === 'title' ? 0 : S(sid).start - .05;
    if (t < st) continue;
    const [ox, oy] = CELLPOS[sid];
    if (ox + 2100 < vx || ox - 180 > vx + vw || oy + 1240 < vy || oy - 160 > vy + vh) continue;
    ctx.save(); ctx.translate(ox, oy);
    if (sid !== 'title') chapterCard(t, S(sid).start + TR * .55, CHAP[sid][0], CHAP[sid][1]);
    CELL[sid](t, sid === 'title' ? null : S(sid));
    ctx.restore();
  }
}
// 糸: 章の見出しカードどうしを順につなぐ。ほかの糸は STRINGS（{a:[sid,x,y], b:[sid,x,y], t0, d}）
function drawStrings(t) {
  const order = TLD.sceneOrder.filter(s => CELLPOS[s] && s !== 'open');
  let prev = 'title', pp = [1500, 150];
  for (const sid of order) {
    const s = S(sid);
    if (t < s.start) break;
    const a = wp(prev, ...pp), b = wp(sid, ...CHAPTER_PIN);
    thread(a[0], a[1], b[0], b[1], E.io(PT(t, s.start + .05, TR * .9)), { sag: 120 });
    prev = sid; pp = CHAPTER_PIN;
  }
  for (const st of STRINGS) {
    if (t < st.t0) continue;
    const a = wp(...st.a), b = wp(...st.b);
    thread(a[0], a[1], b[0], b[1], E.io(PT(t, st.t0, st.d || 1.4)), { sag: st.sag, color: st.color });
  }
}

// ---------- 光と影 ----------
function lighting(t, sid) {
  // 電気スタンドの暖かい光（真ん中が明るく、四隅が暗い）
  const g = ctx.createRadialGradient(W / 2, H * .42, 120, W / 2, H * .5, W * .78);
  g.addColorStop(0, 'rgba(255,214,150,.06)'); g.addColorStop(.55, 'rgba(20,10,0,.12)'); g.addColorStop(1, 'rgba(0,0,0,.62)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 窓のブラインドの影（ゆっくり動く）
  ctx.save(); ctx.globalAlpha = .13 * (1 - PT(t, T_PULL(), 3));
  ctx.translate(W / 2, H / 2); ctx.rotate(-.3);
  ctx.fillStyle = '#000014';
  const off = (t * 7) % 128;
  for (let y = -1400; y < 1400; y += 128) ctx.fillRect(-1600, y + off, 3200, 58);
  ctx.restore();
  // 冒頭: 明かりがつくまでは暗い部屋
  const tl = T_LAMP();
  let dark = t < tl ? .9 : .9 * (1 - PT(t, tl + .1, .5));
  if (t >= tl && t < tl + .45) dark = [.9, .3, .8, .15, .55, .05][Math.floor((t - tl) / .075)] ?? 0;
  if (dark > 0) { ctx.fillStyle = `rgba(2,3,6,${dark})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- 章のテロップ（サスペンスドラマの章題） ----------
function telop(t, sid, s) {
  if (!CHAP[sid]) return;
  const t0 = s.start + .15, a = PT(t, t0, .18) * (1 - PT(t, s.start + 1.85, .35));

  ctx.save(); ctx.globalAlpha = a;
  const k = E.out(PT(t, t0, .5));

  ctx.fillStyle = C.red; ctx.fillRect(0, 440, W * k, 5); ctx.fillRect(W * (1 - k), 635, W * k, 5);
  ctx.restore();
  const lab = chapLabel(sid);
  txt(`CHAPTER ${String(CHAP[sid][0]).padStart(2, '0')}`, W / 2, 482, { font: `400 26px ${TYPE}`, color: '#c9b9a0', align: 'center', alpha: a, ls: 8 });
  txt(`${lab}　${CHAP[sid][1]}`, W / 2 + (1 - k) * 60, 562, { font: `800 84px ${MIN}`, color: '#fff', align: 'center', alpha: a, ls: 10 });
}

// ---------- HUD ----------
const TW0 = () => L('rp10').end - .2, TW1 = () => L('cu2').start + .9;
function watchSec(t) { return t < TW0() ? null : Math.min(1800, (t - TW0()) / (TW1() - TW0()) * 1800); }
function drawHUD(t, sid) {
  const a = PT(t, S('report').start, .8) * (1 - PT(t, T_PULL() - .5, .6));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, 0, 0, 78);
  g.addColorStop(0, 'rgba(6,5,4,.9)'); g.addColorStop(1, 'rgba(6,5,4,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 78);
  ctx.restore();
  txt('CASE FILE No.02', 40, 34, { font: `400 24px ${TYPE}`, color: '#d8c8ad', alpha: a, ls: 3 });
  txt('ポリシーの壁 #2　1分の沈黙', 300, 34, { font: `800 28px ${MIN}`, color: '#fff', alpha: a });
  if (CHAP[sid]) {
    txt(`${chapLabel(sid)}　${CHAP[sid][1]}`, 960 + 140, 34, { font: `800 28px ${MIN}`, color: '#ffcf8a', alpha: a, align: 'center' });
    // 進み具合（17区画の点）
    for (let i = 1; i <= 17; i++) {
      const on = CHAP[sid][0] === i, done = CHAP[sid][0] > i;
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = on ? C.red : done ? '#d8c8ad' : 'rgba(216,200,173,.25)';
      ctx.beginPath(); ctx.arc(1328 + i * 13, 35, on ? 5 : 3.5, 0, 7); ctx.fill(); ctx.restore();
    }
  }
  // 捜査のストップウォッチ（勝負しよっか → 発表にたどり着くまで、約30分）
  const sec = watchSec(t);
  const stopped = t >= TW1();
  const blink = stopped && t < TW1() + 1.6 && Math.floor((t - TW1()) * 4) % 2 === 0;
  const label = sec == null ? '--:--' : `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = stopped ? C.red : '#d8c8ad'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(1622, 35, 16, 0, 7); ctx.stroke();
  const ang = sec == null ? -Math.PI / 2 : -Math.PI / 2 + (sec % 60) / 60 * Math.PI * 2;
  ctx.beginPath(); ctx.moveTo(1622, 35); ctx.lineTo(1622 + Math.cos(ang) * 12, 35 + Math.sin(ang) * 12); ctx.stroke();
  ctx.fillStyle = ctx.strokeStyle; ctx.fillRect(1617, 14, 10, 5); ctx.restore();
  txt('捜査', 1652, 35, { font: `700 22px ${JP}`, color: '#d8c8ad', alpha: a });
  if (!blink) txt((stopped ? '約' : '') + label, 1880, 34, { font: `700 30px ${CODE}`, color: stopped ? '#ff8a8a' : '#fff', alpha: a, align: 'right' });
}

// ---------- 字幕（捜査記録） ----------
const WRAP = {};
function wrapLine(id, s, font, maxW) {
  if (WRAP[id]) return WRAP[id];
  ctx.save(); ctx.font = font;
  let rows = [s];
  if (ctx.measureText(s).width > maxW) {
    let best = -1;
    for (const marks of ['、。！？）」…', ' ']) {
      let bestD = 1e9;
      for (let i = 1; i < s.length - 1; i++) {
        if (!marks.includes(s[i - 1])) continue;
        const w1 = ctx.measureText(s.slice(0, i)).width, w2 = ctx.measureText(s.slice(i)).width;
        if (w1 > maxW || w2 > maxW) continue;
        const d = Math.abs(w1 - w2);
        if (d < bestD) { bestD = d; best = i; }
      }
      if (best >= 0) break;
    }
    if (best < 0) { let i = s.length; while (i > 1 && ctx.measureText(s.slice(0, i)).width > maxW) i--; best = i; }
    rows = [s.slice(0, best).trimEnd(), s.slice(best).trimStart()];
  }
  ctx.restore();
  return (WRAP[id] = rows);
}
function curLine(t) {
  let cur = null;
  for (const id of TLD.order) { const l = TLD.lines[id]; if (l.start - .12 <= t) cur = id; else break; }
  return cur;
}
function drawCaption(t) {
  if (window.__cover) return;
  const id = curLine(t);
  if (!id) return;
  const l = L(id);
  const idx = TLD.order.indexOf(id);
  const next = TLD.order[idx + 1];
  const until = Math.min(next ? L(next).start - .12 : TLD.scenes[l.scene].end, l.end + 2.2);
  if (t > until) return;
  const sp = SPK[l.spk];
  const a = PT(t, l.start - .12, .15) * (1 - PT(t, until - .25, .25));
  if (a <= 0) return;
  const x0 = 70, y0 = 884, w0 = 1780, h0 = 168;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(14,11,8,.88)'; rr(x0, y0, w0, h0, 10); ctx.fill();
  ctx.fillStyle = sp.col; ctx.fillRect(x0, y0 + 10, 7, h0 - 20);
  ctx.strokeStyle = 'rgba(216,200,173,.35)'; ctx.lineWidth = 1.5; rr(x0, y0, w0, h0, 10); ctx.stroke();
  // アバター（写真の枠に入れる）
  ctx.fillStyle = '#f2ece0'; ctx.fillRect(x0 + 24, y0 + 14, 140, 140);
  ctx.fillStyle = hexA(sp.col, .25); ctx.fillRect(x0 + 30, y0 + 20, 128, 128);
  ctx.restore();
  const talking = t < l.end && Math.floor(t * 9) % 2 === 0;
  sprite(sp.name, x0 + 31, y0 + 21 + (talking ? -2 : 0), 9, { alpha: a });
  txt(sp.tag, x0 + 192, y0 + 32, { font: `400 24px ${TYPE}`, color: sp.col, alpha: a, ls: 3 });
  txt(sp.role, x0 + 192 + tw(sp.tag, `400 24px ${TYPE}`, 3) + 16, y0 + 33, { font: `700 20px ${JP}`, color: '#bfb4a2', alpha: a });
  if (t < l.end) {
    for (let i = 0; i < 16; i++) {
      const v = Math.abs(Math.sin(t * 13 + i * 1.3) * Math.sin(t * 7.1 + i * .7));
      ctx.save(); ctx.globalAlpha = a * .75; ctx.fillStyle = sp.col;
      ctx.fillRect(x0 + 470 + i * 9, y0 + 32 - v * 13, 5, Math.max(2, v * 26)); ctx.restore();
    }
  }
  const font = `700 44px ${JP}`;
  const rows = wrapLine(id, l.text, font, 1540);
  const total = rows.join('').length;
  const p = PT(t, l.start, Math.max(.35, (l.end - l.start) * .55));
  let left = Math.floor(total * p), cur = false;
  rows.forEach((r, i) => {
    const n = Math.min(r.length, left); left -= n;
    const y = y0 + (rows.length === 1 ? 104 : 82 + i * 54);
    const here = !cur && (n < r.length || i === rows.length - 1);
    if (here) cur = true;
    typed(r.slice(0, n), x0 + 192, y, 1, { font, color: '#fbf7ee', alpha: a, cursor: here && (n < r.length || t < l.end), ccol: sp.col, t });
    if (n < r.length) left = 0;
  });
}

// ---------- 1フレーム ----------
function renderFrame(t) {
  t = clamp(t, 0, TLD.duration);
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
  VID.begin();
  ctx.fillStyle = C.room; ctx.fillRect(0, 0, W, H);
  const sid = sceneAt(t), s = S(sid);
  const [cx, cy, z] = camAt(t);
  const [sx, sy] = shakeAt(t);
  CAMZ = z;
  const vw = W / z, vh = H / z, vx = cx - vw / 2, vy = cy - vh / 2;
  ctx.save();
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(z, z); ctx.translate(-cx, -cy);
  drawBoard(vx, vy, vw, vh);
  drawCells(t, vx, vy, vw, vh);
  drawStrings(t);
  ctx.restore();
  lighting(t, sid);
  if (OV[sid]) { ctx.save(); ctx.translate(sx * .5, sy * .5); OV[sid](t, s); ctx.restore(); }
  telop(t, sid, s);
  drawHUD(t, sid);
  drawCaption(t);
  for (const [t0, col, d, k] of FLASHES) if (t >= t0 && t < t0 + d) flash(col, (k ?? .6) * (1 - (t - t0) / d));
  VID.end();
}
const FLASHES = [];
const flashAt = (t0, col = '#fff', d = .35, k = .6) => FLASHES.push([t0, col, d, k]);
// 確認用（静止画）: 録画のコマがそろうのを待ってから描く
window.renderAt = async t => { renderFrame(t); await VID.settle(); renderFrame(t); return true; };

// 冒頭（録画で見せる1分の沈黙 → 明かりがつき、事件ファイルと題名）・通報・現場検証・裏取り・聞き込み

// 証拠映像のモニター（画面の座標）。ct: 録画の秒、src: 録画の切り抜き範囲
function monitor(t, a, x, y, w, h, ct, rate, src, label, id = 'bug') {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(0,0,0,.5)'; rr(x + 10, y + 16, w, h, 14); ctx.fill();
  ctx.fillStyle = '#121418'; rr(x - 14, y - 14, w + 28, h + 28, 16); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  footage(ct, rate, src, x, y, w, h, id);
  // 走査線と、少し青い映像の色
  ctx.fillStyle = 'rgba(20,40,70,.06)'; ctx.fillRect(x, y, w, h);
  ctx.globalAlpha = a * .07; ctx.fillStyle = '#000';
  for (let yy = y; yy < y + h; yy += 4) ctx.fillRect(x, yy, w, 1.5);
  ctx.restore();
  ctx.restore();
  // ラベルと REC
  if (label) {
    chip(label, x + 18, y + 34, { font: `400 22px ${TYPE}`, fill: 'rgba(0,0,0,.65)', color: '#f4e6c8', h: 40, alpha: a });
    if (Math.floor(t * 1.6) % 2 === 0) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(x + w - 120, y + 34, 9, 0, 7); ctx.fill(); ctx.restore(); }
    txt('REC', x + w - 100, y + 35, { font: `400 24px ${TYPE}`, color: '#ff6b6b', alpha: a });
  }
}
// 録画の中の位置を、モニターの画面の位置へ
const monPt = (src, x, y, w, h, px, py) => [x + (px - src[0]) / src[2] * w, y + (py - src[1]) / src[3] * h];
const lerpR = (a, b, k) => a.map((v, i) => lerp(v, b[i], k));
// 録画の経過（PAD のステータスの数字。実行の開始は録画の 4.0 秒あたり）
const padSec = ft => Math.max(0, ft - 4.0);
const mmss = s => `00:${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// 端末（黒い画面に1行のコマンド）
function termCard(t, t0, x, y, w, h, cmd, typeFrom, o = {}) {
  return card(t, t0, x, y, w, h, { rot: o.rot ?? 0, fill: '#0c0f14', pinCol: o.pinCol || '#ffcc00', r: 10, flat: true }, (w2, h2) => {

    txt(o.title || 'コマンド', 20, 23, { font: `600 20px ${JP}`, color: '#9aa4b5' });
    const n = Math.floor(clamp((t - typeFrom) * (o.rate || 34), 0, cmd.length));
    const font = `700 ${o.fs || 30}px ${CODE}`;
    const rows = wrap(cmd, font, w2 - 70);
    let left = n;
    rows.forEach((r, i) => { const k = Math.min(r.length, left); left -= k; txt((i ? '  ' : '> ') + r.slice(0, k), 24, 82 + i * (o.fs || 30) * 1.4, { font, color: i ? '#9be28a' : '#e6e9ef' }); });
    if (n < cmd.length && Math.floor(t * 3) % 2 === 0) { ctx.fillStyle = '#9be28a'; ctx.fillRect(w2 - 40, h2 - 40, 16, 26); }
  });
}

};
// 主題（2小節）: [拍, 音, 長さ]
const THEME = [[0, 64, .5], [.75, 67, .25], [1, 69, .5], [1.5, 70, .25], [1.75, 71, .75], [3, 74, .5], [3.5, 71, .5],
  [4, 76, .75], [5, 74, .25], [5.25, 71, .5], [6, 69, .5], [6.5, 67, .5], [7, 64, 1]];
// ベースの型（16分の位置, 半音, 長さ（16分）, 強さ）
const FUNK = [[0, 0, 2, 1], [3, 12, 1, .7], [4, 0, 1, .55], [6, 10, 1, .8], [7, 12, 1, .7], [8, 0, 2, .9], [11, 7, 1, .7], [12, 10, 2, .8], [14, 12, 1, .7], [15, 3, 1, .55]];
const WALK = [[0, 0], [2, 3], [4, 5], [6, 6], [8, 7], [10, 6], [12, 5], [14, 3]];

function buildScore(ac, dest, mode = 'all', off = 0) {
  let seed = 24680;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const noiseBuf = ac.createBuffer(1, SR * 2, SR);
  { const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  const ir = ac.createBuffer(2, SR * 2.4, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.pow(1 - i / d.length, 3.6); }

  const master = ac.createDynamicsCompressor();
  master.threshold.value = -16; master.ratio.value = 3.5; master.attack.value = .006; master.release.value = .2;
  master.connect(dest);
  const verb = ac.createConvolver(); verb.buffer = ir;
  const verbOut = ac.createGain(); verbOut.gain.value = .28; verb.connect(verbOut); verbOut.connect(master);
  const dly = ac.createDelay(1); dly.delayTime.value = BEAT * .75;
  const fb = ac.createGain(); fb.gain.value = .3; dly.connect(fb); fb.connect(dly);
  const dlyOut = ac.createGain(); dlyOut.gain.value = .22; dly.connect(dlyOut); dlyOut.connect(master);
  const music = ac.createGain(); music.gain.value = .55; music.connect(master);
  const sfx = ac.createGain(); sfx.gain.value = .75; sfx.connect(master);
  const EV = [];
  const at = (t, fn) => EV.push([t, fn]);
  const T = t => t + off;

  // ---------- 音の部品 ----------
  const g = (dst, v = 1) => { const x = ac.createGain(); x.gain.value = v; x.connect(dst); return x; };
  const env = (gn, t, a, peak, d, hold = 0) => {
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(peak, t + a);
    gn.gain.setValueAtTime(peak, t + a + hold); gn.gain.exponentialRampToValueAtTime(.0001, t + a + hold + d);
  };
  const osc = (type, f, t, d, dst) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.connect(dst); o.start(t); o.stop(t + d + .05); return o; };
  const noise = (t, d, dst, rate = 1) => { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rate; s.loop = true; s.connect(dst); s.start(t, rnd()); s.stop(t + d + .05); return s; };
  const filt = (type, f, q, dst) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dst); return b; };
  const send = (src, amt, to) => { const x = ac.createGain(); x.gain.value = amt; src.connect(x); x.connect(to); };

  // 打楽器
  const kick = (t, v = .9, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .002, v, .28);
    const o = osc('sine', 140, T(t), .35, gn); o.frequency.setValueAtTime(150, T(t)); o.frequency.exponentialRampToValueAtTime(45, T(t) + .1);
    const c = g(out, 0); env(c, T(t), .001, v * .2, .015); noise(T(t), .02, filt('highpass', 2500, .7, c));
  };
  const snare = (t, v = .32, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .001, v, .13); noise(T(t), .16, filt('bandpass', 2300, .9, gn));
    const tg = g(out, 0); env(tg, T(t), .001, v * .55, .06); osc('triangle', 210, T(t), .08, tg);
    send(gn, .2, verb);
  };
  const hat = (t, v = .06, open = false, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .001, v, open ? .2 : .03); noise(T(t), open ? .26 : .05, filt('highpass', 8500, .7, gn));
  };
  const shaker = (t, v = .03) => { const gn = g(music, 0); env(gn, T(t), .01, v, .05); noise(T(t), .08, filt('bandpass', 6500, 1.2, gn)); };
  const conga = (t, f = 220, v = .2) => {
    const gn = g(music, 0); env(gn, T(t), .001, v, .2);
    const o = osc('sine', f, T(t), .25, gn); o.frequency.setValueAtTime(f * 1.35, T(t)); o.frequency.exponentialRampToValueAtTime(f, T(t) + .03);
    const n = g(music, 0); env(n, T(t), .001, v * .25, .02); noise(T(t), .03, filt('bandpass', 1800, 2, n));
  };
  const cymbal = (t, v = .12) => { const gn = g(music, 0); env(gn, T(t), .002, v, 1.8); noise(T(t), 2, filt('highpass', 5200, .6, gn)); send(gn, .4, verb); };
  const timp = (t, m = 40, v = .4) => {
    const gn = g(music, 0); env(gn, T(t), .004, v, .9);
    const o = osc('sine', mtof(m), T(t), 1, gn); o.frequency.setValueAtTime(mtof(m) * 1.04, T(t)); o.frequency.exponentialRampToValueAtTime(mtof(m), T(t) + .08);
    osc('sine', mtof(m) * 1.5, T(t), .4, g(gn, .25));
    const n = g(music, 0); env(n, T(t), .002, v * .2, .15); noise(T(t), .2, filt('lowpass', 900, .7, n));
    send(gn, .4, verb);
  };
  // ベース（ピック弾きに近い、はっきりした立ち上がり）
  const bass = (t, m, d, v = .2, cut = 700) => {
    const gn = g(music, 0); env(gn, T(t), .003, v, Math.max(.08, d * .85));
    const f = filt('lowpass', cut, 5, gn); f.frequency.setValueAtTime(cut * 3, T(t)); f.frequency.exponentialRampToValueAtTime(cut * .6, T(t) + .12);
    osc('sawtooth', mtof(m), T(t), d, f); osc('square', mtof(m - 12), T(t), d, g(f, .55));
  };
  // クラビネット（ワウで開く）
  const clav = (t, notes, d = .12, v = .045) => {
    const gn = g(music, 0); env(gn, T(t), .002, v, d);
    const f = filt('bandpass', 900, 4, gn); f.frequency.setValueAtTime(700, T(t)); f.frequency.exponentialRampToValueAtTime(2600, T(t) + .07);
    for (const m of notes) osc('square', mtof(m), T(t), d + .05, f);
    send(gn, .25, dly);
  };
  // ギターのカッティング（ミュートした「チャッ」）
  const chick = (t, v = .05) => { const gn = g(music, 0); env(gn, T(t), .001, v, .035); noise(T(t), .05, filt('bandpass', 2200, 2.5, gn)); };
  // ブラス隊（のこぎり波3本、開いてから少し閉じるフィルター）
  const brass = (t, m, d, v = .06, cut = 3200) => {
    const gn = g(music, 0); gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(v, T(t) + .025);
    gn.gain.setValueAtTime(v * .85, T(t) + Math.max(.05, d - .06)); gn.gain.linearRampToValueAtTime(0, T(t) + d + .06);
    const f = filt('lowpass', cut, 1.5, gn); f.frequency.setValueAtTime(500, T(t)); f.frequency.exponentialRampToValueAtTime(cut, T(t) + .05); f.frequency.exponentialRampToValueAtTime(cut * .6, T(t) + d);
    for (const det of [-9, 0, 8]) { const o = osc('sawtooth', mtof(m), T(t), d + .1, f); o.detune.value = det; }
    send(gn, .35, verb);
  };
  const stab = (t, notes, v = .045, d = .16) => notes.forEach(m => brass(t, m, d, v));
  // 弦（パッド・トレモロ）
  const pad = (t, d, notes, v = .03, cut = 1100) => {
    const gn = g(music, 0);
    gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(v, T(t) + Math.min(.8, d * .3));
    gn.gain.setValueAtTime(v, T(t) + d - Math.min(.8, d * .3)); gn.gain.linearRampToValueAtTime(0, T(t) + d + .4);
    const f = filt('lowpass', cut, .8, gn);
    for (const m of notes) for (const det of [-8, 8]) { const o = osc('sawtooth', mtof(m), T(t), d + .5, f); o.detune.value = det; }
    send(gn, .6, verb);
  };
  const trem = (t, d, notes, v = .03, cut = 1600) => {
    const gn = g(music, 0);
    gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(v, T(t) + .3);
    gn.gain.setValueAtTime(v, T(t) + d - .2); gn.gain.linearRampToValueAtTime(0, T(t) + d + .2);
    const am = g(gn, 0); const lfo = osc('sine', 9, T(t), d + .3, g(am.gain, .5)); am.gain.value = .5;
    const f = filt('lowpass', cut, .7, am);
    for (const m of notes) for (const det of [-6, 6]) { const o = osc('sawtooth', mtof(m), T(t), d + .3, f); o.detune.value = det; }
    send(gn, .5, verb);
  };
  // 低いピアノの一撃（サスペンス）
  const piano = (t, m, d = 2, v = .12) => {
    const gn = g(music, 0); env(gn, T(t), .003, v, d);
    osc('triangle', mtof(m), T(t), d, gn); osc('sine', mtof(m + 12), T(t), d * .6, g(gn, .35)); osc('sine', mtof(m + 19), T(t), d * .3, g(gn, .12));
    send(gn, .5, verb);
  };
  // エレピ（鈴のような立ち上がりと、ゆれ）
  const rhodes = (t, m, d = 1, v = .05) => {
    const gn = g(music, 0); env(gn, T(t), .004, v, d);
    const tr = g(gn, .8); const lfo = osc('sine', 4.5, T(t), d + .2, g(tr.gain, .2));
    osc('sine', mtof(m), T(t), d + .1, tr);
    const tine = g(gn, 0); env(tine, T(t), .001, .5, .25); osc('sine', mtof(m + 24) * 1.002, T(t), .3, tine);
    send(gn, .35, verb);
  };
  const riser = (t, d, v = .08) => {
    const gn = g(music, 0); gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(v, T(t) + d); gn.gain.linearRampToValueAtTime(0, T(t) + d + .05);
    const f = filt('bandpass', 400, 3, gn); f.frequency.setValueAtTime(300, T(t)); f.frequency.exponentialRampToValueAtTime(8000, T(t) + d);
    noise(T(t), d, f); send(gn, .5, verb);
  };
  const boom = (t, v = .7, out = music) => {
    const gn = g(out, 0); env(gn, T(t), .003, v, 1.3);
    const o = osc('sine', 80, T(t), 1.4, gn); o.frequency.setValueAtTime(90, T(t)); o.frequency.exponentialRampToValueAtTime(32, T(t) + 1.1);
    const n = g(out, 0); env(n, T(t), .002, v * .35, .5); noise(T(t), .6, filt('lowpass', 1600, .7, n));
    send(n, .6, verb);
  };

  // ---------- 曲 ----------
  // 種類ごとの音量（声の後ろで、区画どうしの差が大きくなりすぎないように）
  const LEVEL = { main: .63, groove: .7, denoue: .53, triumph: .7, credits: .72, clockwork: .8, mystery: 2.4, walk: 1.33, gloom: 1.1, chill: .9, bright: .85 };
  if (mode !== 'se') {
    for (const [t0, t1, kind] of sections()) music.gain.setTargetAtTime(.55 * (LEVEL[kind] ?? 1), T(Math.max(0, t0 - .05)), .03);
    for (const [t0, t1, kind, tr] of sections()) {
      if (t1 <= t0) continue;
      const nb = Math.ceil((t1 - t0) / BAR - .01);
      for (let b = 0; b < nb; b++) {
        const bt = t0 + b * BAR;
        if (bt >= t1 - .05) break;
        const rest = Math.min(BAR, t1 - bt);
        at(bt - .1, () => bar(kind, b, bt, rest, tr, t0, t1));
      }
    }
  }
  const chordOf = (prog, b, tr = 0) => { const [r, n] = CH[PROG[prog][b % 4]]; return [r + tr, n.map(x => x + tr)]; };
  const steps = (bt, rest, fn) => { for (let i = 0; i < 16; i++) { const tt = bt + i * SIX; if (tt >= bt + rest - .01) break; fn(i, tt); } };
  function funkDrums(bt, rest, o = {}) {
    steps(bt, rest, (i, tt) => {
      if ([0, 6, 8, 11].includes(i) || (o.busy && i === 14)) kick(tt, i === 0 ? .85 : .6);
      if (i === 4 || i === 12) snare(tt, o.sn ?? .3);
      if (o.ghost && [7, 9, 15].includes(i)) snare(tt, .06);
      if (o.hat) hat(tt, (i % 4 === 2 ? 1.3 : i % 2 ? .5 : .8) * o.hat, o.open && i === 14);
    });
  }
  function bassRiff(bt, rest, root, v = .19, cut = 700, patt = FUNK) {
    for (const [st, semi, len, vel] of patt) { const tt = bt + st * SIX; if (tt < bt + rest - .01) bass(tt, root + semi - 12, len * SIX * .9, v * (vel ?? 1), cut); }
  }
  function clavComp(bt, rest, notes, v = .04) {
    for (const st of [2, 5, 6, 10, 13, 14]) { const tt = bt + st * SIX; if (tt < bt + rest - .01) clav(tt, notes.slice(-3).map(m => m + 12), .1, v); }
  }
  function theme(bt, v = .06, tr = 0, cut = 3200) { for (const [b0, m, d] of THEME) brass(bt + b0 * BEAT, m + tr, d * BEAT, v, cut); }

  function bar(kind, b, bt, rest, tr, t0, t1) {
    const full = rest >= BAR - .01;
    switch (kind) {
      case 'chill': {
        const [r, n] = chordOf('vamp', b, tr);
        rhodes(bt, n[0] + 12, BAR * .9, .035); rhodes(bt, n[1] + 12, BAR * .9, .03); rhodes(bt + BEAT * 1.5, n[2] + 12, BEAT * 2, .03); rhodes(bt + BEAT * 1.5, n[3] + 12, BEAT * 2, .025);
        bass(bt, r - 12, BEAT * 1.4, .15, 500); if (BEAT * 2.5 < rest) bass(bt + BEAT * 2.5, r - 12 + 7, BEAT * .8, .1, 500);
        steps(bt, rest, (i, tt) => { if (i % 2 === 0) hat(tt, i % 4 ? .025 : .035); if (i === 0 || i === 10) kick(tt, .45); if (i === 4 || i === 12) snare(tt, .1); });
        break;
      }
      case 'hush': {
        if (b === 0) pad(bt, t1 - bt, [52, 59, 66], .022, 700);
        break;
      }
      case 'drone': {
        if (b === 0) { pad(bt, t1 - bt, [40, 47], .03, 260); trem(bt, t1 - bt, [76, 77], .006, 3000); }
        break;
      }
      case 'build': {
        if (b === 0) { trem(bt, t1 - bt, [52, 59, 64, 67], .03, 1800); riser(Math.max(bt, t1 - 2.5), Math.min(2.5, t1 - bt), .09); }
        const n = Math.round(rest / (SIX * (b > 0 ? 1 : 2)));
        for (let i = 0; i < n; i++) { const tt = bt + i * rest / n; timp(tt, 40, .08 + (tt - t0) / (t1 - t0) * .22); }
        break;
      }
      case 'main': case 'groove': case 'credits': {
        const [r, n] = chordOf('main', b, tr);
        const fade = kind === 'credits' ? Math.max(0, 1 - (bt - t0) / (t1 - t0) * .85) : 1;
        funkDrums(bt, rest, { hat: .055 * fade, ghost: true, busy: kind !== 'groove', open: b % 2 === 1, sn: .3 * fade });
        bassRiff(bt, rest, r, .18 * fade, 750);
        clavComp(bt, rest, n, (kind === 'groove' ? .03 : .04) * fade);
        steps(bt, rest, (i, tt) => { if (i % 2 === 1) chick(tt, .035 * fade); });
        if (kind !== 'groove' && b % 4 === 0 && full && (t1 - bt) > BAR * 2 - .05) { theme(bt, .055 * fade); if (b === 0) cymbal(bt, .12); }
        if (kind === 'groove' && b % 8 === 7 && full) stab(bt + BEAT * 3.5, [56, 62, 67], .03);
        if (kind !== 'groove' && b % 4 === 2 && full) { stab(bt + BEAT * 2.5, n.slice(-3).map(m => m + 12), .03); stab(bt + BEAT * 3.5, n.slice(-3).map(m => m + 12), .03); }
        break;
      }
      case 'walk': {
        const [r] = chordOf('vamp', 0, tr);
        for (const [st, semi] of WALK) { const tt = bt + st * SIX; if (tt < bt + rest - .01) bass(tt, r + semi - 12, SIX * 1.6, .15, 600); }
        steps(bt, rest, (i, tt) => {
          if (i % 2 === 0) shaker(tt, .025);
          if ([0, 3, 6, 10, 12].includes(i)) conga(tt, [220, 330, 220, 260, 330][[0, 3, 6, 10, 12].indexOf(i)], .14);
          if (i === 8 && b % 2) chick(tt, .05);
        });
        if (b % 4 === 0) pad(bt, Math.min(rest * 4, t1 - bt), [55, 62, 66], .014, 900);
        break;
      }
      case 'suspense': case 'lineup': {
        if (b % 2 === 0) { trem(bt, Math.min(BAR * 2, t1 - bt), [52, 58, 63], .022, 1400); piano(bt, 28, 3, .14); piano(bt, 40, 3, .08); }
        kick(bt, .5); if (BEAT * .45 < rest) kick(bt + BEAT * .45, .3);
        if (kind === 'lineup') { steps(bt, rest, (i, tt) => snare(tt, .03 + (tt - t0) / (t1 - t0) * .12)); }
        break;
      }
      case 'gloom': {
        const [r, n] = chordOf('dark', b, tr);
        pad(bt, rest, n, .024, 700);
        if (b % 2 === 0) piano(bt, r - 12, 3, .12);
        if (b % 2 === 1) rhodes(bt + BEAT, n[2] + 12, BEAT * 2, .025);
        break;
      }
      case 'rise': {
        const k = (bt - t0) / Math.max(.1, t1 - t0);
        if (b === 0) { riser(bt, t1 - bt, .1); trem(bt, t1 - bt, [52, 59, 64], .02, 1200); }
        const n = Math.max(2, Math.round(4 + k * 12));
        for (let i = 0; i < n; i++) { const tt = bt + i * rest / n; if (tt < t1) hat(tt, .03 + k * .04); }
        if (t1 - bt < BAR + .05) steps(bt, rest, (i, tt) => snare(tt, .05 + i * .012));
        break;
      }
      case 'clockwork': {
        const [r, n] = chordOf('vamp', b, tr);
        steps(bt, rest, (i, tt) => { hat(tt, i % 4 === 0 ? .06 : .03); if (i === 0 || i === 8) kick(tt, .6); if (i === 12) snare(tt, .18); });
        for (let i = 0; i < 8; i++) { const tt = bt + i * SIX * 2; if (tt < bt + rest - .01) bass(tt, r - 12 + (i % 4 === 3 ? 7 : 0), SIX * 1.6, .13, 550); }
        if (b % 2 === 0) clav(bt + SIX * 6, n.slice(-3).map(m => m + 12), .1, .03);
        if (b % 4 === 0) pad(bt, Math.min(BAR * 4, t1 - bt), n, .013, 900);
        break;
      }
      case 'denoue': {
        const [r, n] = chordOf('main', b, tr);
        funkDrums(bt, rest, { hat: .04, ghost: true, sn: .2 });
        bassRiff(bt, rest, r, .15, 650);
        clavComp(bt, rest, n, .032);
        if (b % 4 === 3 && full) rhodes(bt + BEAT * 2, n[3] + 12, BEAT * 2, .035);
        break;
      }
      case 'bright': {
        const [r, n] = chordOf('bright', b, tr);
        n.forEach((m, i) => rhodes(bt + i * SIX * 2, m + 12, BAR * .8, .03));
        bass(bt, r - 12, BEAT * 1.4, .15, 600); if (BEAT * 2.5 < rest) bass(bt + BEAT * 2.5, r, BEAT * .8, .1, 600);
        steps(bt, rest, (i, tt) => { if (i % 2 === 0) hat(tt, .03); if (i === 0 || i === 10) kick(tt, .5); if (i === 4 || i === 12) snare(tt, .14); if (i % 4 === 2) shaker(tt, .03); });
        if (b === 0) { cymbal(bt, .08); }
        break;
      }
      case 'triumph': {
        const [r, n] = chordOf('tri', b, tr);
        funkDrums(bt, rest, { hat: .06, ghost: true, busy: true, open: true, sn: .34 });
        bassRiff(bt, rest, r, .19, 800);
        clavComp(bt, rest, n, .04);
        if (b % 2 === 0 && (t1 - bt) > BAR * 2 - .05) { theme(bt, .06, 0, 3800); cymbal(bt, .12); }
        break;
      }
      case 'mystery': {
        const [r, n] = chordOf(b % 2 ? 'outro' : 'vamp', b, tr);
        const seq = [0, 2, 1, 3, 2, 0, 3, 1];
        for (let i = 0; i < 8; i++) { const tt = bt + i * SIX * 2; if (tt < bt + rest - .01) rhodes(tt, n[seq[i] % n.length] + 12, SIX * 3, .028); }
        pad(bt, rest, [n[0], n[2]], .016, 800);
        if (b % 2 === 0) conga(bt + BEAT * 3, 180, .1);
        break;
      }
      case 'outro': {
        const [r, n] = chordOf('outro', b, tr);
        kick(bt, .6); if (BEAT * 2 < rest) snare(bt + BEAT * 2, .22);
        steps(bt, rest, (i, tt) => { if (i % 4 === 2) hat(tt, .03); });
        n.forEach((m, i) => rhodes(bt + i * .02, m + 12, BAR * .9, .025));
        bass(bt, r - 12, BAR * .45, .14, 450); if (BEAT * 2.5 < rest) bass(bt + BEAT * 2.5, r - 12 + 7, BEAT, .1, 450);
        if (b % 4 === 1 && (t1 - bt) > BAR * 2 - .05) theme(bt, .035, 0, 1300);
        break;
      }
    }
  }

  // ---------- 効果音 ----------
  if (mode !== 'music') {
    for (const [t, kind, o] of SEQ) at(t - .05, () => fx(t, kind, o || {}));
  }
  function beep(t, f, d, v, type = 'sine', out = sfx) { const gn = g(out, 0); env(gn, T(t), .002, v, d); osc(type, f, T(t), d, gn); return gn; }
  function zap(t, f0, f1, d, v, type = 'sawtooth') {
    const gn = g(sfx, 0); env(gn, T(t), .003, v, d);
    const o = osc(type, f0, T(t), d, filt('lowpass', 4000, 1, gn)); o.frequency.setValueAtTime(f0, T(t)); o.frequency.exponentialRampToValueAtTime(f1, T(t) + d);
  }
  function hiss(t, d, v, f0, f1, type = 'bandpass', q = 2) {
    const gn = g(sfx, 0); gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(v, T(t) + d * .3); gn.gain.linearRampToValueAtTime(0, T(t) + d);
    const f = filt(type, f0, q, gn); f.frequency.setValueAtTime(f0, T(t)); f.frequency.exponentialRampToValueAtTime(f1, T(t) + d);
    noise(T(t), d, f);
  }
  function knock(t, f = 900, v = .2, d = .05) { const gn = g(sfx, 0); env(gn, T(t), .001, v, d); noise(T(t), d + .02, filt('bandpass', f, 2, gn)); beep(t, f * .2, d, v * .5, 'sine'); }
  function brassHit(t, notes, v = .07, d = .5) {
    for (const m of notes) {
      const gn = g(sfx, 0); gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(v, T(t) + .015); gn.gain.exponentialRampToValueAtTime(.0001, T(t) + d);
      const f = filt('lowpass', 4000, 1.2, gn);
      for (const det of [-10, 0, 9]) { const o = osc('sawtooth', mtof(m), T(t), d + .05, f); o.detune.value = det; }
      send(gn, .5, verb);
    }
  }
  function crash(t, v = .15) { const gn = g(sfx, 0); env(gn, T(t), .002, v, 2.2); noise(T(t), 2.4, filt('highpass', 4800, .6, gn)); send(gn, .5, verb); }
  function timpS(t, m = 40, v = .4) { const gn = g(sfx, 0); env(gn, T(t), .004, v, 1); const o = osc('sine', mtof(m), T(t), 1.1, gn); o.frequency.setValueAtTime(mtof(m) * 1.05, T(t)); o.frequency.exponentialRampToValueAtTime(mtof(m), T(t) + .08); send(gn, .4, verb); }
  function fx(t, kind, o) {
    switch (kind) {
      case 'pin': knock(t, 1400, .14, .03); beep(t + .01, 190, .05, .08, 'sine'); break;
      case 'tape': hiss(t, .2, .1, 1800, 5200, 'bandpass', 1.5); break;
      case 'pop': beep(t, 620 + ((o.i || 0) % 4) * 60, .05, .07); beep(t + .04, 940 + ((o.i || 0) % 4) * 60, .06, .06); break;
      case 'ok': beep(t, mtof(79), .12, .08, 'triangle'); beep(t + .09, mtof(86), .25, .08, 'triangle'); break;
      case 'x': beep(t, 150, .1, .1, 'square'); beep(t + .09, 120, .14, .1, 'square'); break;
      case 'stamp': boom(t, .3, sfx); knock(t, 700, .25, .08); break;
      case 'stampS': knock(t, 800, .18, .06); beep(t, 110, .1, .1); break;
      case 'stampB': boom(t, .55, sfx); knock(t, 500, .35, .12); crash(t, .05); break;
      case 'marker': hiss(t, .35, .05, 2600, 3600, 'bandpass', 6); break;
      case 'type': { const n = o.n || 8, r = o.rate || 14; for (let i = 0; i < n; i++) knock(t + i / r + (rnd() - .5) * .02, 2600 + (i % 3) * 300, .09, .02); break; }
      case 'key': knock(t, 3000, .08, .02); break;
      case 'click': knock(t, 3200, .14, .015); knock(t + .07, 2800, .1, .015); break;
      case 'thud': boom(t, .45, sfx); break;
      case 'errpop': for (let i = 0; i < 4; i++) beep(t + i * .07, 330 - i * 20, .1, .09, 'square'); break;
      case 'whoosh': hiss(t, .5, .14, 400, 3500); break;
      case 'shutter': knock(t, 2500, .2, .02); hiss(t + .02, .12, .12, 6000, 2000, 'highpass'); knock(t + .1, 1800, .14, .02); break;
      case 'deny': beep(t, 180, .16, .12, 'square'); beep(t + .12, 135, .24, .12, 'square'); break;
      case 'chime': [76, 81, 86, 88].forEach((m, i) => beep(t + i * .07, mtof(m), .5, .05, 'triangle')); break;
      case 'twang': { const gn = g(sfx, 0); env(gn, T(t), .002, .1, .7); const ox = osc('triangle', 260, T(t), .8, gn); ox.frequency.setValueAtTime(320, T(t)); ox.frequency.exponentialRampToValueAtTime(180, T(t) + .6); hiss(t, .9, .05, 300, 1200); break; }
      case 'twangS': { const gn = g(sfx, 0); env(gn, T(t), .002, .06, .3); const ox = osc('triangle', 300, T(t), .35, gn); ox.frequency.exponentialRampToValueAtTime(220, T(t) + .3); break; }
      case 'tense': brassHit(t, [40, 47, 52], .05, 1.2); break;
      case 'tick': knock(t, 4200, .06, .012); break;
      case 'clock': knock(t, (o.i || 0) % 2 ? 3600 : 4400, .07 * (o.v ?? 1), .012); break;
      case 'scratch': { zap(t, 900, 200, .18, .12, 'sawtooth'); hiss(t, .25, .14, 3000, 400, 'bandpass', 3); break; }
      case 'riser': hiss(t, o.d || .8, .12, 300, 6000); break;
      case 'msg': beep(t, mtof(84), .1, .06, 'sine'); beep(t + .09, mtof(91), .18, .05, 'sine'); break;
      case 'teams': [79, 84, 88].forEach((m, i) => beep(t + i * .1, mtof(m), .35, .07, 'sine')); break;
      case 'hitR': brassHit(t, [52, 56, 62, 67], .06, .7); timpS(t, 40, .45); crash(t, .12); break;
      case 'reveal': brassHit(t, [40, 52, 56, 62, 67, 71], .06, 1.4); timpS(t, 40, .55); crash(t, .18); boom(t, .5, sfx); break;
      case 'ffwd': { const d = o.d || 8; const gn = g(sfx, 0); gn.gain.setValueAtTime(0, T(t)); gn.gain.linearRampToValueAtTime(.025, T(t) + .3); gn.gain.setValueAtTime(.025, T(t) + d - .3); gn.gain.linearRampToValueAtTime(0, T(t) + d); const ox = osc('sawtooth', 1400, T(t), d, filt('bandpass', 1800, 3, gn)); ox.frequency.linearRampToValueAtTime(1700, T(t) + d); break; }
      case 'ding': beep(t, mtof(88), .9, .07, 'sine'); beep(t, mtof(100), .4, .02, 'sine'); break;
      case 'xray': hiss(t, 1.2, .08, 600, 5000, 'bandpass', 5); beep(t, 1200, 1.0, .02, 'sine'); break;
      case 'watch': knock(t, 3800, .14, .02); beep(t + .05, 2400, .05, .05, 'square'); break;
      case 'title1': boom(t, .6, sfx); hiss(t, 1.0, .1, 4000, 300, 'lowpass', 1); break;
      case 'title2': brassHit(t, [40, 52, 59, 64, 67, 71], .07, 1.8); timpS(t, 40, .6); crash(t, .2); boom(t, .55, sfx); break;
      case 'swamp': for (let i = 0; i < 6; i++) zap(t + i * .18, 160 + i * 30, 60, .2, .06, 'sine'); break;
      case 'plop': zap(t, 300, 900, .08, .08, 'sine'); break;
      case 'slap': knock(t, 1200, .3, .06); hiss(t, .15, .15, 3000, 800, 'lowpass', 1); brassHit(t + .15, [64, 70], .04, .35); brassHit(t + .5, [62, 67], .04, .5); break;
      case 'lamp': knock(t, 2000, .2, .02); beep(t + .05, 120, .5, .015, 'sawtooth'); break;
      case 'lock': knock(t, 2600, .14, .02); knock(t + .06, 1800, .14, .03); break;
      case 'idea': [84, 88, 91, 96].forEach((m, i) => beep(t + i * .06, mtof(m), .4, .045, 'triangle')); break;
      case 'gavel': knock(t, 600, .35, .1); boom(t, .35, sfx); break;
      case 'cut': for (let i = 0; i < 6; i++) { const gn = g(sfx, 0); env(gn, T(t + i * .03), .001, .08, .02); noise(T(t + i * .03), .03, filt('bandpass', 600 + ((i * 71) % 9) * 500, 4, gn)); } break;
    }
  }

  const run = (limit, skip = -Infinity) => {
    for (const e of EV) if (!e.done && e[0] < limit) { e.done = true; if (e[0] >= skip) e[1](); }
  };
  return { run, EV };
}

// bgm.mp3 用の書き出し（mode = 'music'）
window.renderAudio = async function (mode = 'music') {
  const dur = TLD.duration + 1;
  const ac = new OfflineAudioContext(2, Math.ceil(dur * SR), SR);
  const { run } = buildScore(ac, ac.destination, mode);
  const WIN = 4;
  run(WIN + .5);
  for (let w = WIN; w < dur; w += WIN) ac.suspend(w).then(() => { run(w + WIN + .5); ac.resume(); });
  const buf = await ac.startRendering();
  const L0 = buf.getChannelData(0), R0 = buf.getChannelData(1);
  const pcm = new Int16Array(L0.length * 2);
  for (let i = 0; i < L0.length; i++) {
    pcm[i * 2] = Math.max(-1, Math.min(1, L0[i])) * 32767;
    pcm[i * 2 + 1] = Math.max(-1, Math.min(1, R0[i])) * 32767;
  }
  window.__PCM = new Uint8Array(pcm.buffer);
  return { sampleRate: SR, bytes: window.__PCM.length };
};

// HTML 版の効果音: 再生位置 from から、ムービーの 0 秒 = ac の base 秒として、少し先の分ずつ鳴らす
window.liveSE = function (ac, dest) {
  let timer = 0, out = null;
  return {
    start(from, base) {
      this.stop();
      out = ac.createGain(); out.connect(dest);
      const sc = buildScore(ac, out, 'se', base);
      const step = () => sc.run(ac.currentTime - base + 1.5, from - .05);
      step(); timer = setInterval(step, 100);
    },
    stop() {
      clearInterval(timer);
      if (!out) return;
      const o = out, now = ac.currentTime;
      o.gain.setValueAtTime(o.gain.value, now); o.gain.linearRampToValueAtTime(0, now + .05);
      setTimeout(() => o.disconnect(), 300);
      out = null;
    },
  };
};

window.audioChunk = function (i, size) {
  const sub = window.__PCM.subarray(i * size, (i + 1) * size);
  let s = '';
  for (let k = 0; k < sub.length; k += 0x8000) s += String.fromCharCode.apply(null, sub.subarray(k, k + 0x8000));
  return btoa(s);
};

function fit() {
